server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep the Console same-origin API boundary. The upstream receives the
  # complete /api/... URI (proxy_pass intentionally has no trailing slash).
  location /api/ {
    proxy_pass http://ani-gateway.ani-system.svc.cluster.local:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  # TanStack Router uses client-side routes; serve the SPA shell on misses.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
