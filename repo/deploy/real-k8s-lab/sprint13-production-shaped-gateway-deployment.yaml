apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-gateway
  namespace: ani-system
  labels:
    app.kubernetes.io/name: ani-gateway
    ani.dev/profile: sprint13-production-shaped
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ani-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ani-gateway
        ani.dev/profile: sprint13-production-shaped
    spec:
      serviceAccountName: ani-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # helm and the vcluster CLI write to HOME (Helm repository cache and
        # vcluster state). The image HOME is /home/ani, which is owned by root
        # and therefore not writable by uid 65532; fsGroup plus the emptyDir
        # mounted at /home/ani below makes that path writable.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ani-gateway
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          command:
            - /opt/ani/bin/ani-gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ANI_AUTH_MODE
              value: auth_service
            - name: AUTH_SERVICE_ADDR
              value: ani-auth-service.ani-system.svc.cluster.local:9101
            # Object-backed model materialization is configured through the
            # non-secret ConfigMap. Signed URLs and object-store credentials
            # are requested only by the tenant fetcher at runtime.
            - name: MODEL_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_service_grpc_addr
                  optional: false
            - name: MODEL_FETCHER_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_fetcher_grpc_addr
                  optional: false
            - name: MODEL_FETCHER_IMAGE_REF
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_fetcher_image_ref
                  optional: false
            # MinIO HTTP is an explicit lab-only opt-in. Keep production
            # shaped gateways fail-closed unless an operator deliberately
            # changes this value for a controlled in-cluster endpoint.
            - name: MODEL_FETCHER_ALLOW_INSECURE_HTTP
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_fetcher_allow_insecure_http
                  optional: false
            - name: KUBERNETES_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: KUBERNETES_SERVICE_ACCOUNT_CA_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: KUBERNETES_PROVIDER_FIELD_MANAGER
              value: ani-gateway-sprint13-production-shaped
            - name: REGISTRY_PROVIDER_MODE
              value: harbor
            - name: HARBOR_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-harbor-runtime
                  key: endpoint
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ani-harbor-runtime
                  key: username
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ani-harbor-runtime
                  key: password
            - name: HARBOR_REQUEST_TIMEOUT
              value: 10s
            - name: REGISTRY_PULL_SECRET_FIELD_MANAGER
              value: ani-gateway-registry
            - name: NETWORK_PROVIDER
              value: kubeovn_rest
            - name: NETWORK_PROVIDER_APPLY_ENABLED
              value: "true"
            - name: NETWORK_PROVIDER_USER_ID
              value: ani-core-network-provider
            - name: NETWORK_PROVIDER_PERMISSION_PROOF
              value: rbac-scope:networks.write
            - name: STORAGE_PROVIDER
              value: kubernetes_rest
            - name: STORAGE_PROVIDER_APPLY_ENABLED
              value: "true"
            - name: STORAGE_PROVIDER_USER_ID
              value: ani-core-storage-provider
            - name: STORAGE_PROVIDER_PERMISSION_PROOF
              value: rbac-scope:storage.write
            - name: GPU_INVENTORY_PROVIDER
              value: kubernetes_rest
            - name: K8S_CLUSTER_PROVIDER_MODE
              value: vcluster_helm
            - name: K8S_CLUSTER_PROXY_MODE
              value: forwarding_metadata
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-gateway-production-shaped-runtime
                  key: database_url
            - name: VCLUSTER_HELM_BINARY
              value: /usr/local/bin/helm
            - name: VCLUSTER_BINARY
              value: /usr/local/bin/vcluster
            # vCluster chart is distributed through the internal Harbor OCI
            # registry. charts.loft.sh is not reachable from the cluster, so a
            # remote HTTP repository cannot be used here. VCLUSTER_CHART_REPO
            # = none tells the provider to omit --repo for OCI references.
            - name: VCLUSTER_CHART_NAME
              value: oci://docker.changqingyun.cn/ani/charts/vcluster
            - name: VCLUSTER_CHART_REPO
              value: none
            - name: VCLUSTER_CHART_VERSION
              value: 0.34.1
            # Tenant namespaces are bound to per-tenant kube-ovn VPC subnets,
            # which have no route to the cluster service CIDR. The vCluster
            # control plane pod must therefore be pinned to the cluster default
            # overlay, the same way PlatformWorkload pods are; otherwise the
            # syncer cannot reach the host API server and crashes with
            # "dial tcp <service-cidr>: i/o timeout".
            - name: VCLUSTER_HELM_SET_VALUES
              value: 'controlPlane.statefulSet.persistence.volumeClaim.storageClass=ani-rbd-ssd,controlPlane.statefulSet.pods.annotations.ovn\.kubernetes\.io/logical_switch=ovn-default,controlPlane.statefulSet.pods.annotations.ovn\.kubernetes\.io/vpc=ovn-cluster'
            - name: VCLUSTER_PROXY_SERVER_TEMPLATE
              value: https://{cluster_id}.{namespace}:443
            - name: VCLUSTER_KUBECONFIG_SERVER_TEMPLATE
              value: https://{cluster_id}.{namespace}:443
            - name: OBJECT_STORE_PROVIDER
              value: minio
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: endpoint
            - name: OBJECT_STORE_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: public_endpoint
            - name: OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: access_key_id
            - name: OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: secret_access_key
            - name: OBJECT_STORE_REGION
              value: us-east-1
            - name: OBJECT_STORE_SECURE
              value: "false"
            - name: OBJECT_STORE_BUCKET_PREFIX
              value: ani-s13-
            - name: VECTOR_STORE_PROVIDER
              value: milvus
            - name: VECTOR_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-vectorstore-production-shaped-runtime
                  key: endpoint
            - name: VECTOR_STORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ani-vectorstore-production-shaped-runtime
                  key: token
            - name: VECTOR_STORE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ani-vectorstore-production-shaped-runtime
                  key: database
            - name: VECTOR_STORE_COLLECTION_PREFIX
              value: ani_s13_
            - name: INSTANCE_OBSERVABILITY_PROVIDER
              value: prometheus_kubernetes
            - name: INSTANCE_OBSERVABILITY_PROMETHEUS_URL
              value: http://sprint13-prometheus.ani-s07-observability.svc.cluster.local:9090
            - name: SESSION_GATEWAY_GRPC_ADDR
              value: ani-session-gateway-grpc.ani-system.svc.cluster.local:9090
            - name: SESSION_GATEWAY_GRPC_TIMEOUT
              value: 5s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ani-gateway-bin
              mountPath: /opt/ani/bin
              readOnly: true
            - name: ani-gateway-helm-cache
              mountPath: /home/ani
      volumes:
        - name: ani-gateway-bin
          hostPath:
            path: /opt/ani/bin
            type: Directory
        - name: ani-gateway-helm-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ani-gateway
  namespace: ani-system
  labels:
    app.kubernetes.io/name: ani-gateway
    ani.dev/profile: sprint13-production-shaped
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ani-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
