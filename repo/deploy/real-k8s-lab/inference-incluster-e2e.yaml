              mountPath: /var/run/ani/model-service-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: model-service-tls
          secret:
            secretName: model-service-grpc-tls
            optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-import-worker
  namespace: ani-system
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: model-import-worker
    ani.dev/profile: inference-incluster-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-import-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ani-platform
        app.kubernetes.io/name: model-import-worker
        ani.dev/profile: inference-incluster-e2e
    spec:
      nodeSelector:
        kubernetes.io/hostname: kubercloud
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-import-worker
          # Release-supplied immutable digest. The remote-import contract
          # requires this to match ConfigMap model_import_worker_image_ref;
          # an unconfigured template must fail closed rather than selecting a
          # mutable or guessed image reference.
          image: docker.changqingyun.cn/ani/model-import-worker@sha256:48d848902033c4a8eca6556c1f8606f9efe86ddc52de240fa796706960475ebb
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: database_url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: nats_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: redis_url
            - name: OBJECT_STORE_PROVIDER
              value: minio
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: endpoint
            - name: OBJECT_STORE_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: public_endpoint
            - name: OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: access_key_id
            - name: OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: secret_access_key
            - name: OBJECT_STORE_REGION
              value: us-east-1
            - name: OBJECT_STORE_SECURE
              value: "false"
            - name: OBJECT_STORE_BUCKET_PREFIX
              value: ani-s13-
            # Archive bounds are intentionally below the 4Gi /tmp emptyDir so
            # the streamed tar.gz and filesystem overhead cannot exhaust the
            # worker workspace. The worker rejects overrides above this cap.
            - name: MODEL_IMPORT_MAX_FILES
              value: "10000"
            - name: MODEL_IMPORT_MAX_TOTAL_BYTES
              value: "3221225472"
            - name: MODEL_IMPORT_MAX_FILE_BYTES
              value: "3221225472"
            - name: MODEL_IMPORT_MAX_OUTPUT_BYTES
              value: "3221225472"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: archive-workspace
              mountPath: /tmp
      volumes:
        - name: archive-workspace
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
