  namespace: ani-system
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: model-service
    ani.dev/profile: inference-incluster-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ani-platform
        app.kubernetes.io/name: model-service
        ani.dev/profile: inference-incluster-e2e
    spec:
      nodeSelector:
        kubernetes.io/hostname: kubercloud
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-service
          image: docker.changqingyun.cn/ani/model-service@sha256:c8f0c2cbae8a8bbd124009170280b4a7394b00233316e0ec95a8044e1e984a1b
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9103
            - name: fetcher-grpc
              containerPort: 9105
            - name: health
              containerPort: 9203
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: database_url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: nats_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: redis_url
            - name: OBJECT_STORE_PROVIDER
              value: minio
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: endpoint
            - name: OBJECT_STORE_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: public_endpoint
            - name: OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: access_key_id
            - name: OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ani-objectstore-production-shaped-runtime
                  key: secret_access_key
            - name: OBJECT_STORE_REGION
              value: us-east-1
            - name: OBJECT_STORE_SECURE
              value: "false"
            - name: OBJECT_STORE_BUCKET_PREFIX
              value: ani-s13-
            - name: GRPC_PORT
              value: "9103"
            - name: MODEL_FETCHER_GRPC_PORT
              value: "9105"
            - name: HEALTH_PORT
              value: "9203"
            - name: MODEL_SERVICE_TLS_CERT_FILE
              value: /var/run/ani/model-service-tls/tls.crt
            - name: MODEL_SERVICE_TLS_KEY_FILE
              value: /var/run/ani/model-service-tls/tls.key
            - name: MODEL_SERVICE_TLS_CLIENT_CA_FILE
              value: /var/run/ani/model-service-tls/ca.crt
          volumeMounts:
