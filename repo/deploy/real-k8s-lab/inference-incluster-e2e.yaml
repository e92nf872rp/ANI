apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-gateway-inference-platform-workload
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: ani-gateway
    ani.dev/profile: inference-incluster-e2e
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ani-gateway-inference-platform-workload
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: ani-gateway
    ani.dev/profile: inference-incluster-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ani-gateway-inference-platform-workload
subjects:
  - kind: ServiceAccount
    name: ani-gateway
    namespace: ani-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ani-inference-materialization
  namespace: ani-system
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: inference-service
    ani.dev/profile: inference-incluster-e2e
data:
  model_service_grpc_addr: model-service.ani-system.svc.cluster.local:9103
  model_fetcher_grpc_addr: model-service.ani-system.svc.cluster.local:9105
  # Release-provided immutable digest-pinned model-fetcher image used by
  # object-backed inference services. Leave empty only in an unconfigured
  # template; the profile then fails closed instead of selecting a tag.
  model_fetcher_image_ref: docker.changqingyun.cn/ani/model-fetcher@sha256:3026fc390af93265df9f6eb1c191942d03947e61d7af3bc29644a857c17605ba
  # HTTP downloads are disabled by default. Set true only for a controlled
  # in-cluster MinIO endpoint; public object URLs must remain HTTPS.
  # Keep HTTP downloads disabled by default; operators may override this only
  # through an explicitly approved, environment-specific deployment overlay.
  model_fetcher_allow_insecure_http: "false"
  # Release-provided immutable digest-pinned model-import-worker image. Keep
  # this value identical to the Deployment image below; an unconfigured
  # template must leave both empty and never invent or resolve a mutable tag.
  model_import_worker_image_ref: docker.changqingyun.cn/ani/model-import-worker@sha256:48d848902033c4a8eca6556c1f8606f9efe86ddc52de240fa796706960475ebb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: ani-system
  labels:
    app.kubernetes.io/part-of: ani-platform
    app.kubernetes.io/name: inference-service
    ani.dev/profile: inference-incluster-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ani-platform
        app.kubernetes.io/name: inference-service
        ani.dev/profile: inference-incluster-e2e
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-service
          image: docker.changqingyun.cn/ani/inference-service@sha256:9fd58e4a794db7649f6babe7f228f602717fdc3be3ca68910e72da629585b5c2
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9104
            - name: health
              containerPort: 9204
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: database_url
            - name: INFERENCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: database_url
            # Background leases must see all inference tenants; never grant
            # BYPASSRLS to the ordinary request-path application account.
            - name: INFERENCE_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ani-inference-platform-runtime
                  key: database_url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: nats_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ani-services-runtime
                  key: redis_url
            - name: GRPC_PORT
              value: "9104"
            - name: HEALTH_PORT
              value: "9204"
            - name: CORE_API_BASE_URL
              value: http://ani-gateway.ani-system.svc.cluster.local:8080
            - name: CORE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-c21-core-token
                  key: token
            - name: MODEL_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_service_grpc_addr
            - name: MODEL_FETCHER_IMAGE_REF
              valueFrom:
                configMapKeyRef:
                  name: ani-inference-materialization
                  key: model_fetcher_image_ref
            - name: AUTH_SERVICE_GRPC_ADDR
              value: ani-auth-service.ani-system.svc.cluster.local:9101
            - name: AUTH_SERVICE_MINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inference-mint
                  key: credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
