apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-gpu-scheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ani-gpu-scheduler
    app.kubernetes.io/part-of: ani-platform
    ani.kubercloud.io/stage: gpu-spec-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-gpu-queue-manager
  labels:
    app.kubernetes.io/name: ani-gpu-queue-manager
    app.kubernetes.io/part-of: ani-platform
    ani.kubercloud.io/stage: gpu-spec-a
rules:
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - queues
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ani.kubercloud.io
  resources:
  - gpuspecs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ani-gpu-queue-manager
  labels:
    app.kubernetes.io/name: ani-gpu-queue-manager
    app.kubernetes.io/part-of: ani-platform
    ani.kubercloud.io/stage: gpu-spec-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ani-gpu-queue-manager
subjects:
- kind: ServiceAccount
  name: ani-gpu-scheduler
  namespace: kube-system
