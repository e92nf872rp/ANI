version: 1
exceptions:
  - path: services/model-service/main.go
    rule: core_internal_go_import
    import: github.com/kubercloud/ani/pkg/bootstrap
    status: accepted_baseline
    owner: ANI Services 团队
    reason: model-service 入口仍直接调用 Core `pkg/bootstrap` 的连接与 gRPC 启动装配，属于 Services 冻结前保留的现存 wiring 事实
    disposition: 受控解冻时迁移为 Services 自有启动与依赖装配；迁移前仅作为精确存量例外告警，不得扩散到新文件
  - path: services/model-service/internal/config/config.go
    rule: core_internal_go_import
    import: github.com/kubercloud/ani/pkg/bootstrap
    status: accepted_baseline
    owner: ANI Services 团队
    reason: model-service 配置仍直接返回 Core `bootstrap.Config`，属于 Services 冻结前保留的现存类型耦合事实
    disposition: 受控解冻时迁移为 Services 自有配置类型；迁移前仅作为精确存量例外告警，不得扩散到新文件
  - path: services/inference-service/main.go
    rule: core_internal_go_import
    import: github.com/kubercloud/ani/pkg/bootstrap
    status: accepted_baseline
    owner: ANI Services 团队
    reason: inference-service 入口与 model-service/auth-service 对齐，复用 Core `pkg/bootstrap` 的连接与 gRPC 启动装配
    disposition: 仅限进程入口 wiring；Creator/Controller/repository 不得导入 Core ports/adapters，也不得把 Core 内部 gRPC 当跨层契约
  - path: services/inference-service/internal/config/config.go
    rule: core_internal_go_import
    import: github.com/kubercloud/ani/pkg/bootstrap
    status: accepted_baseline
    owner: ANI Services 团队
    reason: inference-service 配置嵌入 `bootstrap.Config`，与 model-service/auth-service 启动约定对齐
    disposition: 仅限配置装配；业务控制面不得依赖 Core ports/adapters
  # rag-engine pymilvus provider_sdk_python_import entry removed in Issue #039
  # (RAG refactor Step 11 — delete old path). rag-engine no longer imports pymilvus.
