# Component SDK imports outside pkg/adapters and pkg/bootstrap require an
# explicit coupling level. Availability and stability take priority over
# extensibility: direct bindings are allowed only when bounded and justified.
#
# coupling_level:
#   port_required            - temporary debt; must migrate behind pkg/ports.
#   adapter_with_extensions  - basic capability uses a port; advanced capability
#                              may use provider-specific extension interfaces.
#   bounded_direct           - strategic direct binding in a bounded module.
#                              Common cases: Kubernetes adapter/controller,
#                              preflight/e2e, or PostgreSQL/RLS persistence.
#                              It must not leak into gateway handlers, Core
#                              domain services, or ANI Services business code.
#   temporary_exception      - short-lived migration exception with migrate_by.
allowed:
  - path: pkg/repo/outbox_repo.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: PostgreSQL outbox repository is a bounded persistence module; pgx transaction semantics preserve atomicity and outbox stability
  - path: pkg/repo/task_repo.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: PostgreSQL task repository is a bounded persistence module; direct pgx keeps RLS, locking, and lease transitions explicit
  - path: pkg/types/tenant.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
    reason: RLS tenant helper is PostgreSQL-specific platform metadata plumbing and must remain explicit for stability
  - path: services/auth-service/internal/service/api_keys.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgtype
      - github.com/jackc/pgx/v5/pgxpool
    reason: API key persistence is a bounded auth metadata module; direct pgx preserves RLS-safe transactions and typed nullable fields
  - path: services/auth-service/internal/service/auth_service.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: auth service currently wires a bounded API key persistence module that owns PostgreSQL/RLS access
  - path: services/auth-service/internal/service/permissions.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: V2 permission store is a bounded auth metadata module; direct pgx keeps authoritative permission reads and tenant RLS semantics explicit
  - path: services/auth-service/internal/service/token_blocklist.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: JWT revocation uses PostgreSQL as a bounded durability fallback plus CacheStore for fast-path validation
  - path: services/auth-service/internal/service/refresh_tokens.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: Refresh token persistence is a bounded auth metadata module and must remain durable across cache restarts
  - path: services/auth-service/internal/service/oidc_sessions.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: OIDC callback persists users, role mappings, and refresh tokens in a bounded auth metadata module
  - path: services/metering-service/internal/service/metering_collection_service.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5/pgxpool
    reason: Metering collection service is a bounded persistence module; direct pgxpool keeps BYPASSRLS writes and ON CONFLICT idempotency explicit for metering_usage_records
  - path: services/task-service/internal/service/task_service.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: task worker mutation path uses explicit PostgreSQL transactions for lease correctness and outbox atomicity
  - path: services/task-service/internal/worker/outbox_publisher.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5/pgxpool
    reason: outbox scanner is a bounded platform worker that must read cross-tenant unpublished events transactionally
  - path: services/model-service/internal/repo/model_repo.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgxpool
    reason: PostgreSQL model repository is a bounded persistence module; direct pgx keeps RLS and transaction behavior explicit
  - path: services/model-service/internal/service/model_service.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5/pgxpool
    reason: model service currently wires a bounded model repository that owns PostgreSQL/RLS access
  - path: services/inference-service/internal/repository/postgres.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgconn
      - github.com/jackc/pgx/v5/pgxpool
    reason: inference-service PostgreSQL repository is a bounded persistence adapter; direct pgx keeps tenant RLS transactions, advisory idempotency locking, generation CAS, and SKIP LOCKED operation leases explicit
  - path: services/tenant-service/internal/repo/adapters/postgres/tenant_plan_store.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/pgconn
      - github.com/jackc/pgx/v5/pgxpool
    reason: tenant plan repository is a bounded persistence module; direct pgx keeps PostgreSQL/RLS transactions explicit and maps unique/FK/not-found to domain errors
  - path: services/tenant-service/internal/repo/adapters/postgres/tenant_plan_audit_store.go
    coupling_level: bounded_direct
    imports:
      - github.com/jackc/pgx/v5/pgxpool
    reason: tenant plan audit repository is a bounded persistence module; direct pgx keeps audit-log writes and RLS rows explicit
  # ── kb-service: asyncpg direct PG (bounded_direct, RLS explicit) ──────────
  - path: services/kb-service/main.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: kb-service owns a bounded persistence module for 7 KB tables; direct asyncpg keeps RLS tenant context and multi-table atomic transactions (outbox/session+message) explicit
  - path: services/kb-service/app/api/grpc_server.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: kb-service gRPC servicer uses explicit PostgreSQL transactions for multi-table atomic writes (NotifyDocumentUploaded outbox fold, Query session+message fold)
  - path: services/kb-service/app/repositories/knowledge_base.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: knowledge_bases repository is a bounded persistence module; direct asyncpg keeps RLS-scoped CRUD explicit
  - path: services/kb-service/app/repositories/document.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: kb_documents repository is a bounded persistence module; direct asyncpg keeps parse_status lifecycle writes and RLS explicit
  - path: services/kb-service/app/repositories/chunk.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: kb_chunks repository is a bounded persistence module; direct asyncpg keeps pg_trgm keyword search and GIN index semantics explicit
  - path: services/kb-service/app/repositories/message.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: kb_messages/kb_sessions repository is a bounded persistence module; direct asyncpg keeps session+message atomic writes and RLS explicit
  - path: services/kb-service/app/repositories/async_task.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: async_tasks repository is a bounded persistence module; direct asyncpg keeps idempotency-key atomic UPSERT explicit
  - path: services/kb-service/app/repositories/outbox.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: outbox_events repository is a bounded persistence module; direct asyncpg keeps cross-tenant event scanning and RLS bypass explicit
  - path: services/kb-service/app/outbox/dispatcher.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: outbox dispatcher is a bounded platform worker that must read cross-tenant unpublished events transactionally
  - path: services/kb-service/app/repositories/rls.py
    coupling_level: bounded_direct
    imports:
      - asyncpg
    reason: RLS tenant context helper is PostgreSQL-specific platform metadata plumbing and must remain explicit for stability
  # ── rag-engine: asyncpg direct PG (temporary_exception — Phase 2 removes) ──
  - path: ai/rag-engine/main.py
    coupling_level: temporary_exception
    imports:
      - asyncpg
    reason: rag-engine temporarily owns an asyncpg pool for kb_chunks writes and parse_status updates during the parse pipeline
    migrate_by: Phase 2 — KB gRPC API replaces direct PG access
  - path: ai/rag-engine/app/repositories/chunks.py
    coupling_level: temporary_exception
    imports:
      - asyncpg
    reason: rag-engine temporarily writes kb_chunks directly; will be replaced by kb-service WriteChunks gRPC API
    migrate_by: Phase 2 — KB gRPC API replaces direct PG access
  - path: ai/rag-engine/app/workers/parse_worker.py
    coupling_level: temporary_exception
    imports:
      - asyncpg
    reason: rag-engine temporarily updates kb_documents.parse_status directly; will be replaced by kb-service UpdateParseStatus gRPC API
    migrate_by: Phase 2 — KB gRPC API replaces direct PG access
  - path: ai/rag-engine/app/routers/query.py
    coupling_level: temporary_exception
    imports:
      - asyncpg
    reason: rag-engine temporarily checks KB existence via direct PG query; will be replaced by kb-service KBExists gRPC API
    migrate_by: Phase 2 — KB gRPC API replaces direct PG access
  - path: ai/rag-engine/app/services/retrieve_service.py
    coupling_level: temporary_exception
    imports:
      - asyncpg
    reason: rag-engine temporarily runs pg_trgm keyword search and parent backfill via direct PG; will be replaced by kb-service KeywordSearch and GetParentChunks gRPC APIs
    migrate_by: Phase 2 — KB gRPC API replaces direct PG access
  # ── rag-engine: pymilvus direct Milvus (bounded_direct) ────────────────────
  - path: ai/rag-engine/app/core/milvus.py
    coupling_level: bounded_direct
    imports:
      - pymilvus
      - llama_index.vector_stores.milvus
    reason: rag-engine owns the vector data path (embedding + indexing + retrieval); direct pymilvus keeps HNSW index params, collection lifecycle, and COSINE similarity semantics explicit. Vector store management (create/delete collection) goes through Core API via kb-service; only the data path (insert/search) remains direct
