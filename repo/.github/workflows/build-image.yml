name: Build & Push Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true

env:
  REGISTRY_HOST: harbor.ani.internal
  REGISTRY: harbor.ani.internal/ani

jobs:
  runtime-services:
    name: Build controlled runtime ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ani-gateway
            image: ani-gateway
            dockerfile: services/ani-gateway/Dockerfile
          - service: auth-service
            image: ani-auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: model-service
            image: model-service
            dockerfile: services/model-service/Dockerfile
          - service: task-service
            image: task-service
            dockerfile: services/task-service/Dockerfile
          - service: inference-service
            image: inference-service
            dockerfile: services/inference-service/Dockerfile
          - service: tenant-service
            image: tenant-service
            dockerfile: services/tenant-service/Dockerfile
          - service: metering-service
            image: metering-service
            dockerfile: services/metering-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build runtime image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Record digest evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/${{ matrix.service }}.digest.txt"
          printf '%s@%s\n' \
            '${{ env.REGISTRY }}/${{ matrix.image }}' \
            '${{ steps.build.outputs.digest }}' > "$evidence"

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.digest.txt
          if-no-files-found: error
          retention-days: 30

  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: ani-gateway
            context: services/ani-gateway
          - name: inference-operator
            context: operators/inference-operator
          - name: upgrade-operator
            context: operators/upgrade-operator
          - name: rag-engine
            context: ai/rag-engine
          - name: doc-parser
            context: ai/doc-parser

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service.name }}:buildcache,mode=max

      # 镜像安全扫描（阻断 HIGH/CRITICAL 漏洞）
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}"
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # 镜像签名（Cosign）
      - name: Sign image (Cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}
