syntax = "proto3";

package tenant.v1;

import "common/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/kubercloud/ani/pkg/generated/pb/tenant/v1;tenantv1";

// TenantPlanService manages the BOSS quota-policy tenant plans.
// Tenant plans are platform-level (admin) resources; the gateway (BOSS API)
// handles auth/scope and calls this service over gRPC.
service TenantPlanService {
  // ListTenantPlans returns a cursor-paginated list of plans.
  rpc ListTenantPlans(ListTenantPlansRequest) returns (ListTenantPlansResponse);
  // CreateTenantPlan creates a plan with its quota dimensions.
  rpc CreateTenantPlan(CreateTenantPlanRequest) returns (IdempotentResult);
  // GetTenantPlan returns a plan by ID.
  rpc GetTenantPlan(GetTenantPlanRequest) returns (TenantPlan);
  // UpdateTenantPlan updates plan name/description (optional fields; unset = no change).
  rpc UpdateTenantPlan(UpdateTenantPlanRequest) returns (IdempotentResult);
  // DeleteTenantPlan soft-deletes a plan (fails if tenants are bound).
  rpc DeleteTenantPlan(DeleteTenantPlanRequest) returns (IdempotentResult);
  // GetTenantPlanQuotaLimits returns the display views of a plan's quota limits.
  rpc GetTenantPlanQuotaLimits(GetTenantPlanQuotaLimitsRequest) returns (GetTenantPlanQuotaLimitsResponse);
  // UpdateTenantPlanQuotaLimits updates a plan's quota limits and syncs bound tenants.
  rpc UpdateTenantPlanQuotaLimits(UpdateTenantPlanQuotaLimitsRequest) returns (IdempotentResult);
  // ActivateTenantPlan publishes a plan (draft/disabled -> active).
  rpc ActivateTenantPlan(ActivateTenantPlanRequest) returns (IdempotentResult);
  // DisableTenantPlan disables a plan (active -> disabled).
  rpc DisableTenantPlan(DisableTenantPlanRequest) returns (IdempotentResult);
  // ListTenantPlanBoundTenants returns bound tenant summaries.
  rpc ListTenantPlanBoundTenants(ListTenantPlanBoundTenantsRequest) returns (ListTenantPlanBoundTenantsResponse);
  // ListBindableTenants returns tenants that can bind to the plan (status≠disabled and not already bound).
  rpc ListBindableTenants(ListBindableTenantsRequest) returns (ListBindableTenantsResponse);
  // ListTenantPlanAuditLogs returns paginated audit logs for a plan.
  rpc ListTenantPlanAuditLogs(ListTenantPlanAuditLogsRequest) returns (ListTenantPlanAuditLogsResponse);
  // ListQuotaMeta returns enabled quota dimension metadata from Core (passthrough).
  rpc ListQuotaMeta(ListQuotaMetaRequest) returns (ListQuotaMetaResponse);
}

// TenantService manages tenant-plan binding (BindPlanQuota).
service TenantService {
  // BindPlanQuota binds a quota plan to a tenant and pushes effective quota to Core.
  rpc BindPlanQuota(BindPlanQuotaRequest) returns (IdempotentResult);
}

// ── TenantPlan RPC request / response ────────────────────────────────────────

message ListTenantPlansRequest {
  string status  = 1;  // filter by status: draft | active | disabled; empty = all
  string search  = 2;  // fuzzy match name
  common.v1.CursorPageRequest page = 3;
}

message ListTenantPlansResponse {
  repeated TenantPlan items = 1;
  int64 total = 2;          // 满足筛选条件的总条数（用于前端分页）
  string next_cursor = 3;   // 下一页游标；空字符串表示已无更多数据
}

message CreateTenantPlanRequest {
  string code = 1;          // unique business code
  string name = 2;          // plan name
  string description = 3;   // optional
  repeated PlanQuotaLimitInput quota_limits = 4; // optional dimension limits
  string idempotency_key = 5;  // 幂等键（必传）
}

message GetTenantPlanRequest {
  string plan_id = 1;
}

// UpdateTenantPlanRequest 更新套餐基本信息（US-016）。
// name / description：未设置 = 不更新；设置为空串 = 清空。
message UpdateTenantPlanRequest {
  string plan_id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue description = 3;
  string idempotency_key = 4; // 可选幂等键
}

message DeleteTenantPlanRequest {
  string plan_id = 1;
}

message GetTenantPlanQuotaLimitsRequest {
  string plan_id = 1;
}

message GetTenantPlanQuotaLimitsResponse {
  repeated PlanQuotaLimitView items = 1;
}

message UpdateTenantPlanQuotaLimitsRequest {
  string plan_id = 1;
  repeated PlanQuotaLimitInput items = 2; // total nil = use default_quota
  string idempotency_key = 3;  // 幂等键（必传）
}

message ActivateTenantPlanRequest {
  string plan_id = 1;
  string idempotency_key = 2;  // 幂等键（必传）
}

message DisableTenantPlanRequest {
  string plan_id = 1;
  string idempotency_key = 2;  // 幂等键（必传）
}

message ListTenantPlanBoundTenantsRequest {
  string plan_id = 1;
}

message ListTenantPlanBoundTenantsResponse {
  repeated BoundTenant items = 1;
}

// ListBindableTenantsRequest 查询可绑定该套餐的租户（US-018）。
message ListBindableTenantsRequest {
  string plan_id = 1;
}

message ListBindableTenantsResponse {
  repeated BoundTenant items = 1; // 复用 BoundTenant 摘要
}

message ListTenantPlanAuditLogsRequest {
  string plan_id = 1;
  common.v1.CursorPageRequest page = 2;
}

message ListTenantPlanAuditLogsResponse {
  repeated AuditLog items = 1;
  int64 total = 2;          // 满足筛选条件的总条数（用于前端分页）
  string next_cursor = 3;   // 下一页游标；空字符串表示已无更多数据
}

// ListQuotaMetaRequest 查询可用配额维度元数据（无入参；透传 Core）。
message ListQuotaMetaRequest {}

message ListQuotaMetaResponse {
  repeated QuotaMetaItem items = 1;
}

// QuotaMetaItem 对齐 Core GET /admin/quota-meta 单项（仅 enabled 维度）。
message QuotaMetaItem {
  string resource_type = 1;
  string display_name = 2;
  string unit = 3;
  int64 default_quota = 4;
  bool is_discrete = 5;
}

// ── BindPlanQuota RPC request / response ─────────────────────────────────────

message BindPlanQuotaRequest {
  string tenant_id = 1;
  string plan_id  = 2;
  string idempotency_key = 3;  // 幂等键（必传）
}

// IdempotentResult is returned by all idempotent write RPCs.
// 对齐 HTTP 层 IdempotentResult（{id, message}）。
message IdempotentResult {
  string id = 1;          // 资源 id（如 plan_id / tenant_id）
  string message = 2;     // 操作结果消息（如 "tenant plan created"）
}

// ── Quota limit input / view ─────────────────────────────────────────────────

// PlanQuotaLimitInput is a single quota dimension write input.
// total omitted (nil) means "use the dimension default".
message PlanQuotaLimitInput {
  string resource_type = 1;
  google.protobuf.Int64Value total = 2; // nil = use default_quota
}

// PlanQuotaLimitView is the display view; total is already COALESCE'd.
message PlanQuotaLimitView {
  string resource_type = 1;
  string display_name  = 2;
  string unit          = 3;
  int64  total         = 4;
}

// ── Domain messages ──────────────────────────────────────────────────────────

message TenantPlan {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string status = 5;             // draft | active | disabled
  int64  tenant_count = 6;       // bound tenant count (computed)
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message BoundTenant {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string status = 4;             // active | frozen | disabled
}

// AuditLog 是套餐操作历史列表项（id / action / result / details / created_at）。
message AuditLog {
  string id = 1;
  string action = 2;
  string result = 3;             // success | failure
  google.protobuf.Struct details = 4;
  google.protobuf.Timestamp created_at = 5;
}
