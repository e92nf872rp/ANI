syntax = "proto3";

// Package tenant.integration.v1 is the immutable major-version contract owned
// by Core. Changes within v1 are additive and backward compatible. A breaking
// change requires a new versioned package and subject plus an explicit
// dual-publish, dual-consume, and old-version retirement gate.
package tenant.integration.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kubercloud/ani/pkg/generated/pb/tenant/integration/v1;tenantintegrationv1";

// TenantIAMIntegrationService is a Core-owned, read-only snapshot contract.
// Core remains the only writer of Tenant ID and Tenant Lifecycle. IAM cannot
// update lifecycle state through this service or a shared database/transaction.
service TenantIAMIntegrationService {
  rpc BeginTenantLifecycleSnapshot(BeginTenantLifecycleSnapshotRequest) returns (BeginTenantLifecycleSnapshotResponse);
  rpc ListTenantLifecycleSnapshotPage(ListTenantLifecycleSnapshotPageRequest) returns (ListTenantLifecycleSnapshotPageResponse);
}

// TenantLifecycleStatus is the complete Core-owned lifecycle state.
enum TenantLifecycleStatus {
  TENANT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  TENANT_LIFECYCLE_STATUS_ACTIVE = 1;
  TENANT_LIFECYCLE_STATUS_FROZEN = 2;
  TENANT_LIFECYCLE_STATUS_DISABLED = 3;
}

// TenantLifecycleReason is stable, non-PII context for a lifecycle fact.
enum TenantLifecycleReason {
  TENANT_LIFECYCLE_REASON_UNSPECIFIED = 0;
  TENANT_LIFECYCLE_REASON_CREATED = 1;
  TENANT_LIFECYCLE_REASON_ADMINISTRATIVE_FREEZE = 2;
  TENANT_LIFECYCLE_REASON_BILLING_SUSPENSION = 3;
  TENANT_LIFECYCLE_REASON_USER_REQUESTED_DEACTIVATION = 4;
  TENANT_LIFECYCLE_REASON_RESTORED = 5;
}

// CoreIntegrationErrorReason is carried in google.rpc.ErrorInfo.reason.
enum CoreIntegrationErrorReason {
  CORE_INTEGRATION_ERROR_REASON_UNSPECIFIED = 0;
  CORE_INTEGRATION_ERROR_REASON_INVALID_ARGUMENT = 1;
  CORE_INTEGRATION_ERROR_REASON_SCHEMA_MAJOR_UNSUPPORTED = 2;
  CORE_INTEGRATION_ERROR_REASON_SNAPSHOT_CURSOR_INVALID = 3;
  CORE_INTEGRATION_ERROR_REASON_SNAPSHOT_CURSOR_EXPIRED = 4;
  CORE_INTEGRATION_ERROR_REASON_SNAPSHOT_PAGE_TOKEN_INVALID = 5;
  CORE_INTEGRATION_ERROR_REASON_SNAPSHOT_UNAVAILABLE = 6;
}

// IntegrationEnvelope is common to each Core-produced integration fact or command.
// aggregate_version is strictly monotonic per Tenant lifecycle aggregate. A
// duplicate or older version is idempotently ignored; a gap freezes only the
// affected Tenant projection until repaired from the snapshot contract.
message IntegrationEnvelope {
  string event_id = 1;
  uint32 schema_major = 2;
  string producer = 3;
  string tenant_id = 4;
  uint64 aggregate_version = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string correlation_id = 7;
  string causation_id = 8;
  string operation_id = 9;
  string traceparent = 10;
}

// TenantLifecycleChanged is a state-carrying fact, never an imperative delta.
// It is published on ani.integration.tenant.lifecycle.v1.
message TenantLifecycleChanged {
  IntegrationEnvelope envelope = 1;
  TenantLifecycleStatus status = 2;
  TenantLifecycleReason reason = 3;
  google.protobuf.Timestamp effective_at = 4;
}

// IntendedAdministrator carries only the normalized identity needed for bootstrap.
message IntendedAdministrator {
  string normalized_email = 1;
  string locale = 2;
}

// TenantIAMBootstrapRequested is idempotent by operation ID and payload fingerprint.
// It is published on ani.integration.tenant.iam-bootstrap.v1. payload_fingerprint
// is sha256 over UTF-8 JSON with lexicographically ordered keys and no optional
// whitespace: locale, normalized_email, operation_id, tenant_id.
message TenantIAMBootstrapRequested {
  IntegrationEnvelope envelope = 1;
  IntendedAdministrator intended_administrator = 2;
  string payload_fingerprint = 3;
}

// TenantLifecycleHeartbeat traverses the same outbox and stream path as lifecycle facts.
// It is published on ani.integration.tenant.lifecycle-heartbeat.v1.
message TenantLifecycleHeartbeat {
  string heartbeat_id = 1;
  uint32 schema_major = 2;
  string producer = 3;
  uint64 stream_sequence = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// TenantLifecycleSnapshotItem is one complete Core-owned Tenant lifecycle fact.
message TenantLifecycleSnapshotItem {
  string tenant_id = 1;
  TenantLifecycleStatus status = 2;
  TenantLifecycleReason reason = 3;
  uint64 lifecycle_version = 4;
  google.protobuf.Timestamp effective_at = 5;
}

// TenantLifecycleSnapshotPage is bound to one opaque consistent cursor. Every
// page for the cursor has the same snapshot_version; an empty next_page_token
// marks completion. Tokens are not portable between cursors.
message TenantLifecycleSnapshotPage {
  string cursor = 1;
  repeated TenantLifecycleSnapshotItem items = 2;
  string next_page_token = 3;
  uint64 snapshot_version = 4;
}

message BeginTenantLifecycleSnapshotRequest {
  uint32 schema_major = 1;
  uint32 page_size = 2;
}

message BeginTenantLifecycleSnapshotResponse {
  // cursor identifies a consistent read-only snapshot and is opaque to IAM.
  string cursor = 1;
  // first_page_token is used only with the returned cursor.
  string first_page_token = 2;
  uint64 snapshot_version = 3;
}

message ListTenantLifecycleSnapshotPageRequest {
  uint32 schema_major = 1;
  // cursor must be the exact value returned by BeginTenantLifecycleSnapshot.
  string cursor = 2;
  // page_token must belong to cursor; an empty value requests the first page.
  string page_token = 3;
  uint32 page_size = 4;
}

message ListTenantLifecycleSnapshotPageResponse {
  TenantLifecycleSnapshotPage page = 1;
}
