syntax = "proto3";

package auth.v1;

import "common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kubercloud/ani/pkg/generated/pb/auth/v1;authv1";

// AuthService handles authentication and authorization.
service AuthService {
  rpc Login(LoginRequest) returns (TokenPair);
  rpc PlatformPasswordLogin(PlatformPasswordLoginRequest) returns (TokenPair);
  rpc BeginOIDCLogin(BeginOIDCLoginRequest) returns (BeginOIDCLoginResponse);
  rpc CompleteOIDCLogin(CompleteOIDCLoginRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (AccessToken);
  rpc RevokeToken(RevokeTokenRequest) returns (google.protobuf.Empty);

  // ValidateToken is called internally by the ANI Gateway Auth middleware.
  // Returns the TenantContext if the token is valid; returns UNAUTHENTICATED otherwise.
  rpc ValidateToken(ValidateTokenRequest) returns (common.v1.TenantContext);

  // ValidatePrincipal is the V2 credential validation RPC.
  // Returns a canonical PrincipalContext without legacy scope/roles.
  rpc ValidatePrincipal(ValidatePrincipalRequest) returns (PrincipalContext);

  // IssueServiceToken mints a short-lived service JWT for cluster-internal Core calls.
  // It is not a tenant HTTP product API and must not be published on Gateway.
  rpc IssueServiceToken(IssueServiceTokenRequest) returns (AccessToken);

  // CheckPermission is called by the RBAC middleware.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // CheckPermissionV2 is the V2 authorization RPC.
  // Re-validates the raw credential and compares the Gateway principal before
  // reading authoritative permissions.
  rpc CheckPermissionV2(AuthorizationRequest) returns (AuthorizationDecision);

  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (google.protobuf.Empty);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string tenant_name = 3;   // tenant slug to scope the login
  string idempotency_key = 4;   // optional; pattern ^[A-Za-z0-9_-]{1,128}$
}

message PlatformPasswordLoginRequest {
  string username = 1;
  string password = 2;
  string idempotency_key = 3;   // optional; pattern ^[A-Za-z0-9_-]{1,128}$
}

message BeginOIDCLoginRequest {
  string tenant_name = 1;    // tenant slug to scope the login
  string redirect_uri = 2;   // callback URL registered in Dex/OIDC client
}

message BeginOIDCLoginResponse {
  string authorization_url = 1;
  string state = 2;
}

message CompleteOIDCLoginRequest {
  string state = 1;
  string code = 2;
  string redirect_uri = 3;
}

message TokenPair {
  string access_token        = 1;
  string refresh_token       = 2;
  int32  expires_in          = 3;   // access token TTL in seconds
  google.protobuf.Timestamp issued_at = 4;
}

message AccessToken {
  string access_token = 1;
  int32  expires_in   = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RevokeTokenRequest {
  string jti = 1;   // JWT ID to add to blocklist
}

message ValidateTokenRequest {
  string token = 1;   // raw JWT or API key value
}

message IssueServiceTokenRequest {
  string caller_service = 1; // allowlisted internal caller, e.g. inference-service
  string caller_secret  = 2; // compared to AUTH_SERVICE_MINT_CREDENTIALS; never logged
  string tenant_id      = 3;
  string scope          = 4 [deprecated = true]; // legacy projection; prefer permissions
  int32  ttl_seconds    = 5; // optional; default 300, max 3600

  // V2 additive fields.
  repeated string permissions = 6;     // permission set, format scope:<resource>:<action>
  string credential_domain    = 7;     // tenant|platform
}

message ValidatePrincipalRequest {
  string credential        = 1; // raw JWT or API key value; never logged
  string credential_scheme = 2; // bearer|api_key
}

message PrincipalContext {
  string principal_kind    = 1; // user|service|api_key
  string credential_scheme = 2; // bearer|api_key
  string credential_domain = 3; // tenant|platform
  string tenant_id         = 4; // must be empty for platform domain
  string subject_id        = 5;
  string credential_id     = 6; // API key credential id; empty for JWT
}

message AuthorizationRequest {
  PrincipalContext principal       = 1;
  string resource                 = 2;
  string action                    = 3;
  string required_boundary         = 4; // own|tenant|platform
  string operation_id              = 5;
  string credential                = 6; // must be re-validated; never logged
  string credential_scheme         = 7; // bearer|api_key
}

message AuthorizationDecision {
  bool allowed    = 1;
  string reason_code = 2; // ALLOWED|PERMISSION_DENIED|PRINCIPAL_MISMATCH|CREDENTIAL_DOMAIN_MISMATCH
}

message CheckPermissionRequest {
  string tenant_id  = 1;
  string user_id    = 2;
  repeated string roles = 3;
  string resource   = 4;   // e.g. "models"
  string action     = 5;   // e.g. "delete"
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;   // set when allowed=false
}

message CreateAPIKeyRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string name      = 3;
  repeated string scopes = 4;
  int32  rate_limit_rpm  = 5;      // optional; <=0 defaults to 60, max 10000
  google.protobuf.Timestamp expires_at = 6;   // optional
}

message CreateAPIKeyResponse {
  string key_id     = 1;
  string key_value  = 2;   // shown ONCE; never stored in plaintext
  string key_prefix = 3;   // e.g. "ani_prod_xxxx" for UI display
}

message ListAPIKeysRequest {
  string tenant_id = 1;
  string user_id   = 2;   // empty = all keys for tenant
}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
}

message APIKeyInfo {
  string id           = 1;
  string name         = 2;
  string key_prefix   = 3;
  repeated string scopes = 4;
  int32  rate_limit_rpm  = 5;
  google.protobuf.Timestamp created_at  = 6;
  google.protobuf.Timestamp expires_at  = 7;
  google.protobuf.Timestamp last_used_at = 8;
  bool   is_active    = 9;
}

message RevokeAPIKeyRequest {
  string tenant_id = 1;
  string key_id    = 2;
}
