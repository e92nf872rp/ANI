syntax = "proto3";

package inference.internal.v1;

option go_package = "github.com/kubercloud/ani/pkg/generated/pb/inference/internalendpoint/v1;inferenceinternalv1";

// InferenceEndpointResolver 是 service-to-service 内部 RPC（kb-service 数据面
// 专用）：按 (tenant_id, served_model_name) 解析推理服务的集群内运行时地址。
// 不经过 AI Gateway，不校验租户 JWT 或用户 API Key；runtime endpoint 绝不
// 对租户暴露。
//
// 注：proto 包名固定为 inference.internal.v1（对外 gRPC 方法全名
// inference.internal.v1.InferenceEndpointResolver/ResolveInternalEndpoint），
// 但文件目录用 internalendpoint——Go 对字面 internal 目录有可见性限制，
// 跨模块的 pkg/generated/pb 不允许该命名。
service InferenceEndpointResolver {
  rpc ResolveInternalEndpoint(ResolveInternalEndpointRequest)
      returns (ResolveInternalEndpointResponse);
}

message ResolveInternalEndpointRequest {
  string tenant_id = 1;
  // 首选查询键：租户内 active 服务名唯一（部分唯一索引）。
  string served_model_name = 2;
  // 旧 service_id 查询仍兼容；仅在 served_model_name 为空时使用。
  string service_id = 3;
}

message ResolveInternalEndpointResponse {
  // OpenAI 客户端 base URL（集群内 SVC 地址快照）。调用方不得永久缓存：
  // 遇 404/503/endpoint 错误须重新解析。
  string base_url = 1;
  // 实际模型名：后续 OpenAI 请求体中的 model 必须使用该值。
  string served_model_name = 2;
  // generate | embed
  string task = 3;
  // 服务状态；解析成功的隐含契约是 status = running。
  string status = 4;
}
