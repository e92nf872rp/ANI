syntax = "proto3";

package inference.control.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kubercloud/ani/pkg/generated/pb/inference/control/v1;inferencecontrolv1";

// InferenceControl is the Gateway → inference-service internal API.
// It projects the approved Services OpenAPI InferenceService surface.
// It is not a tenant-facing product contract and must not revive
// inference.v1.InferenceServiceRPC (GetEndpointURL / UpdateStatus / operator).
service InferenceControl {
  rpc ListInferenceServices(ListInferenceServicesRequest) returns (ListInferenceServicesResponse);
  rpc CreateInferenceService(CreateInferenceServiceRequest) returns (InferenceService);
  rpc GetInferenceService(GetInferenceServiceRequest) returns (InferenceService);
  rpc ScaleInferenceService(ScaleInferenceServiceRequest) returns (InferenceOperation);
  rpc DeleteInferenceService(DeleteInferenceServiceRequest) returns (InferenceOperation);
  rpc ApplyInferenceServiceLifecycle(ApplyInferenceServiceLifecycleRequest) returns (InferenceOperation);
  rpc GetInferenceOperation(GetInferenceOperationRequest) returns (InferenceOperation);
  rpc ListInferenceServiceLogs(ListInferenceServiceLogsRequest) returns (ListInferenceServiceLogsResponse);
  rpc ListInferenceAccessPolicies(ListInferenceAccessPoliciesRequest) returns (ListInferenceAccessPoliciesResponse);
  rpc CreateInferenceAccessPolicy(CreateInferenceAccessPolicyRequest) returns (InferenceAccessPolicy);
  rpc GetInferenceAccessPolicy(GetInferenceAccessPolicyRequest) returns (InferenceAccessPolicy);
  rpc PatchInferenceAccessPolicy(PatchInferenceAccessPolicyRequest) returns (InferenceAccessPolicy);
  rpc DeleteInferenceAccessPolicy(DeleteInferenceAccessPolicyRequest) returns (DeleteInferenceAccessPolicyResponse);
  rpc ListInferenceServicePolicies(ListInferenceServicePoliciesRequest) returns (InferenceServicePolicies);
  rpc UpdateInferenceServicePolicies(UpdateInferenceServicePoliciesRequest) returns (InferenceServicePolicies);
  rpc ListInferencePolicyEvents(ListInferencePolicyEventsRequest) returns (InferencePolicyEventListResponse);
  rpc CheckInferenceAccess(CheckInferenceAccessRequest) returns (CheckInferenceAccessResponse);
  rpc ReleaseInferenceAccessLease(ReleaseInferenceAccessLeaseRequest) returns (ReleaseInferenceAccessLeaseResponse);
}

message ListInferenceServicesRequest {
  string tenant_id = 1;
}

message ListInferenceServicesResponse {
  repeated InferenceService items = 1;
}

message CreateInferenceServiceRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string name = 3;
  string model = 4;
  string model_version_id = 5;
  string served_model_name = 6;
  int32 replicas = 7;
  InferenceServiceResources resources = 8;
  string placement_mode = 9;
  string gpu_type = 10;
  int32 gpu_count_per_pod = 11;
  string image_id = 12;
  string image_ref = 13;
  InferenceServiceEngine engine = 14;
}

message GetInferenceServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message ScaleInferenceServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  string idempotency_key = 3;
  int32 replicas = 4;
}

message DeleteInferenceServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message ApplyInferenceServiceLifecycleRequest {
  string tenant_id = 1;
  string service_id = 2;
  string idempotency_key = 3;
  string action = 4;
}

message GetInferenceOperationRequest {
  string tenant_id = 1;
  string operation_id = 2;
}

message ListInferenceServiceLogsRequest {
  string tenant_id = 1;
  string service_id = 2;
  int32 limit = 3;
  string cursor = 4;
  string level = 5;
}

message ListInferenceServiceLogsResponse {
  repeated InferenceServiceLogEntry items = 1;
  string next_cursor = 2;
}

message InferenceServiceLogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string level = 2;
  string message = 3;
  string container = 4;
  string stream = 5;
}

message InferenceService {
  string id = 1;
  string name = 2;
  string model = 3;
  string model_version_id = 4;
  string served_model_name = 5;
  int32 replicas = 6;
  int32 ready_replicas = 7;
  InferenceServiceResources resources = 8;
  string placement_mode = 9;
  string gpu_type = 10;
  int32 gpu_count_per_pod = 11;
  int32 max_concurrency = 12;
  string status = 13;
  string status_reason = 14;
  string status_message = 15;
  int64 generation = 16;
  int64 observed_generation = 17;
  string current_operation_id = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  string image_id = 21;
  string image_ref = 22;
  InferenceServiceEngine engine = 23;
  string invocation_url = 24;
}

message InferenceServiceEngine {
  repeated InferenceServiceEngineEnvVar env = 1;
  repeated string command = 2;
}

message InferenceServiceEngineEnvVar {
  string name = 1;
  string value = 2;
}

message InferenceServiceResources {
  string cpu = 1;
  string memory = 2;
  InferenceServiceAccelerator accelerator = 3;
}

message InferenceServiceAccelerator {
  // GPU 型号，例如 gpu-nvidia-geforce-rtx-4090。只表示型号，不表示整卡或 vGPU。
  // 历史 -full / -Nx 剥后缀后仍按型号处理。
  string spec_id = 1;
  // 每个副本申请的卡数。整卡和 vGPU 都必填，最小 1。
  int32 count_per_replica = 2;
  // 申请 GPU 显存，单位 MiB。内部 0 表示未填，按整卡；>=1=vGPU。
  // JSON 若出现 memory，必须 >= 1。不是 InferenceServiceResources.memory 的内存预算。
  int32 memory = 3;
}

message InferenceOperation {
  string id = 1;
  string task_type = 2;
  string resource_type = 3;
  string resource_id = 4;
  string idempotency_key = 5;
  string status = 6;
  int32 attempt_count = 7;
  int32 progress_pct = 8;
  string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message InferenceAccessPolicy {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string status = 4;
  string description = 5;
  int32 priority = 6;
  InferenceAccessPolicyScope scope = 7;
  InferenceAccessPolicyAccess access = 8;
  InferenceAccessPolicyRateLimits rate_limits = 9;
  InferenceAccessPolicyConcurrency concurrency = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message InferenceAccessPolicyScope { string type = 1; repeated string inference_service_ids = 2; repeated string api_key_ids = 3; }
message InferenceAccessPolicyAccess { bool allow_all_tenant_keys = 1; repeated string allow_api_key_ids = 2; repeated string deny_api_key_ids = 3; }
message InferenceAccessPolicyRateLimits { int32 qps = 1; int32 rpm = 2; }
message InferenceAccessPolicyConcurrency { int32 max_in_flight = 1; int32 lease_ttl_seconds = 2; }
message InferenceAccessPolicyBinding { string policy_id = 1; string inference_service_id = 2; int32 priority = 3; }
message InferenceAccessPolicyEvent {
  string id = 1; string tenant_id = 2; string policy_id = 3; string inference_service_id = 4;
  string api_key_id = 5; string key_prefix = 6; string request_id = 7; string openai_path = 8;
  string external_model = 9; string decision = 10; string reason_code = 11; int32 http_status = 12;
  int32 retry_after_seconds = 13; google.protobuf.Timestamp created_at = 14;
}
message ListInferenceAccessPoliciesRequest { string tenant_id = 1; }
message ListInferenceAccessPoliciesResponse { repeated InferenceAccessPolicy items = 1; }
message CreateInferenceAccessPolicyRequest { string tenant_id = 1; string idempotency_key = 2; InferenceAccessPolicy policy = 3; }
message GetInferenceAccessPolicyRequest { string tenant_id = 1; string policy_id = 2; }
message PatchInferenceAccessPolicyRequest {
  string tenant_id = 1;
  string policy_id = 2;
  string idempotency_key = 3;
  InferenceAccessPolicy policy = 4;
  // request_hash is computed by ANI Gateway from the original public PATCH
  // intent before it reads and merges the current policy state.
  string request_hash = 5;
}
message DeleteInferenceAccessPolicyRequest { string tenant_id = 1; string policy_id = 2; string idempotency_key = 3; }
message DeleteInferenceAccessPolicyResponse {}
message ListInferenceServicePoliciesRequest { string tenant_id = 1; string inference_service_id = 2; }
message InferenceServicePolicies { string inference_service_id = 1; repeated InferenceAccessPolicy policies = 2; }
message UpdateInferenceServicePoliciesRequest { string tenant_id = 1; string inference_service_id = 2; string idempotency_key = 3; repeated string policy_ids = 4; }
message ListInferencePolicyEventsRequest { string tenant_id = 1; string inference_service_id = 2; string policy_id = 3; string api_key_id = 4; string decision = 5; int32 limit = 6; string cursor = 7; }
message InferencePolicyEventListResponse { repeated InferenceAccessPolicyEvent items = 1; string next_cursor = 2; }
message CheckInferenceAccessRequest {
  string tenant_id = 1;
  string user_id = 2;
  string api_key_id = 3;
  string key_prefix = 4;
  reserved 5;
  reserved "inference_service_id";
  string served_model_name = 6;
  string openai_path = 7;
  string request_id = 8;
  bool stream = 9;
}
message CheckInferenceAccessResponse {
  string decision = 1;
  int32 http_status = 2;
  string reason_code = 3;
  string policy_id = 4;
  string lease_id = 5;
  int32 retry_after_seconds = 6;
  string inference_service_id = 7;
}
message ReleaseInferenceAccessLeaseRequest { string tenant_id = 1; string lease_id = 2; }
message ReleaseInferenceAccessLeaseResponse {}
