        "422": { $ref: '#/components/responses/PreconditionFailed' }
    post:
      operationId: createSandboxCheckpoint
      summary: 创建 Sandbox checkpoint
      description: |
        创建异步 checkpoint 任务。keep_memory=true 但 runtime 不支持内存 checkpoint 时返回 422；
        跨租户实例按 404 处理，非 sandbox kind、状态或 provider 能力不满足时返回 422。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:update"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSandboxCheckpointRequest' }
      responses:
        "202":
          description: checkpoint 创建任务已接受
          headers:
            Location:
              description: 任务查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }

