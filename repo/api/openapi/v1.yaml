  # ── 邮件通知（BOSS 平台级 SMTP 发信通道、收件人、事件订阅、测试发送）──────────────
  /notifications/email/smtp:
    get:
      operationId: getEmailSmtpConfig
      summary: 获取邮件 SMTP 发信通道配置
      description: |
        返回平台级 SMTP 发信通道配置。
        - configured=false 表示尚未配置（空态），其他字段可省略。
        - configured=true 时返回完整字段；password / auth_code 明文永不回显，
          仅返回 has_password / has_auth_code 布尔位。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:read"
      responses:
        "200":
          description: SMTP 配置（可能为空态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSmtpConfigResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putEmailSmtpConfig
      summary: 保存邮件 SMTP 发信通道配置
      description: |
        保存平台级 SMTP 发信通道配置。
        password 与 auth_code 独立保存、独立清除，服务端不强制二选一：
        - 省略或 null：不修改已有值
        - 空字符串 ""：清除已有值
        - 非空字符串：加密后覆盖
        发送邮件时若 auth_code 已设置则优先使用 auth_code，否则使用 password。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid }, description: "幂等键" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutEmailSmtpConfigRequest' }
      responses:
        "200":
          description: 配置已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSmtpConfigResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /notifications/email/recipients:
    get:
      operationId: listEmailRecipients
      summary: 列出邮件收件人
      description: 返回平台级全局收件人列表；所有已开启订阅的事件共用此列表。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:read"
      responses:
        "200":
          description: 收件人列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailRecipientListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEmailRecipient
      summary: 新增收件人
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmailRecipientRequest' }
      responses:
        "201":
          description: 收件人已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailRecipient' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /notifications/email/recipients/{recipient_id}:
    patch:
      operationId: updateEmailRecipient
      summary: 更新收件人（邮箱地址、备注、启停）
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: recipient_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmailRecipientRequest' }
      responses:
        "200":
          description: 收件人已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailRecipient' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteEmailRecipient
      summary: 删除收件人
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: recipient_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: 收件人已删除
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /notifications/email/subscriptions:
    get:
      operationId: listEmailSubscriptions
      summary: 列出邮件事件订阅
      description: 返回首期冻结的 5 个事件订阅开关状态。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:read"
      responses:
        "200":
          description: 订阅列表（固定 5 行）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSubscriptionListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putEmailSubscriptions
      summary: 批量保存邮件事件订阅
      description: 批量更新事件订阅开关；非行内 PATCH，整体提交。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutEmailSubscriptionsRequest' }
      responses:
        "200":
          description: 订阅已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSubscriptionListResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /notifications/email/test:
    post:
      operationId: sendTestEmail
      summary: 发送测试邮件
      description: |
        向所有启用的收件人发送一封测试邮件，验证 SMTP 通道与收件人可用性。
        前置条件：
        - SMTP 通道已配置（configured=true）
        - 至少一个启用中的收件人（enabled=true）
        - password 或 auth_code 至少设置一个
        不满足任一前置条件返回 422 PRECONDITION_FAILED。
      tags: [Notifications]
      x-ani-rbac-scope: "scope:notifications:write"
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 测试发送结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendTestEmailResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422":
          $ref: '#/components/responses/PreconditionFailed'
          description: "前置条件不满足（SMTP 未配置 / 无启用收件人 / 无凭据）"

  # ── 配额管理（Core API v1，平台级配额管理，scope=platform）──────────────────
  /quotas/me:
    get:
      operationId: getMyQuota
      summary: 查询当前租户配额
      description: |
        Console 租户自查配额。返回当前认证租户的所有维度配额视图。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      responses:
        "200":
          description: 当前租户配额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /quotas:
    get:
      operationId: listQuotas
      summary: BOSS 分页查询租户配额列表
      description: |
        BOSS 平台级分页查询所有租户配额。按租户维度展示配额分配总览。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      parameters:
        - { name: limit,  in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: 租户配额分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaListResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /admin/tenants/{tenant_id}/quota:
    post:
      operationId: createTenantQuota
      summary: 批量新建租户配额
      description: |
        为指定租户初始化多个资源维度配额行（used/reserved 初始为 0）。
        - items.resource_type 必须在 resource_quota_meta 已注册且 enabled=true
        - items.total 未提供或为 null 时取 resource_quota_meta.default_quota
        - 已存在的维度跳过（ON CONFLICT DO NOTHING），不阻断其余维度创建
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:write"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "客户端生成；同一 tenant_id 下 24 小时内去重" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaCreateRequest' }
      responses:
        "200":
          description: 新建结果（含已存在跳过的维度）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        "400": { $ref: '#/components/responses/QuotaValidationFailed' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }
        "409": { $ref: '#/components/responses/QuotaAlreadyExists' }
        "422": { $ref: '#/components/responses/QuotaResourceNotRegistered' }
    put:
      operationId: updateTenantQuota
      summary: 批量修改租户配额上限
      description: |
        只改 total，不影响 used/reserved。允许 total < used（缩容，已有资源继续运行，
        仅阻止后续新建 Try → ErrQuotaExceeded）。缩容时服务端用 GREATEST(total, used+reserved)
        clamp 到 used+reserved，并在返回的 items 中将 tightened 置 true。
        维度行不存在返回 QUOTA_NOT_FOUND（需先调 createTenantQuota）。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:write"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "客户端生成；同一 tenant_id 下 24 小时内去重" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaUpdateRequest' }
      responses:
        "200":
          description: 修改结果（含 tightened 标记）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        "400": { $ref: '#/components/responses/QuotaValidationFailed' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/QuotaNotFound' }
        "422": { $ref: '#/components/responses/QuotaResourceNotRegistered' }
    get:
      operationId: getTenantQuota
      summary: 查询租户配额
      description: |
        查询指定租户所有维度的 total/used/reserved + unit/display_name/is_discrete
        （JOIN resource_quota_meta）。租户不存在返回 404 TENANT_NOT_FOUND；租户存在但
        无配额行时返回空 items。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 租户配额视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }
    delete:
      operationId: deleteTenantQuota
      summary: 删除租户所有配额
      description: |
        删除该租户所有 resource_quota 行 + resource_reservations 流水。
        用于租户禁用/资源清理场景。由调用方保证此时无在用资源（本方法不强制守卫 used/reserved）。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:write"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "客户端生成；同一 tenant_id 下 24 小时内去重" }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaDeleteResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }

  /admin/tenants/{tenant_id}/quota/upsert:
    put:
      operationId: upsertTenantQuota
      summary: 批量 Upsert 租户配额
      description: |
        批量 Upsert 指定租户多个维度的配额上限：已存在的维度更新 total，不存在的维度新建行。
        单次请求内所有维度在同一 DB 事务中原子完成，任一维度失败则整体回滚。
        - items.resource_type 必须在 resource_quota_meta 已注册且 enabled=true
        - items.total 未提供或为 0 时取 resource_quota_meta.default_quota；负数返回 VALIDATION_FAILED
        - 缩容时用 GREATEST(total, used+reserved) clamp 到 used+reserved，
          并在返回的 items 中将 tightened 置 true（新建维度不会触发收紧）
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:write"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 }, description: "客户端生成；相同 upsert 请求重复执行后的最终状态一致" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaUpsertRequest' }
      responses:
        "200":
          description: Upsert 结果（含 tightened 标记）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        "400": { $ref: '#/components/responses/QuotaValidationFailed' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }
        "422": { $ref: '#/components/responses/QuotaResourceNotRegistered' }
        "511": { $ref: '#/components/responses/QuotaUpdateUncertain' }

  /admin/tenants/{tenant_id}/reservations:
    put:
      operationId: putTenantReservations
      summary: 设置租户预留额度
      description: |
        设置租户 GPU 预留额度（allocated_gpu_count）。
        allocated_gpu_count 不能超过租户配额上限，否则返回 422 RESERVATION_EXCEEDS_QUOTA。
        下调时用 GREATEST(allocated, used+reserved) clamp，返回 tightened=true。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:write"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "幂等键，防止重复操作" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationPutRequest' }
      responses:
        "200":
          description: 预留额度已设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }
        "422": { $ref: '#/components/responses/ReservationExceedsQuota' }
    get:
      operationId: getTenantReservations
      summary: 查询租户预留额度
      description: |
        查询指定租户的 GPU 预留额度视图（allocated_gpu_count + used/reserved/available）。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 租户预留额度视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/TenantNotFound' }

  /reservations/me:
    get:
      operationId: getMyReservations
      summary: 查询当前租户预留额度
      description: |
        Console 租户自查预留额度。返回当前认证租户的 GPU 预留视图。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      responses:
        "200":
          description: 当前租户预留额度视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /admin/quota-meta:
    get:
      operationId: listQuotaMeta
      summary: 查询可用配额元数据
      description: |
        列出 resource_quota_meta 中 enabled=true 的所有维度，用于创建租户/套餐时
        展示可选项（前端据此渲染配额维度表单）。只读查询，无分页需求。
      tags: [QuotaAdmin]
      x-ani-rbac-scope: "scope:quota:read"
      responses:
        "200":
          description: 可用配额元数据列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaMetaListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

