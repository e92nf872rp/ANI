          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at:    { type: string, format: date-time }

    CreateInstanceResponse:
      type: object
      required: [instance, operation_id]
      properties:
        instance:     { $ref: '#/components/schemas/InstanceRecord' }
        operation_id: { type: string }
        audit_id:     { type: string, nullable: true }

    InstanceLifecycleRequest:
      type: object
      required: [action, idempotency_key]
      description: |
        各 action 只允许使用对应字段；缺失必填字段或携带跨 action 字段返回 400。
        资源状态冲突返回 409，kind/provider 不支持或关联资源准入失败返回 422。
      properties:
        action:
          type: string
          enum: [start, stop, restart, resize, rebuild, delete, snapshot, attach_volume, detach_volume, attach_filesystem, detach_filesystem, rollback, scale, update_image, bind_secret, unbind_secret, change_security_groups, set_termination_protection, pause, resume, extend, touch_idle]
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        cpu:            { type: string, nullable: true, description: "resize 时使用" }
        memory:         { type: string, nullable: true, description: "resize 时使用" }
        snapshot_name:  { type: string, nullable: true, description: "snapshot 时指定快照名称" }
        snapshot_id:    { type: string, nullable: true, description: "rollback 时指定目标快照" }
        include_data_disks: { type: boolean, nullable: true, description: "snapshot 时是否包含数据盘" }
        revision:       { type: string, nullable: true, description: "rollback 时指定目标 revision；与 snapshot_id 二选一" }
        volume_id:      { type: string, nullable: true, description: "attach_volume/detach_volume 时使用" }
        filesystem_id:  { type: string, nullable: true, description: "attach_filesystem/detach_filesystem 时使用" }
        mount_path:     { type: string, nullable: true, description: "attach_volume/attach_filesystem 时使用" }
        read_only:      { type: boolean, nullable: true, description: "挂载资源时使用" }
        replicas:       { type: integer, minimum: 1, nullable: true, description: "scale 时使用" }
        image_id:       { type: string, nullable: true, description: "update_image 时使用" }
        strategy:       { type: string, nullable: true, enum: [rolling, null], description: "update_image 策略" }
        secret_id:      { type: string, nullable: true, description: "bind_secret/unbind_secret 时使用" }
        binding_type:   { type: string, nullable: true, enum: [env, file, null], description: "bind_secret 时使用" }
        env_name:       { type: string, nullable: true, description: "Secret 以环境变量绑定时使用" }
        security_group_ids:
          type: array
          nullable: true
          items: { type: string }
          description: "change_security_groups 时使用"
        enabled:        { type: boolean, nullable: true, description: "set_termination_protection 时使用" }
        duration:       { type: string, nullable: true, description: "Sandbox extend 时使用" }

    InstanceLifecycleResponse:
      type: object
      required: [instance, operation_id]
      properties:
        instance:     { $ref: '#/components/schemas/InstanceRecord' }
        operation_id: { type: string }

    CreateInstanceConsoleSessionRequest:
      type: object
      properties:
