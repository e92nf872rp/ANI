    get:
      operationId: getK8sClusterKubeconfig
      summary: 获取 K8s 集群 kubeconfig
      description: Sprint 5 local dev profile 返回模拟 vCluster kubeconfig；真实 provider 接入后必须保持响应语义兼容。
      tags: [K8sClusters]
      x-ani-rbac-scope: "scope:k8s-clusters:read"
      parameters:
        - { name: cluster_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: K8s 集群 kubeconfig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sClusterKubeconfig"
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /k8s-clusters/{cluster_id}/upgrade:
    post:
      operationId: upgradeK8sCluster
      summary: 升级 K8s 集群版本
      description: Sprint 5 code boundary 会更新 Core cluster version，并在 vCluster provider mode 下委托 provider 表达 Helm upgrade 意图；真实 live 升级验证由 REAL-K8S-LAB-A / vCluster live gate 单独证明。
      tags: [K8sClusters]
      x-ani-rbac-scope: "scope:k8s-clusters:manage"
      parameters:
        - { name: cluster_id, in: path, required: true, schema: { type: string } }
      requestBody:
