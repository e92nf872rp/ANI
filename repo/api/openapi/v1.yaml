  /instances/{instance_id}/sandbox/tokens:
    post:
      operationId: createSandboxToken
      summary: 签发 Sandbox 短期访问令牌
      description: |
        仅允许当前租户中处于 running 状态的 sandbox 实例。跨租户实例按 404 处理；
        非 sandbox kind、状态或 provider 能力不满足时返回 422。同一幂等键在令牌有效期内
        重放原结果；令牌过期后重放返回 409 IdempotencyResultExpired。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:exec"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSandboxTokenRequest' }
      responses:
        "201":
          description: 短期访问令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }

