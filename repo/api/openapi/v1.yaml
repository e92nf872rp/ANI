      responses:
        "200":
          description: K8s 集群列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sClusterListResponse"
    post:
      operationId: createK8sCluster
      summary: 创建 K8s 集群
      tags: [K8sClusters]
      x-ani-rbac-scope: "scope:k8s-clusters:create"
