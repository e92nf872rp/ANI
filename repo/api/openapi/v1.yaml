          $ref: '#/components/schemas/CoreDevProfileInfo'

    FilesystemMountTargetListResponse:
      type: object
      required: [items, total]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/FilesystemMountTarget' } }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    StorageBucketRecord:
      type: object
      required: [id, name, access_mode, created_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        region:       { type: string, nullable: true }
        endpoint:     { type: string, format: uri, nullable: true }
        access_mode:  { type: string, enum: [private, public_read] }
        acl:          { type: string, enum: [private, tenant_read], nullable: true }
        acl_label:    { type: string, nullable: true }
        storage_class: { type: string, enum: [standard, infrequent_access], nullable: true }
        versioning:   { type: string, enum: [disabled, enabled], nullable: true }
        object_count: { type: integer }
        size_bytes:   { type: integer }
        lifecycle_rules:
          type: array
          items: { $ref: '#/components/schemas/StorageBucketLifecycleRule' }
        lifecycle_note: { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }

    StorageBucketObjectEntry:
      type: object
      required: [kind, name, key]
      properties:
        kind: { type: string, enum: [prefix, object] }
        name: { type: string }
        key:  { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        size_label: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        storage_class: { type: string, enum: [standard, infrequent_access], nullable: true }

    StorageBucketObjectListResponse:
      type: object
      required: [items, total, prefix]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StorageBucketObjectEntry' } }
        total: { type: integer }
        prefix: { type: string }
        next_cursor: { type: string, nullable: true }

    BucketObjectUploadRequest:
      type: object
      required: [idempotency_key, key]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        key: { type: string, minLength: 1, maxLength: 1024 }
        content_type: { type: string, default: application/octet-stream }
        size_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        storage_class: { type: string, enum: [standard, infrequent_access], default: standard }

    BucketPrefixCreateRequest:
      type: object
      required: [idempotency_key, prefix]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        prefix: { type: string, minLength: 1, maxLength: 1024 }

    BucketObjectDeleteResponse:
      type: object
      required: [bucket_id, key, deleted]
      properties:
        bucket_id: { type: string }
        key: { type: string }
        deleted: { type: boolean }

    BucketObjectPresignedURLRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 1024 }
        expires_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        method: { type: string, enum: [GET, PUT], default: GET }

    StorageBucketACLUpdateRequest:
      type: object
      required: [idempotency_key, acl]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        acl: { type: string, enum: [private, tenant_read] }

    StorageBucketClassUpdateRequest:
      type: object
      required: [idempotency_key, storage_class]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        storage_class: { type: string, enum: [standard, infrequent_access] }

    StorageBucketLifecycleRule:
      type: object
      required: [id, name, prefix, expire_days, to_infrequent_days, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        expire_days: { type: integer, minimum: 1 }
        to_infrequent_days: { type: integer, minimum: 1 }
        enabled: { type: boolean }

    StorageBucketLifecycleRuleCreateRequest:
      type: object
      required: [idempotency_key, name, prefix, expire_days, to_infrequent_days, enabled]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string }
        prefix: { type: string }
        expire_days: { type: integer, minimum: 1 }
        to_infrequent_days: { type: integer, minimum: 1 }
        enabled: { type: boolean }

    StorageBucketLifecycleRuleListResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StorageBucketLifecycleRule' } }
        total: { type: integer }

    StorageBucketLifecycleRulesUpdateRequest:
      type: object
      required: [idempotency_key, rules]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        rules:
          type: array
          items: { $ref: '#/components/schemas/StorageBucketLifecycleRule' }

    StorageBucketListResponse:
      type: object
      required: [items, total]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/StorageBucketRecord' } }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    CreateStorageBucketRequest:
      type: object
      required: [idempotency_key, name]
      properties:
        idempotency_key: { type: string }
        name:        { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$' }
        region:      { type: string }
        access_mode: { type: string, enum: [private, public_read], default: private }

    StorageObjectUploadRequest:
      type: object
      required: [idempotency_key, bucket_id, key]
      properties:
        idempotency_key: { type: string }
        bucket_id:    { type: string, format: uuid }
        key:          { type: string }
        content_type: { type: string }

    StorageObjectUploadResponse:
      type: object
      required: [upload_url, object_id]
      properties:
        upload_url: { type: string, format: uri }
        object_id:  { type: string, format: uuid }
        expires_at: { type: string, format: date-time }

    StorageObjectDownloadInfo:
      type: object
      required: [download_url]
      properties:
        download_url: { type: string, format: uri }
        expires_at:   { type: string, format: date-time }
        content_type: { type: string, nullable: true }
        size_bytes:   { type: integer, nullable: true }

    VectorStoreDocumentInsertRequest:
      type: object
      required: [idempotency_key, documents]
      properties:
        idempotency_key: { type: string }
        documents:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [content]
            properties:
              content:  { type: string }
              vector:
                type: array
                items: { type: number, format: float }
                description: 预计算向量 (可选; 为空则 Core 内部生成伪向量)
              metadata: { type: object, additionalProperties: true }
              id:       { type: string }

    VectorStoreDocumentInsertResponse:
      type: object
      required: [inserted_count, task_id]
      properties:
        inserted_count: { type: integer }
        task_id:        { type: string, format: uuid }
        status:         { type: string, enum: [pending, completed, failed] }

    VectorStoreDocumentDeleteResponse:
      type: object
      required: [deleted_count]
      properties:
        deleted_count:
          type: integer
          minimum: 0
          description: 实际删除的向量数（best-effort，Milvus 可能不精确）

    K8sClusterWorkload:
      type: object
      required: [name, namespace, kind, replicas, ready_replicas, status, created_at, dev_profile]
      properties:
        name:           { type: string }
        namespace:      { type: string }
        kind:           { type: string, enum: [Deployment, StatefulSet, DaemonSet, Job, CronJob] }
        replicas:       { type: integer }
        ready_replicas: { type: integer }
        image:          { type: string, nullable: true }
        status:         { type: string, enum: [running, pending, failed, succeeded] }
        created_at:     { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    K8sClusterWorkloadListResponse:
      type: object
      required: [items, total]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/K8sClusterWorkload' } }
        next_cursor: { type: string, nullable: true }
        total:       { type: integer }

    GPUInventoryRecord:
      type: object
      required: [id, node_name, gpu_type, gpu_index, status, dev_profile]
      properties:
        id:              { type: string, format: uuid }
        node_name:       { type: string }
        gpu_type:        { type: string }
        gpu_index:       { type: integer }
        memory_total_mb: { type: integer }
        driver_version:  { type: string, nullable: true }
        status:          { type: string, enum: [available, in_use, fault, maintenance] }
        tenant_id:       { type: string, format: uuid, nullable: true }
        instance_id:     { type: string, format: uuid, nullable: true }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        gpu_mode:            { type: string, nullable: true, enum: [wholecard, vgpu], description: "GPU 隔离模式，从节点标签 ani.kubercloud.io/gpu-mode 读取" }
        gpu_spec:            { type: string, nullable: true, description: "整卡规格标签值，从 ani.kubercloud.io/gpu-spec 读取" }
        gpu_sharing_spec:    { type: string, nullable: true, description: "vGPU 共享规格标签值，从 ani.kubercloud.io/gpu-sharing-spec 读取" }
        gpu_sharing_policy:  { type: string, nullable: true, description: "vGPU 共享策略标签值，从 ani.kubercloud.io/gpu-sharing-policy 读取" }

    GPUInventoryListResponse:
      type: object
      required: [items, total, dev_profile]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/GPUInventoryRecord' } }
        next_cursor: { type: string, nullable: true }
        total:       { type: integer }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    GPUSpecSummary:
      type: object
      description: |
        Core 集群级 GPU 规格只读视图。spec_id 描述 GPU 资源形态，不代表租户配额；
        本契约不执行 quota check、acquire 或 release。
        gpu_mode/node_affinity/volcano_resources 为可选扩展字段，对齐 GPUSpec 写视图，
        使 GET /gpu-specs 与 POST /gpu-specs 读写闭环（向后兼容，老客户端可忽略）。
      required: [id, name, gpu_type, shares, mb_per_share, available]
      properties:
        id:              { type: string, description: "稳定规格 ID，实例创建通过 spec_id 引用。" }
        name:            { type: string, description: "Console 展示名称。" }
        gpu_type:        { type: string, description: "必须与 GPU inventory 的 gpu_type 一致。" }
        gpu_mode:        { type: string, enum: [wholecard, vgpu], description: "GPU 隔离模式（可选扩展，对齐 GPUSpec）" }
        memory_total_mb: { type: integer, minimum: 1, nullable: true }
        shares:          { type: integer, minimum: 1, description: "每张物理卡的切分份数；1 表示整卡规格。" }
        mb_per_share:    { type: integer, minimum: 1, description: "每份保证显存，单位 MiB。" }
        available:       { type: boolean, description: "是否允许用于新的实例创建。" }
        node_affinity:   { $ref: '#/components/schemas/GPUSpecNodeAffinity' }
        volcano_resources: { $ref: '#/components/schemas/GPUSpecVolcanoResources' }

    GPUSpecListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GPUSpecSummary' }
        total:       { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }

    GPUOccupancyStats:
      type: object
      required: [total, in_use, available, fault, dev_profile]
      properties:
        total:     { type: integer }
        in_use:    { type: integer }
        available: { type: integer }
        fault:     { type: integer }
        by_gpu_type:
          type: array
          items:
            type: object
            properties:
              gpu_type:  { type: string }
              total:     { type: integer }
              in_use:    { type: integer }
              available: { type: integer }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        vgpu_count:      { type: integer, minimum: 0, description: "vGPU 模式设备数" }
        wholecard_count: { type: integer, minimum: 0, description: "整卡模式设备数" }

    GPUSchedulingQueue:
      type: object
      description: "GPU 调度队列，映射 Volcano Queue CRD"
      required: [id, name, weight, reclaimable, workload_class, is_platform_default, created_at, updated_at]
      properties:
        id:                  { type: string, format: uuid }
        name:                { type: string, description: "租户内唯一队列名" }
        weight:              { type: integer, minimum: 1, default: 10 }
        reclaimable:         { type: boolean, default: false }
        workload_class:      { type: string, enum: [inference, training, batch] }
        project_id:          { type: string, format: uuid, nullable: true }
        is_platform_default: { type: boolean, description: "平台默认队列不可删除或修改" }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }
        status:
          type: object
          nullable: true
          description: "队列调度状态（从 Volcano Queue CRD 读取）"
          properties:
            allocated:
              type: object
              description: "已分配资源键值集合，对齐 Volcano Queue CRD（如 nvidia.com/gpu: 2）"
              additionalProperties: { type: string }
            in_queue:      { type: integer, minimum: 0, description: "排队中任务数" }

    GPUSchedulingQueueListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GPUSchedulingQueue' }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    GPUSchedulingQueueCreateRequest:
      type: object
      required: [name, weight, workload_class]
      properties:
        name:           { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', description: "K8s 资源名规范" }
        weight:         { type: integer, minimum: 1, default: 10 }
        reclaimable:    { type: boolean, default: false }
        workload_class: { type: string, enum: [inference, training, batch] }
        project_id:     { type: string, format: uuid, nullable: true }

    GPUSchedulingQueueUpdateRequest:
      type: object
      properties:
        weight:         { type: integer, minimum: 1 }
        reclaimable:    { type: boolean }
        workload_class: { type: string, enum: [inference, training, batch] }
        project_id:     { type: string, format: uuid, nullable: true }


    # ── GPU 规格管理 Schemas（SPEC §4.4 新增）────────────────────────────────────

    GPUSpecNodeAffinity:
      type: object
      description: "规格节点亲和性标签映射（对齐 K8s 节点标签）"
      properties:
        gpu_spec:            { type: string, nullable: true, description: "整卡时用 ani.kubercloud.io/gpu-spec 值" }
        gpu_sharing_spec:    { type: string, nullable: true, description: "vGPU 时用 ani.kubercloud.io/gpu-sharing-spec 值" }
        gpu_sharing_policy:  { type: string, nullable: true, description: "vGPU 时用 ani.kubercloud.io/gpu-sharing-policy 值" }
        gpu_mode:            { type: string, nullable: true, enum: [wholecard, vgpu], description: "整卡/vGPU 隔离，ani.kubercloud.io/gpu-mode 值" }

    GPUSpecVolcanoResources:
      type: object
      description: "Volcano 调度资源声明（嵌套 wholecard/vgpu 两个子 map）"
      properties:
        wholecard:
          type: object
          nullable: true
          description: "整卡模式资源声明"
          additionalProperties: { type: string }
        vgpu:
          type: object
          nullable: true
          description: "vGPU 模式资源声明"
          additionalProperties: { type: string }

    GPUSpec:
      type: object
      description: |
        GPU 规格完整视图（POST 创建后返回）。含节点亲和性和 Volcano 资源声明，
        用于管理端展示和实例创建准入校验。
      required: [id, name, gpu_type, shares, mb_per_share, available, gpu_mode]
      properties:
        id:              { type: string, description: "稳定规格 ID，实例创建通过 spec_id 引用。" }
        name:            { type: string, description: "Console 展示名称。" }
        gpu_type:        { type: string, description: "必须与 GPU inventory 的 gpu_type 一致。" }
        gpu_mode:        { type: string, enum: [wholecard, vgpu], description: "GPU 隔离模式" }
        memory_total_mb: { type: integer, minimum: 1, nullable: true }
        shares:          { type: integer, minimum: 1, description: "每张物理卡的切分份数；1 表示整卡规格。" }
        mb_per_share:    { type: integer, minimum: 1, description: "每份保证显存，单位 MiB。" }
        available:       { type: boolean, description: "是否允许用于新的实例创建。" }
        node_affinity:
          $ref: '#/components/schemas/GPUSpecNodeAffinity'
        volcano_resources:
          $ref: '#/components/schemas/GPUSpecVolcanoResources'

    GPUSpecCreateRequest:
      type: object
      description: "创建 GPU 规格请求（SPEC §4.4）"
      required: [spec_id, gpu_type, gpu_mode, shares, mb_per_share]
      properties:
        spec_id:         { type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", description: "规格 ID，K8s 资源名规范" }
        gpu_type:        { type: string, description: "GPU 型号，必须对齐节点标签" }
        gpu_mode:        { type: string, enum: [wholecard, vgpu], description: "GPU 隔离模式" }
        shares:          { type: integer, minimum: 1, description: "每张物理卡的切分份数；1=整卡" }
        mb_per_share:    { type: integer, minimum: 1, description: "每份保证显存，单位 MiB" }
        memory_total_mb: { type: integer, minimum: 1, nullable: true, description: "物理卡显存，用于校验" }

    GPUSpecAvailability:
      type: object
      description: "规格可用性视图（四态标注）"
      required: [spec_id, status, available_count, has_matching_nodes, has_idle_devices, device_idle_count]
      properties:
        spec_id:            { type: string }
        status:             { type: string, enum: [available, full, device_full, unavailable], description: "available=可创建，full=配额不足，device_full=设备不足，unavailable=规格不可用" }
        available_count:    { type: integer, minimum: 0, description: "可创建实例数" }
        has_matching_nodes: { type: boolean, description: "是否存在匹配规格的节点" }
        has_idle_devices:   { type: boolean, description: "是否存在空闲设备" }
        device_idle_count:  { type: integer, minimum: 0, description: "空闲设备数" }
        gpu_count:          { type: integer, minimum: 1, description: "每份规格占用的卡数" }

    GPUSpecAvailabilityListResponse:
      type: object
      description: "规格可用性列表响应；quota_remaining 是租户级共享值，只在顶层返回一次"
      required: [items, quota_remaining]
      properties:
        quota_remaining:
          type: integer
          description: "租户配额剩余（allocated_gpu_count - used - reserved），跨规格共享，仅在顶层返回一次"
        items:
          type: array
          items: { $ref: '#/components/schemas/GPUSpecAvailability' }

    # ── 预留管理 Schemas（SPEC §4.4 新增）────────────────────────────────────────

    ReservationPutRequest:
      type: object
      description: "设置租户预留额度请求"
      required: [allocated_gpu_count]
      properties:
        allocated_gpu_count: { type: integer, minimum: 0, description: "预留 GPU 卡数上限" }

    ReservationView:
      type: object
      description: "租户预留额度视图"
      required: [tenant_id, allocated_gpu_count, used, reserved, available]
      properties:
        tenant_id:           { type: string, format: uuid }
        allocated_gpu_count: { type: integer, description: "预留 GPU 卡数上限" }
        used:                { type: integer, description: "已实扣（已 Confirm）" }
        reserved:            { type: integer, description: "已预占（已 Try 未 Confirm/Cancel）" }
        available:           { type: integer, description: "可用 = allocated - used - reserved" }
        tightened:           { type: boolean, description: "下调被 clamp 时 true" }

    # ── 设备管理 Schema（SPEC §4.4 新增）────────────────────────────────────────

    GPUDeviceStatusUpdateRequest:
      type: object
      description: "设备状态翻转请求"
      required: [status]
      properties:
        status: { type: string, enum: [maintenance, idle], description: "目标状态：maintenance=维护中，idle=空闲" }

    # ── 配额自查 Schemas（SPEC §4.3 新增）────────────────────────────────────────

    QuotaListResult:
      type: object
      description: "BOSS 分页配额列表"
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Quota' }
        total:       { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }

    SandboxTemplate:
      type: object
      required: [id, name, image, created_at, dev_profile]
      properties:
        id:                      { type: string, format: uuid }
        name:                    { type: string }
        image:                   { type: string, deprecated: true, description: "兼容字段；优先使用 image_id/image_ref。" }
        image_id:                { type: string, nullable: true }
        image_ref:               { type: string, nullable: true }
        description:             { type: string, nullable: true }
        cpu_cores:               { type: number, nullable: true, deprecated: true }
        memory_gb:               { type: number, nullable: true, deprecated: true }
        storage_gb:              { type: number, nullable: true }
        default_cpu:             { type: string, nullable: true }
        default_memory:          { type: string, nullable: true }
        default_session_timeout: { type: string, nullable: true }
        default_idle_timeout:    { type: string, nullable: true }
        default_egress_policy:
          allOf:
            - $ref: '#/components/schemas/SandboxNetworkEgressPolicy'
          nullable: true
        default_ports:
          type: array
          items: { $ref: '#/components/schemas/InstancePortSpec' }
        available:               { type: boolean, default: true }
        is_builtin:              { type: boolean, default: false }
        created_at:              { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    SandboxTemplateListResponse:
      type: object
      required: [items, total, dev_profile]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/SandboxTemplate' } }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    # ── 邮件通知（BOSS 平台级 SMTP 发信通道、收件人、事件订阅、测试发送）──────────────
    EmailSmtpConfigResponse:
      type: object
      description: "SMTP 发信通道配置响应；password / auth_code 明文永不回显"
      required: [configured]
      properties:
        configured:
          type: boolean
          description: "是否已配置（false = 空态，其他字段可省略）"
        smtp_host:    { type: string }
        smtp_port:    { type: integer, minimum: 1, maximum: 65535 }
        encryption:   { type: string, enum: [none, starttls, ssl] }
        from_address: { type: string, format: email }
        username:     { type: string }
        has_password:
          type: boolean
          description: "是否已设置 SMTP 登录密码（明文不回显）"
        has_auth_code:
          type: boolean
          description: "是否已设置 SMTP 授权码（明文不回显）；与 password 独立保存，不互斥"
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    PutEmailSmtpConfigRequest:
      type: object
      description: "保存 SMTP 发信通道配置；password 与 auth_code 独立保存、独立清除，服务端不强制二选一"
      required: [smtp_host, smtp_port, encryption, from_address, username]
      properties:
        smtp_host:    { type: string, minLength: 1 }
        smtp_port:    { type: integer, minimum: 1, maximum: 65535 }
        encryption:   { type: string, enum: [none, starttls, ssl] }
        from_address: { type: string, format: email }
        username:     { type: string }
        password:
          type: string
          format: password
          description: |
            SMTP 登录密码（企业邮箱场景）。
            - 省略或 null：不修改已有密码
            - 空字符串 ""：清除已有密码
            - 非空字符串：加密后覆盖
            明文永不回显；与 auth_code 独立保存，不互斥。
        auth_code:
          type: string
          format: password
          description: |
            SMTP 授权码（QQ/163/Gmail 等国内邮箱服务商 SMTP 授权登录）。
            - 省略或 null：不修改已有授权码
            - 空字符串 ""：清除已有授权码
            - 非空字符串：加密后覆盖
            明文永不回显；与 password 独立保存，不互斥。
            发送邮件时若 auth_code 已设置则优先使用 auth_code，否则使用 password。
      additionalProperties: false

    EmailRecipient:
      type: object
      description: "邮件收件人"
      required: [id, email, enabled, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        email:      { type: string, format: email }
        label:      { type: string, nullable: true }
        enabled:    { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EmailRecipientListResponse:
      type: object
      description: "收件人列表"
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmailRecipient' } }
        total: { type: integer }

    CreateEmailRecipientRequest:
      type: object
      description: "新增收件人"
      required: [email]
      properties:
        email: { type: string, format: email }
        label: { type: string }
      additionalProperties: false

    UpdateEmailRecipientRequest:
      type: object
      description: "更新收件人（邮箱地址、备注、启停）"
      properties:
        email:   { type: string, format: email }
        label:   { type: string, nullable: true }
        enabled: { type: boolean }
      additionalProperties: false

    EmailSubscription:
      type: object
      description: "邮件事件订阅"
      required: [event_type, description, enabled, updated_at]
      properties:
        event_type:
          type: string
          enum:
            - platform_alert_p0
            - platform_alert_p1
            - incident_created
            - incident_escalated
            - platform_task_failed
        description: { type: string }
        enabled:    { type: boolean }
        updated_at: { type: string, format: date-time }

    EmailSubscriptionListResponse:
      type: object
      description: "订阅列表（首期固定 5 行）"
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmailSubscription' } }
        total: { type: integer }

    PutEmailSubscriptionsRequest:
      type: object
      description: "批量保存邮件事件订阅"
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          minItems: 1
          items:
            type: object
            required: [event_type, enabled]
            properties:
              event_type:
                type: string
                enum:
                  - platform_alert_p0
                  - platform_alert_p1
                  - incident_created
                  - incident_escalated
                  - platform_task_failed
              enabled: { type: boolean }
      additionalProperties: false

    SendTestEmailResponse:
      type: object
      description: "测试发送结果"
      required: [success, message, request_id]
      properties:
        success:    { type: boolean }
        message:    { type: string, description: "成功或失败的可读信息" }
        request_id: { type: string, description: "请求 ID（用于排障）" }
        sent_at:    { type: string, format: date-time, nullable: true }

    # ── 配额管理（Core API v1，平台级配额管理）────────────────────────────────
    QuotaCreateRequest:
      type: object
      description: "批量新建租户配额请求（POST /admin/tenants/{tenant_id}/quota）"
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuotaCreateItem' }

    QuotaCreateItem:
      type: object
      description: "新建配额维度项；total 未提供或为 null 时取 resource_quota_meta.default_quota"
      required: [resource_type]
      properties:
        resource_type: { type: string, description: "配额维度标识（需在 resource_quota_meta 已注册且 enabled=true）" }
        total:          { type: integer, format: int64, nullable: true, minimum: 0, description: "配额上限；未提供或为 null 时取 resource_quota_meta.default_quota" }

    QuotaUpdateRequest:
      type: object
      description: "批量修改租户配额上限请求（PUT /admin/tenants/{tenant_id}/quota）"
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuotaUpdateItem' }

    QuotaUpdateItem:
      type: object
      description: "修改配额维度项；只改 total，不影响 used/reserved"
      required: [resource_type, total]
      properties:
        resource_type: { type: string, description: "配额维度标识" }
        total:          { type: integer, format: int64, minimum: 0, description: "新配额上限；允许低于当前 used（缩容，由服务端 GREATEST clamp 到 used+reserved）" }

    QuotaUpsertRequest:
      type: object
      description: "批量 Upsert 租户配额请求（PUT /admin/tenants/{tenant_id}/quota/upsert）"
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuotaUpsertItem' }

    QuotaUpsertItem:
      type: object
      description: "Upsert 配额维度项；total 未提供、为 null 或为 0 时取 resource_quota_meta.default_quota"
      required: [resource_type]
      properties:
        resource_type: { type: string, description: "配额维度标识（需在 resource_quota_meta 已注册且 enabled=true）" }
        total:          { type: integer, format: int64, nullable: true, minimum: 0, description: "配额上限；未提供、为 null 或为 0 时取 resource_quota_meta.default_quota" }

    Quota:
      type: object
      description: "租户配额视图（GET/POST/PUT 共用响应）"
      required: [tenant_id, items]
      properties:
        tenant_id: { type: string, format: uuid, description: "租户 ID" }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotaItem' }

    QuotaItem:
      type: object
      description: "单维度配额项"
      required: [resource_type, total, used, reserved]
      properties:
        resource_type: { type: string, description: "配额维度标识" }
        total:         { type: integer, format: int64, description: "配额上限" }
        used:          { type: integer, format: int64, description: "已实扣（已 Confirm）" }
        reserved:      { type: integer, format: int64, description: "已预占（已 Try 未 Confirm/Cancel）" }
        tightened:     { type: boolean, description: "PUT 缩容自动收紧标记（请求 total<used+reserved 时收紧为 used+reserved，置 true）；GET 响应中为零值 false" }
        unit:          { type: string, description: "单位（来自 resource_quota_meta，GET 时返回）" }
        display_name:  { type: string, description: "展示名称（来自 resource_quota_meta，GET 时返回）" }
        is_discrete:   { type: boolean, description: "是否离散计数（来自 resource_quota_meta，当前统一为整数计数；GET 时返回）" }

    QuotaDeleteResponse:
      type: object
      description: "删除租户配额响应（DELETE /admin/tenants/{tenant_id}/quota）"
      required: [tenant_id, message]
      properties:
        tenant_id: { type: string, format: uuid, description: "租户 ID" }
        message:   { type: string, example: "quota deleted", description: "操作结果描述" }

    QuotaMetaListResponse:
      type: object
      description: "可用配额元数据列表（GET /admin/quota-meta）"
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotaMeta' }

    QuotaMeta:
      type: object
      description: "配额元数据（resource_quota_meta 只读视图）"
      required: [resource_type, display_name, unit, default_quota, is_discrete]
      properties:
        resource_type:  { type: string, description: "配额维度标识" }
        display_name:   { type: string, description: "展示名称" }
        unit:           { type: string, description: "单位" }
        default_quota:  { type: integer, format: int64, description: "默认上限（新建配额未提供或为 null 时兜底）" }
        is_discrete:    { type: boolean, description: "是否离散计数（当前统一为整数计数）" }

  # 公共响应
  responses:
    Unauthorized:
      description: 未认证或 Token 无效（code=UNAUTHORIZED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 无权访问该资源（code=FORBIDDEN）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在（code=NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    VectorStoreNotFound:
      description: 向量存储不存在（code=VECTOR_STORE_NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidFilter:
      description: filter 表达式非法（code=INVALID_FILTER）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NetworkSecurityGroupRuleNotFound:
      description: 安全组不存在，或 rule_id 不属于该 security_group_id（code=NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 请求参数不合法（code=BAD_REQUEST）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源已存在或冲突（code=CONFLICT）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimitExceeded:
      description: 超出速率限制（code=RATE_LIMIT_EXCEEDED）
      headers:
        Retry-After:
          schema: { type: integer }
          description: "建议等待的秒数"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: 前置条件不满足（code=PRECONDITION_FAILED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 依赖服务暂不可用（code=UNAVAILABLE）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    # ── 配额管理专用错误响应（SPEC §4.5 补充，引用 ErrorResponse schema）──────
    TenantNotFound:
      description: 租户不存在（code=TENANT_NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaNotFound:
      description: 配额行不存在（code=QUOTA_NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaAlreadyExists:
      description: "部分成功：存在已存在的配额维度被跳过（code=QUOTA_ALREADY_EXISTS），其余维度已正常创建"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaResourceNotRegistered:
      description: 资源类型未注册或已禁用（code=QUOTA_RESOURCE_NOT_REGISTERED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaValidationFailed:
      description: 参数校验失败（code=VALIDATION_FAILED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaUpdateUncertain:
      description: |
        配额更新失败，无法确认事务提交状态（DB 宕机/连接断开等极端场景）。
        Services 层收到此错误后不得自动重试，应记录告警并触发人工核对流程。
        code=QUOTA_UPDATE_UNCERTAIN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    # ── GPU 规格管理专用错误响应（SPEC §4.5 新增）────────────────────────────────
    GPUSpecNotFound:
      description: 规格不存在（code=GPU_SPEC_NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GPUSpecInUse:
      description: 该规格有运行中实例引用，无法删除（code=GPU_SPEC_IN_USE）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GPUSpecConflict:
      description: 规格已存在（code=GPU_SPEC_CONFLICT）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GPUTypeNotInNodes:
      description: GPU 型号不存在于集群节点标签中（code=GPU_TYPE_NOT_IN_NODES）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DeviceNotFound:
      description: 设备不存在（code=DEVICE_NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    # ── 配额/预留专用错误响应（SPEC §4.5 新增）────────────────────────────────────
    QuotaExceeded:
      description: 配额不足（code=QUOTA_EXCEEDED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ReservedInsufficient:
      description: 预留额度不足（code=RESERVED_INSUFFICIENT）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ReservationExceedsQuota:
      description: 预留额度不能超过配额上限（code=RESERVATION_EXCEEDS_QUOTA）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

security:
  - BearerAuth: []
  - ApiKeyAuth: []

# ── API 路径定义 ──────────────────────────────────────────────────────────────
# 说明：/demo/* 路径已迁移至 api/openapi/dev.yaml（不参与 SDK 生成）
paths:

  # ── 健康检查（K8s probe 必须）──────────────────────────────────────────────
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe（进程存活检查）
      description: |
        K8s liveness probe 端点。只要进程能响应即返回 200。
        不检查依赖（Postgres/NATS/Redis），仅表示"进程在运行"。
        不需要认证。
      tags: [Health]
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:   { type: string, enum: [ok], example: "ok" }
                  version:  { type: string, example: "v0.8.0" }
                  build_at: { type: string, format: date-time }
        "503":
          description: 进程异常（极少见，进程若能响应通常返回200）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe（服务就绪检查）
      description: |
        K8s readiness probe 端点。检查所有关键依赖是否可用。
        任一依赖不可用则返回 503，此时 K8s 从 LB 摘除该实例。
        不需要认证。
      tags: [Health]
      security: []
      responses:
        "200":
          description: 服务就绪，可接受流量
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  checks:
                    type: object
                    description: 各依赖的健康状态
                    additionalProperties:
                      type: object
                      properties:
                        status:  { type: string, enum: [ok, fail] }
                        latency_ms: { type: integer }
                        error:   { type: string, nullable: true }
                    example:
                      postgres:  { status: ok, latency_ms: 3 }
                      nats:      { status: ok, latency_ms: 1 }
                      redis:     { status: ok, latency_ms: 1 }
        "503":
          description: 服务未就绪（至少一个依赖不可用）
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [degraded, error] }
                  checks: { type: object, additionalProperties: true }

  # ── 认证 ────────────────────────────────────────────────────────────────────
  /auth/password/login:
    post:
      operationId: passwordLogin
      summary: 租户账密登录（账号密码 Tab）
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        "200":
          description: 账密登录成功，返回 TokenPair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401":
          description: 用户名或密码错误（code=INVALID_CREDENTIALS）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: 租户不存在（code=TENANT_NOT_FOUND）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "429": { $ref: '#/components/responses/RateLimitExceeded' }

  /auth/platform/password/login:
    post:
      operationId: platformPasswordLogin
      summary: 平台管理员账密登录
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformPasswordLoginRequest' }
      responses:
        "200":
          description: 平台账密登录成功，返回平台 TokenPair（scope=platform）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401":
          description: 用户名或密码错误（code=INVALID_CREDENTIALS）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "429": { $ref: '#/components/responses/RateLimitExceeded' }

  /auth/oidc/begin:
    post:
      operationId: beginOIDCLogin
      summary: 发起 OIDC 登录
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginOIDCLoginRequest' }
      responses:
        "200":
          description: 返回 Dex/OIDC 授权地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeginOIDCLoginResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /auth/token:
    post:
      operationId: completeOIDCLogin
      summary: OIDC callback 换取 TokenPair
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteOIDCLoginRequest' }
      responses:
        "200":
          description: OIDC 登录完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      summary: 刷新 AccessToken
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshAccessTokenRequest' }
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshAccessTokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      summary: 吊销当前 JWT JTI
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        "200":
          description: Token 已吊销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeStatusResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /auth/api-keys:
    get:
      operationId: listAPIKeys
      summary: 列出当前租户 API Key
      tags: [Auth]
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: API Key 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListAPIKeysResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAPIKey
      summary: 创建 API Key
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        "201":
          description: API Key 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAPIKeyResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /auth/api-keys/{key_id}:
    delete:
      operationId: revokeAPIKey
      summary: 吊销 API Key
      tags: [Auth]
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: API Key 已吊销
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [revoked] }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── 平台内部工作负载（仅授权服务身份）──────────────────────────────────────
  # x-ani-exposure=internal 表示部署层不得通过租户/公网 Ingress 发布这些路径；
  # inference-service 只可通过集群内部 Core endpoint + service JWT 调用。
  /platform-workload-capabilities:
    get:
      operationId: getPlatformWorkloadCapabilities
      summary: 查询平台工作负载能力
      description: |
        仅授权平台服务身份可用。返回 provider-neutral 的 topology、LWS/gang readiness 和 GPUSpec 准入提示；
        响应不是资源预留，最终创建仍由 Core 原子准入。普通租户 token/API key 即使具有同名 tenant scope 也返回 403。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:read"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: 平台工作负载能力
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformWorkloadCapabilities' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /platform-workloads:
    post:
      operationId: createPlatformWorkload
      summary: 创建平台内部工作负载
      description: |
        仅授权平台服务身份可用。请求表达通用容器、资源、拓扑、网络、artifact 和 secret binding 意图；
        禁止提交 Kubernetes、LWS、Volcano 或推理业务对象。AsyncTask.resource_id 在接收时即确定。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:write"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformWorkloadCreateRequest' }
      responses:
        "202":
          description: 平台工作负载创建任务已接受
          headers:
            Location:
              description: Core AsyncTask 查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422":
          $ref: '#/components/responses/PreconditionFailed'
          description: 未批准镜像/profile、GPUSpec 不可用、资源不足或 topology/gang 前置条件不满足。
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /platform-workloads/{workload_id}:
    get:
      operationId: getPlatformWorkload
      summary: 查询平台内部工作负载
      description: |
        仅授权平台服务身份可用。跨租户资源返回 404。internal_endpoint 仅在当前服务身份具有 read scope 时返回，
        且只表示当前 generation 的 ClusterIP endpoint。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:read"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workload_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 平台工作负载规范化状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformWorkload' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updatePlatformWorkload
      summary: 修改平台内部工作负载副本数
      description: |
        P0 只允许修改 single_node 独立副本数。leader_worker 固定 replicas=1；资源、镜像、topology、network、
        artifact、secret 和 profile 均不可通过 PATCH 修改。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:write"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workload_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformWorkloadUpdateRequest' }
      responses:
        "202":
          description: 副本伸缩任务已接受
          headers:
            Location:
              description: Core AsyncTask 查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deletePlatformWorkload
      summary: 删除平台内部工作负载
      description: 删除 provider runtime、PlatformWorkload 资源和内部 endpoint；内部 tombstone 可继续用于幂等清理与审计。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:write"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workload_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 删除任务已接受
          headers:
            Location:
              description: Core AsyncTask 查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /platform-workloads/{workload_id}/lifecycle:
    post:
      operationId: applyPlatformWorkloadLifecycle
      summary: 执行平台内部工作负载生命周期动作
      description: |
        stop 删除 provider 侧 Deployment/LWS、Service 和 PodGroup并释放计算资源，但保留 PlatformWorkload ID 与 applied spec；
        start 在同一 workload ID 下重建 provider runtime；restart 不修改当前 generation 的规格。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:write"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workload_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformWorkloadLifecycleRequest' }
      responses:
        "202":
          description: 生命周期任务已接受
          headers:
            Location:
              description: Core AsyncTask 查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /platform-workloads/{workload_id}/logs:
    get:
      operationId: getPlatformWorkloadLogs
      summary: 查询平台内部工作负载日志
      description: 返回规范化、分页并脱敏的 runtime 日志；不暴露 Pod UID、Secret、Authorization 或临时对象 URL。
      tags: [PlatformWorkloads]
      x-ani-rbac-scope: "scope:platform-workloads:read"
      x-ani-service-only: true
      x-ani-principal-kind: service
      x-ani-exposure: internal
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workload_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
      responses:
        "200":
          description: 平台工作负载日志
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformWorkloadLogListResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # ── 计算实例（Core API Alpha）──────────────────────────────────────────────
  /instances:
    get:
      operationId: listInstances
      summary: 查询实例列表
      description: |
        Services P0 依赖路径。返回 VM、container、gpu_container、sandbox 的 Core 统一实例视图。
        当前 Alpha 冻结 path/schema/error/state/RBAC scope；dev/local profile 可使用本地 provider。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:read"
      parameters:
        - { name: kind,             in: query, schema: { type: string, enum: [vm, container, gpu_container, sandbox, batch_job, notebook, k8s_cluster, bare_metal, dpu_node] } }
        - { name: state,            in: query, schema: { type: string, enum: [pending, provisioning, starting, running, stopping, stopped, failed, deleting, deleted] } }
        - { name: keyword,          in: query, schema: { type: string }, description: "按实例名称、ID 或描述搜索。" }
        - { name: created_after,    in: query, schema: { type: string, format: date-time } }
        - { name: created_before,   in: query, schema: { type: string, format: date-time } }
        - { name: spec_id,          in: query, schema: { type: string }, description: "VM/GPU 规格 ID。" }
        - { name: image_id,         in: query, schema: { type: string } }
        - { name: node_name,        in: query, schema: { type: string } }
        - { name: rollout_status,   in: query, schema: { type: string, enum: [pending, progressing, healthy, degraded, rolled_back] } }
        - { name: gpu_model,        in: query, schema: { type: string } }
        - { name: queue_name,       in: query, schema: { type: string } }
        - { name: scheduling_state, in: query, schema: { type: string, enum: [pending, queued, scheduled, running, failed] } }
        - { name: template_id,      in: query, schema: { type: string } }
        - { name: session_state,    in: query, schema: { type: string, enum: [pending, running, paused, expired, stopped] } }
        - { name: limit,            in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: cursor,           in: query, schema: { type: string } }
        - { name: sort,             in: query, schema: { type: string, enum: [created_at_asc, created_at_desc, name_asc, name_desc], default: created_at_desc } }
      responses:
        "200":
          description: 实例列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      operationId: createInstance
      summary: 创建实例
      description: |
        创建 VM、container、gpu_container 或 sandbox。POST 创建必须携带 idempotency_key；
        同一 (tenant_id, idempotency_key) 在 24 小时内返回同一操作结果。
        推荐按 kind 填写对应 `vm_config` / `container_config` / `gpu_container_config` / `sandbox_config`；
        扁平 boot_image/ssh_*/replicas/gpu 字段仍接受，作为 v1 兼容别名。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:create"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstanceRequest' }
      responses:
        "201":
          description: 实例创建已提交并返回当前状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInstanceResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409":
          description: |
            配额不足或预留额度不足。可能的 code：
            - QUOTA_EXCEEDED: used+reserved+request > total，配额上限不足
            - RESERVED_INSUFFICIENT: allocated-used-reserved < request，预留额度不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "422":
          $ref: '#/components/responses/PreconditionFailed'
          description: |
            GPU 调度前置条件不满足。可能的 code：
            - InsufficientGPU: GPU 资源不足，当前无可用算力满足本次创建请求
            - GPUNodeIncompatible: 无兼容 GPU 节点，请调整型号偏好或调度队列
            - QueueNotFound: 所选调度队列不存在或已删除
            - ImageNotFound: 镜像不存在或不属于当前租户镜像仓库
            - ImageScanning: 镜像仍在安全扫描中，暂不能创建实例
            - ImageVulnerabilityBlocked: 镜像存在高危或严重漏洞，策略禁止创建实例
            - ImagePurposeMismatch: 镜像用途与实例 kind 不匹配
            - GPUSpecNotFound: spec_id 对应的 GPU 规格不存在
            - GPUSpecUnavailable: GPU 规格存在但不可用于新实例
            - GPUSpecInventoryMismatch: GPU 规格与当前 inventory 不匹配

