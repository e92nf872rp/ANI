  /instances/{instance_id}/sandbox/files:
    get:
      operationId: listSandboxFiles
      summary: 查询 Sandbox 文件
      description: "仅返回当前租户 sandbox 实例的目录项；非 sandbox kind 或 provider 能力不满足时返回 422。"
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:read"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "." } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxFileListResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
    post:
      operationId: writeSandboxFile
      summary: 写入 Sandbox 文件
      description: |
        content_base64 与 upload_id 二选一。文件超过 provider 限制时返回 413；目标已存在且
        overwrite=false 时返回 409。跨租户实例按 404 处理；非 sandbox kind、状态或能力不满足时返回 422。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:update"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteSandboxFileRequest' }
      responses:
        "201":
          description: 已写入文件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxFile' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "413":
          description: 文件大小超过 provider 限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      operationId: deleteSandboxFile
      summary: 删除 Sandbox 文件
      description: "跨租户实例按 404 处理；非 sandbox kind、状态或 provider 能力不满足时返回 422。"
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:update"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "204": { description: 文件已删除 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }

