          $ref: '#/components/schemas/CoreDevProfileInfo'

    NetworkRouteListResponse:
      type: object
      required: [items, total]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/NetworkRoute' } }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    CreateNetworkRouteRequest:
      type: object
      required: [idempotency_key, vpc_id, destination_cidr, next_hop_type, next_hop_id]
      description: "create 禁止 next_hop_type=local；local 路由仅由系统返回。"
      properties:
        idempotency_key:  { type: string }
        vpc_id:           { type: string }
        destination_cidr: { type: string }
        next_hop_type:    { type: string, enum: [gateway, instance, nat] }
        next_hop_id:      { type: string }
        priority:         { type: integer, minimum: 1, maximum: 32766, nullable: true, description: "路由优先级，数值越小优先级越高。" }
        description:      { type: string }

    VolumeSnapshotRecord:
      type: object
      required: [id, volume_id, name, status, size_bytes, created_at, dev_profile]
      properties:
        id:         { type: string }
        volume_id:  { type: string }
