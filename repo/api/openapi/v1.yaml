          description: 告警规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservabilityAlertRuleListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createObservabilityAlertRule
      summary: 创建告警规则
      tags: [Observability]
      x-ani-rbac-scope: "scope:observability:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateObservabilityAlertRuleRequest' }
      responses:
        "201":
          description: 告警规则已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservabilityAlertRule' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /observability/alert-rules/{rule_id}:
    get:
