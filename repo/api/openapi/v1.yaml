openapi: 3.1.0

info:
  title: KuberCloud ANI Core API
  version: 1.0.0
  description: |
    KuberCloud ANI Core — 基础设施平台 REST API 契约（唯一真实来源）。

    ## 文件范围与边界
    本文件（api/openapi/v1.yaml）仅包含 ANI Core 基础设施资源：
    instances（VM/Container/GPU/Sandbox/BM/K8s集群）、volumes/filesystems/objects/
    vector-stores、networks、auth/secrets/encryption、gpu-inventory/dpu-inventory、
    registry/metering/observability/notifications/audit 等。
    ANI Services 资源（模型仓库/推理/知识库/PaaS）在 api/openapi/services/v1.yaml。

    ## URL 前缀规范
    servers[0].url = "https://{host}/api/v1"（前缀在 spec 中定义，Gateway 不做路径变换）。
    版本升级时新建 api/openapi/v2.yaml，本文件路径保持稳定。

    ## SDK 生成（make gen-core-sdk）
    Go: github.com/kubercloud/ani-go | Python: pip install kubercloud-ani
    TypeScript: @kubercloud/ani-client | Java: com.kubercloud:ani-java

    ## 认证
    Bearer JWT（1小时有效）或 X-API-Key Header。
    tenant_id 从 JWT claims 提取，请求体中的 tenant_id 字段将被忽略。

    ## 错误格式
    `{ code: string, message: string, request_id: string, details?: object }`
    标准错误码：UNAUTHORIZED / FORBIDDEN / NOT_FOUND / CONFLICT / BAD_REQUEST /
    RATE_LIMIT_EXCEEDED / NOT_IMPLEMENTED / INTERNAL_ERROR

    ## 分页
    cursor 分页：`?limit=20&cursor=<token>` → `{ items: [], next_cursor: string | null }`

    ## 异步操作
    202 响应体返回 AsyncTask，Location Header 附任务 URL。
    轮询 GET /api/v1/tasks/{task_id} 或配置 Webhook。

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: ani.internal
        description: ANI Gateway 地址（支持IP地址）

# ── 认证方式 ─────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT AccessToken（有效期1小时，通过 /auth/token 获取）。标记 x-ani-principal-kind=service 的操作只接受
        aud=ani-core、principal_kind=service、包含 tenant_id 与所需 scope 的短期服务 JWT；租户用户 JWT 必须返回 403。
        服务身份令牌的签发/轮换由 Auth 控制面负责，不通过本 API 请求体传递 tenant_id 或服务密钥。
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 长期 API Key（在 Console → 设置 → API Key 中创建）

# ── 公共 Schema ───────────────────────────────────────────────────────────────
  schemas:

    K8sClusterCreateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        name:            { type: string }
        version:         { type: string }
      required: [idempotency_key, name]
    K8sClusterUpgradeRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        version:         { type: string }
      required: [idempotency_key, version]
    K8sCluster:
      type: object
      properties:
        id:         { type: string }
        tenant_id:  { type: string }
        name:       { type: string }
        version:    { type: string }
        state:      { type: string, enum: [provisioning, running, deleting] }
        reason:     { type: string }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    K8sClusterListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/K8sCluster" } }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    K8sClusterNodePoolGPU:
      type: object
      properties:
        vendor:        { type: string }
        model:         { type: string }
        count:         { type: integer }
        resource_name: { type: string }
    K8sClusterNodePoolCreateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        name:            { type: string }
        node_count:      { type: integer, minimum: 1 }
        instance_type:   { type: string }
        gpu:
          $ref: '#/components/schemas/K8sClusterNodePoolGPU'
      required: [idempotency_key, name, node_count, instance_type]
    K8sClusterNodePoolUpdateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        node_count:      { type: integer, minimum: 0 }
        instance_type:   { type: string }
        gpu:
          $ref: '#/components/schemas/K8sClusterNodePoolGPU'
      required: [idempotency_key, node_count, instance_type]
    K8sClusterNodePool:
      type: object
      properties:
        id:            { type: string }
        tenant_id:     { type: string }
        cluster_id:    { type: string }
        name:          { type: string }
        node_count:    { type: integer }
        instance_type: { type: string }
        gpu:
          $ref: '#/components/schemas/K8sClusterNodePoolGPU'
        state:         { type: string, enum: [running, deleting] }
        reason:        { type: string }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    K8sClusterNodePoolListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/K8sClusterNodePool" } }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    K8sClusterKubeconfig:
      type: object
      properties:
        cluster_id: { type: string }
        tenant_id:  { type: string }
        server:     { type: string }
        namespace:  { type: string }
        ca_data:    { type: string }
        token:      { type: string }
        kubeconfig: { type: string }
        expires_at: { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
    K8sClusterProxyRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
          description: 原生 Kubernetes API path，仅允许 /api/、/apis/、/healthz、/livez、/readyz、/version 范围。
        query:
          type: object
          additionalProperties: { type: string }
        body:
          type: object
          additionalProperties: true
      required: [idempotency_key, method, path]
    K8sClusterProxyResponse:
      type: object
      properties:
        cluster_id: { type: string }
        tenant_id:  { type: string }
        method:     { type: string }
        path:       { type: string }
        query:
          type: object
          additionalProperties: { type: string }
        status_code: { type: integer }
        headers:
          type: object
          additionalProperties: { type: string }
        body:
          type: object
          additionalProperties: true
        proxied_at: { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    EncryptionKeyCreateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        name:            { type: string }
        algorithm:       { type: string, enum: [SM4, AES256] }
      required: [idempotency_key, name]
    EncryptionKey:
      type: object
      properties:
        id:         { type: string }
        tenant_id:  { type: string }
        name:       { type: string }
        algorithm:  { type: string }
        state:      { type: string, enum: [active, rotated, revoked, deleted] }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EncryptionKeyListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EncryptionKey" } }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    EncryptionKeyRotateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
      required: [idempotency_key]
    EncryptionKeyRevokeRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        reason:          { type: string }
      required: [idempotency_key]
    EncryptionKeyRotationResponse:
      type: object
      properties:
        rotation_id:     { type: string }
        tenant_id:       { type: string }
        previous_key_id: { type: string }
        rotated_key:
          $ref: "#/components/schemas/EncryptionKey"
        rotated_at: { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
    EncryptionSealRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        key_id:          { type: string }
        object_uri:      { type: string }
      required: [idempotency_key, key_id, object_uri]
    EncryptionSealResponse:
      type: object
      properties:
        key_id:            { type: string }
        tenant_id:         { type: string }
        object_uri:        { type: string }
        sealed_object_uri: { type: string }
        unseal_token:      { type: string }
        expires_at:        { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
    EncryptionUnsealTokenRequest:
      type: object
      properties:
        key_id:            { type: string }
        sealed_object_uri: { type: string }
      required: [key_id, sealed_object_uri]
    EncryptionUnsealTokenResponse:
      type: object
      properties:
        key_id:            { type: string }
        tenant_id:         { type: string }
        sealed_object_uri: { type: string }
        unseal_token:      { type: string }
        expires_at:        { type: string, format: date-time }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    SecretCreateRequest:
      type: object
      properties:
        idempotency_key: { type: string }
        name:            { type: string }
        type:            { type: string, enum: [opaque, dockerconfigjson, tls] }
        data:
          type: object
          additionalProperties: { type: string }
      required: [idempotency_key, name, data]
    Secret:
      type: object
      properties:
        id:         { type: string }
        tenant_id:  { type: string }
        name:       { type: string }
        type:       { type: string }
        keys:       { type: array, items: { type: string } }
        state:      { type: string, enum: [active, deleted] }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    SecretBindingRequest:
      type: object
      properties:
        target_type: { type: string, enum: [instance, k8s-cluster, service] }
        target_id:   { type: string }
        mount_path:  { type: string }
        env_prefix:  { type: string }
      required: [target_type, target_id]
    SecretBinding:
      type: object
      properties:
        id:          { type: string }
        secret_id:   { type: string }
        tenant_id:   { type: string }
        target_type: { type: string }
        target_id:   { type: string }
        mount_path:  { type: string }
        env_prefix:  { type: string }
        state:       { type: string }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at:  { type: string, format: date-time }

    # 所有错误响应的统一格式
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:        { type: string, example: "MODEL_NOT_FOUND" }
        message:     { type: string, example: "模型 qwen2.5-72b 不存在" }
        request_id:  { type: string, example: "req_01j8xabc" }
        details:     { type: object, additionalProperties: true }

    # Cursor 分页（所有列表接口统一使用此格式）
    CursorPage:
      type: object
      required: [items, total]
      properties:
        total:       { type: integer, description: "总记录数（用于显示）", example: 42 }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已到最后一页" }

    # 异步任务（统一格式，202 响应一律返回此 schema）
    AsyncTask:
      type: object
      required: [id, idempotency_key, task_type, status, created_at]
      properties:
        id:               { type: string, format: uuid }
        idempotency_key:  { type: string, description: "客户端提供的幂等键" }
        task_type:        { type: string, example: "model.import",
                            enum: [model.import, kb.parse, kb.index, inference.deploy, platform_workload.create, platform_workload.scale, platform_workload.start, platform_workload.stop, platform_workload.restart, platform_workload.delete, volume.snapshot.create, volume.expand, volume.mount, volume.unmount, volume.create_from_snapshot, filesystem.expand, filesystem.mount_target.create, filesystem.mount, filesystem.unmount, vector_store.index.rebuild, vector_store.document.insert, sandbox.checkpoint.create, sandbox.checkpoint.restore, sandbox.code_run.create] }
        resource_type:    { type: string, nullable: true,
                            enum: [inference_service, platform_workload, kb_document, model_version, volume_snapshot, volume, filesystem, filesystem_mount_target, vector_store, sandbox_checkpoint, sandbox_code_run] }
        resource_id:      { type: string, format: uuid, nullable: true }
        status:           { type: string,
                            enum: [pending, running, completed, failed, cancelled, dead_letter] }
        attempt_count:    { type: integer, minimum: 0 }
        max_attempts:     { type: integer, minimum: 1 }
        progress_pct:     { type: integer, minimum: 0, maximum: 100 }
        result:           { type: object, nullable: true }
        error_message:    { type: string, nullable: true }
        dead_letter_at:   { type: string, format: date-time, nullable: true }
        created_at:       { type: string, format: date-time }
        completed_at:     { type: string, format: date-time, nullable: true }

    # ── 平台内部工作负载（仅服务身份）────────────────────────────────────────
    PlatformWorkloadAcceleratorCapability:
      type: object
      description: 单个 Core GPUSpec 对平台内部工作负载的准入能力摘要。
      required: [spec_id, available, max_single_node_count]
      properties:
        spec_id:
          type: string
          description: Core GPUSpec ID；只表达资源形态，不表达租户配额。
        available:
          type: boolean
          description: 当前是否允许用于新的 PlatformWorkload 准入。
        max_single_node_count:
          type: integer
          minimum: 0
          description: 能力查询时单节点最大可准入数量；这是提示，不是资源预留。

    PlatformWorkloadCapabilities:
      type: object
      description: Core 当前可供平台服务使用的工作负载拓扑、调度组件和加速器能力。
      required: [supported_topology_modes, leader_worker_set_ready, gang_scheduling_ready, accelerator_specs]
      properties:
        supported_topology_modes:
          type: array
          minItems: 1
          uniqueItems: true
          description: 当前允许创建的平台工作负载拓扑模式集合。
          items: { type: string, enum: [single_node, leader_worker] }
        leader_worker_set_ready:
          type: boolean
          description: LeaderWorkerSet CRD 与 controller 是否满足准入前置条件。
        gang_scheduling_ready:
          type: boolean
          description: gang scheduler、PodGroup CRD/controller 与 inference queue 是否就绪。
        supported_topology_profiles:
          type: array
          description: Core admission allowlist 中已启用的版本化拓扑 profile。
          items:
            type: object
            required: [id, version, mode]
            properties:
              id: { type: string, description: "调用方创建工作负载时提交的拓扑 profile ID。" }
              version: { type: string, description: "拓扑 profile 的不可变版本标识。" }
              mode: { type: string, enum: [single_node, leader_worker], description: "该 profile 支持的拓扑模式。" }
        accelerator_specs:
          type: array
          description: 当前可查询的加速器规格及其准入可用性。
          items: { $ref: '#/components/schemas/PlatformWorkloadAcceleratorCapability' }

    PlatformWorkloadAcceleratorResources:
      type: object
      description: 单个 Pod role 或单节点副本申请的加速器资源。
      required: [spec_id, count]
      additionalProperties: false
      properties:
        spec_id:
          type: string
          minLength: 1
          description: Core GPUSpec ID。P0 只准入已通过 live gate 的整卡 GPU 规格。
        count:
          type: integer
          minimum: 1
          description: 当前 Pod role 或单节点副本申请的 accelerator 数量。

    PlatformWorkloadResources:
      type: object
      description: 单个 Pod role 或单节点副本的计算资源请求。
      required: [cpu, memory]
      additionalProperties: false
      properties:
        cpu:
          type: string
          minLength: 1
          description: Kubernetes quantity 语义的 CPU request，例如 4 或 4000m。
        memory:
          type: string
          minLength: 1
          description: Kubernetes quantity 语义的内存 request，例如 16Gi。
        accelerator:
          $ref: '#/components/schemas/PlatformWorkloadAcceleratorResources'
          description: 可选加速器资源；CPU 工作负载不提交该字段。

    PlatformWorkloadRole:
      type: object
      description: leader-worker 拓扑中一个角色的 Pod 数量和单 Pod 资源规格。
      required: [resources]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 1
          default: 1
          description: role Pod 数；leader 固定为 1，workers 必须显式给出。
        resources:
          $ref: '#/components/schemas/PlatformWorkloadResources'
          description: 该 role 中每个 Pod 使用的计算资源规格。

    PlatformWorkloadTopology:
      type: object
      required: [mode, profile_id, profile_version]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [single_node, leader_worker]
          description: single_node 使用 Deployment；leader_worker 使用 LeaderWorkerSet。
        profile_id:
          type: string
          minLength: 1
          description: Core admission allowlist 中的通用 Pod 拓扑 profile ID。
        profile_version:
          type: string
          minLength: 1
          description: 与 profile_id 配套的不可变版本；Core 不自动升级调用方提交的版本。
        leader:
          $ref: '#/components/schemas/PlatformWorkloadRole'
          description: leader_worker 模式的 leader role；single_node 模式禁止提交。
        workers:
          $ref: '#/components/schemas/PlatformWorkloadRole'
          description: leader_worker 模式的 worker role；single_node 模式禁止提交。
      allOf:
        - if:
            properties: { mode: { const: single_node } }
            required: [mode]
          then:
            not:
              anyOf:
                - required: [leader]
                - required: [workers]
        - if:
            properties: { mode: { const: leader_worker } }
            required: [mode]
          then:
            required: [leader, workers]
            properties:
              leader:
                allOf:
                  - $ref: '#/components/schemas/PlatformWorkloadRole'
                  - required: [count]
                    properties: { count: { const: 1 } }
              workers:
                allOf:
                  - $ref: '#/components/schemas/PlatformWorkloadRole'
                  - required: [count]
      description: |
        single_node 不得提交 leader/workers。leader_worker 必须同时提交 leader/workers，leader.count 必须为 1；
        P0 leader_worker 只接受顶层 replicas=1。Core 从 role resources 派生 LWS 与一个 PodGroup，调用方不能提交原生字段。

    PlatformWorkloadScheduling:
      type: object
      description: Provider-neutral 调度意图；Core 负责映射为实际队列和 gang scheduling 对象。
      required: [queue_class, gang]
      additionalProperties: false
      properties:
        queue_class:
          type: string
          enum: [inference]
          description: P0 固定映射到 Core 管理的 inference 调度队列，调用方不提交 provider queue 名。
        gang:
          type: boolean
          description: single_node 固定 false；leader_worker 固定 true。

    PlatformWorkloadPort:
      type: object
      description: 平台工作负载通过集群内部 Service 暴露的单个命名端口。
      required: [name, port]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: 端口的稳定 DNS label 名称，供健康检查通过 port_name 引用。
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 容器监听并由 ClusterIP Service 暴露的 TCP 端口号。

    PlatformWorkloadNetwork:
      type: object
      description: 平台工作负载的集群内部网络暴露意图。
      required: [exposure, ports]
      additionalProperties: false
      properties:
        exposure:
          type: string
          enum: [cluster_internal]
          description: 只允许 ClusterIP；不创建 Ingress、NodePort 或 LoadBalancer。
        ports:
          type: array
          minItems: 1
          description: 由同一个 ClusterIP Service 暴露的命名端口列表。
          items: { $ref: '#/components/schemas/PlatformWorkloadPort' }

    PlatformWorkloadArtifact:
      type: object
      description: 由 Core 解析并挂载到工作负载的租户内只读 artifact。
      required: [object_ref, mount_path]
      additionalProperties: false
      properties:
        object_ref:
          type: string
          minLength: 1
          description: Core 可解析的租户内 artifact/object opaque reference。
        mount_path:
          type: string
          pattern: '^/'
          description: artifact 在容器中的绝对挂载路径。

    PlatformWorkloadSecretBinding:
      type: object
      description: 由 Core 解析并以文件形式挂载的租户内 Secret 引用。
      required: [secret_ref, mount_path]
      additionalProperties: false
      properties:
        secret_ref:
          type: string
          minLength: 1
          description: Core Secret reference；响应和日志不得回显明文。
        mount_path:
          type: string
          pattern: '^/'
          description: Secret 在容器中的绝对挂载路径；不得与 artifact 挂载路径冲突。

    PlatformWorkloadHealthCheck:
      type: object
      description: Core 用于判断 provider runtime 是否就绪的集群内部健康检查。
      required: [protocol, path, port_name]
      additionalProperties: false
      properties:
        protocol: { type: string, enum: [http], description: "健康检查协议；P0 仅支持 HTTP。" }
        path: { type: string, pattern: '^/', description: "发送到 runtime 的 HTTP 健康检查绝对路径。" }
        port_name: { type: string, minLength: 1, description: "引用 network.ports 中同名端口。" }

    PlatformWorkloadMetadata:
      type: object
      description: 调用服务提供的关联元数据；不用于传递 provider 对象或业务凭据。
      required: [owner_ref]
      additionalProperties: false
      properties:
        owner_ref:
          type: string
          minLength: 1
          description: 调用服务提供的 opaque correlation reference；真正 provider owner 始终是 Core PlatformWorkload。
        labels:
          type: object
          additionalProperties: { type: string }
          description: 仅允许非保留 label；ani.* 保留键由 Core 写入。

    PlatformWorkloadCreateRequest:
      type: object
      description: 平台服务创建 Core 托管工作负载时提交的完整期望规格。
      required: [idempotency_key, name, workload_class, runtime_kind, image_ref, command, replicas, resources, topology, scheduling, network, health_check, metadata]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid, description: "一次逻辑创建操作的幂等键；重试必须复用同一个值。" }
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: 租户内可读且符合 DNS label 的工作负载名称。
        workload_class:
          type: string
          enum: [inference]
          description: 通用调度分类；不携带模型、引擎或 Services 业务状态。
        runtime_kind: { type: string, enum: [container], description: "Core runtime 类型；P0 仅支持容器工作负载。" }
        image_ref:
          type: string
          minLength: 1
          pattern: '^.+@sha256:[a-f0-9]{64}$'
          description: 必须是批准 registry 中的 digest-pinned image；tag 和 latest 必须拒绝。
        command:
          type: array
          minItems: 1
          items: { type: string }
          description: 必须匹配 workload_class + topology profile 的 Core admission allowlist。
        args:
          type: array
          description: 追加到 command 后的容器启动参数；必须通过对应 admission allowlist。
          items: { type: string }
        replicas:
          type: integer
          minimum: 1
          description: single_node 表示 Pod 副本；leader_worker 表示 LWS group，P0 只接受 1。
        resources:
          $ref: '#/components/schemas/PlatformWorkloadResources'
          description: single_node 模式下每个副本使用的计算资源；leader_worker 的实际资源由 topology roles 定义。
        topology:
          $ref: '#/components/schemas/PlatformWorkloadTopology'
          description: 选择单节点 Deployment 或版本化 leader-worker 执行拓扑。
        scheduling:
          $ref: '#/components/schemas/PlatformWorkloadScheduling'
          description: 与 topology 一致的 provider-neutral 队列和 gang scheduling 意图。
        network:
          $ref: '#/components/schemas/PlatformWorkloadNetwork'
          description: 仅允许创建集群内部 ClusterIP Service 的网络规格。
        artifacts:
          type: array
          description: 需要由 Core 解析并挂载的租户内 artifact 列表。
          items: { $ref: '#/components/schemas/PlatformWorkloadArtifact' }
        secret_bindings:
          type: array
          description: 需要由 Core 解析并挂载的租户内 Secret 引用列表。
          items: { $ref: '#/components/schemas/PlatformWorkloadSecretBinding' }
        health_check:
          $ref: '#/components/schemas/PlatformWorkloadHealthCheck'
          description: Core 观察 runtime readiness 使用的集群内部健康检查。
        metadata:
          $ref: '#/components/schemas/PlatformWorkloadMetadata'
          description: 调用服务的 owner correlation reference 和非保留 labels。
      allOf:
        - if:
            properties:
              topology:
                properties: { mode: { const: single_node } }
                required: [mode]
          then:
            properties:
              scheduling:
                properties: { gang: { const: false } }
        - if:
            properties:
              topology:
                properties: { mode: { const: leader_worker } }
                required: [mode]
          then:
            properties:
              replicas: { const: 1 }
              scheduling:
                properties: { gang: { const: true } }
      example:
        idempotency_key: 1df72d71-9d49-46c4-a48a-52bb37b082ab
        name: inference-cpu-example
        workload_class: inference
        runtime_kind: container
        image_ref: registry.ani.internal/platform/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        command: [/opt/platform-runtime/serve]
        args: [--listen, '0.0.0.0:8000', --artifact-path, /models]
        replicas: 1
        resources: { cpu: '4', memory: 16Gi }
        topology: { mode: single_node, profile_id: container-single-node, profile_version: v1 }
        scheduling: { queue_class: inference, gang: false }
        network:
          exposure: cluster_internal
          ports: [{ name: http, port: 8000 }]
        artifacts: [{ object_ref: object://tenant-artifact/example, mount_path: /models }]
        health_check: { protocol: http, path: /health, port_name: http }
        metadata:
          owner_ref: 05f6f46f-3db8-4551-8497-c46debb4be22
          labels: { services.ani.io/inference-service-id: 05f6f46f-3db8-4551-8497-c46debb4be22 }

    PlatformWorkloadUpdateRequest:
      type: object
      description: P0 平台工作负载副本数更新请求；资源和 placement 不可在线变更。
      required: [idempotency_key, replicas]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid, description: "一次逻辑更新操作的幂等键；重试必须复用同一个值。" }
        replicas:
          type: integer
          minimum: 1
          description: P0 只允许修改 single_node 独立副本；leader_worker 固定为 1。

    PlatformWorkloadLifecycleRequest:
      type: object
      description: 平台工作负载启动、停止或重启的幂等生命周期请求。
      required: [idempotency_key, action]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid, description: "一次逻辑生命周期操作的幂等键；重试必须复用同一个值。" }
        action: { type: string, enum: [start, stop, restart], description: "期望执行的生命周期动作。" }

    PlatformWorkload:
      type: object
      description: Core 保存并向授权平台服务返回的平台工作负载状态投影。
      required: [id, tenant_id, name, state, generation, observed_generation, desired_replicas, ready_replicas, runtime_shape, topology_profile_id, topology_profile_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: "Core 分配的平台工作负载稳定 ID。" }
        tenant_id: { type: string, format: uuid, description: "工作负载所属租户；所有读写必须受租户上下文隔离。" }
        name: { type: string, description: "创建请求中的租户内工作负载名称。" }
        state: { type: string, enum: [pending, provisioning, running, starting, stopping, stopped, failed, deleting, deleted], description: "Core 根据期望状态和 provider observation 收敛出的生命周期状态。" }
        generation: { type: integer, minimum: 1, description: "每次成功修改期望规格时递增的版本号。" }
        observed_generation: { type: integer, minimum: 0, description: "provider observation 已处理的最新 generation；小于 generation 表示仍在收敛。" }
        desired_replicas:
          type: integer
          minimum: 0
          description: Deployment 为 Pod 数；LeaderWorkerSet 为 group 数。
        ready_replicas:
          type: integer
          minimum: 0
          description: 与 desired_replicas 同单位；LeaderWorkerSet 直接投影 group 级 readyReplicas。
        runtime_shape: { type: string, enum: [deployment, leader_worker_set], description: "Core 根据已批准 topology profile 选择的 provider runtime 形态。" }
        topology_profile_id: { type: string, description: "当前 applied topology profile ID。" }
        topology_profile_version: { type: string, description: "当前 applied topology profile 的不可变版本。" }
        internal_endpoint:
          type: string
          format: uri
          nullable: true
          description: Only an authorized platform service identity may read this cluster-internal endpoint; never expose it through /instances or tenant-facing Services APIs.
        reason: { type: string, nullable: true, description: "当前状态的稳定机器可读原因码；无原因时为 null。" }
        message: { type: string, nullable: true, description: 脱敏后的诊断信息，不包含 provider 对象或凭据。 }
        created_at: { type: string, format: date-time, description: "平台工作负载资源创建时间。" }
        updated_at: { type: string, format: date-time, description: "期望规格或观察状态最后更新时间。" }

    PlatformWorkloadLogEntry:
      type: object
      description: 从工作负载 runtime 聚合并完成脱敏的一条日志记录。
      required: [timestamp, level, message]
      properties:
        timestamp: { type: string, format: date-time, description: "日志事件时间。" }
        level: { type: string, enum: [debug, info, warn, error], description: "归一化后的日志级别。" }
        message: { type: string, description: "脱敏后的日志正文，不得包含 Secret、凭据或 provider 内部对象。" }
        replica: { type: string, nullable: true, description: 稳定的副本或 role 标识，不返回 Pod UID。 }
        container: { type: string, nullable: true, description: "多容器 runtime 中的稳定容器名称；无法确定时为 null。" }
        stream: { type: string, enum: [stdout, stderr], nullable: true, description: "日志来源流；无法确定时为 null。" }

    PlatformWorkloadLogListResponse:
      type: object
      description: 平台工作负载日志的游标分页响应。
      required: [items]
      properties:
        items:
          type: array
          description: 按时间顺序返回的脱敏日志记录。
          items: { $ref: '#/components/schemas/PlatformWorkloadLogEntry' }
        next_cursor: { type: string, nullable: true, description: "下一页游标；没有更多日志时为 null。" }

    # Demo/Services schemas 已迁移：
    # - DemoInstance/DemoCreateInstanceRequest → api/openapi/dev.yaml
    # - Model/InferenceService/KnowledgeBase path/schema → api/openapi/services/v1.yaml

    # ── ANI Core 基础设施 Schemas ─────────────────────────────────────────────

    HealthCheck:
      type: object
      required: [status, checks]
      properties:
        status:  { type: string, enum: [ok, degraded, error] }
        version: { type: string, example: "v0.8.0" }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:     { type: string, enum: [ok, fail] }
              latency_ms: { type: integer }
              error:      { type: string, nullable: true }

    CoreDevProfileInfo:
      type: object
      description: "Core dev/local profile 标记；用于区分本地联调成功与真实 provider 执行成功。"
      required: [mode, provider, real_provider]
      properties:
        mode:          { type: string, enum: [local, real] }
        provider:      { type: string }
        real_provider: { type: boolean }
        reason:        { type: string, nullable: true }

    InstanceNetworkConfig:
      type: object
      description: "实例网络引用；只表达 Core 产品意图，不暴露 provider 对象。"
      properties:
        vpc_id:              { type: string, nullable: true }
        subnet_id:           { type: string, nullable: true }
        security_group_ids:  { type: array, items: { type: string } }
        assign_private_ip:   { type: boolean, default: true }
        private_ip:          { type: string, nullable: true }

    InstanceDiskSpec:
      type: object
      description: "实例磁盘声明。volume_id 与新盘字段两种模式互斥。"
      properties:
        volume_id:            { type: string, minLength: 1 }
        name:                 { type: string, minLength: 1 }
        size_gib:             { type: integer, format: int64, minimum: 1 }
        volume_type:          { type: string, nullable: true }
        storage_class:        { type: string, nullable: true }
        encrypted:            { type: boolean, default: false }
        delete_on_failure:    { type: boolean, default: true }
        delete_with_instance: { type: boolean, default: false }
      oneOf:
        - required: [volume_id]
        - required: [name, size_gib]

    InstanceVolumeMount:
      type: object
      required: [volume_id, mount_path]
      properties:
        volume_id:  { type: string }
        mount_path: { type: string, minLength: 1 }
        read_only:  { type: boolean, default: false }

    InstanceFilesystemMount:
      type: object
      required: [filesystem_id, mount_path]
      properties:
        filesystem_id: { type: string }
        mount_path:     { type: string, minLength: 1 }
        read_only:      { type: boolean, default: false }

    InstancePortSpec:
      type: object
      required: [container_port]
      properties:
        name:           { type: string, nullable: true }
        container_port: { type: integer, minimum: 1, maximum: 65535 }
        protocol:       { type: string, enum: [tcp, udp], default: tcp }

    InstanceEnvVar:
      type: object
      required: [name]
      description: "value 与 secret_ref 互斥；敏感值必须使用 secret_ref。"
      properties:
        name:       { type: string, minLength: 1 }
        value:      { type: string }
        secret_ref: { type: string, minLength: 1 }
      oneOf:
        - required: [value]
        - required: [secret_ref]

    InstanceWorkloadIdentityConfig:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        scopes:
          type: array
          items: { type: string, pattern: "^scope:[a-z0-9_-]+:(\\*|[a-z0-9_-]+)$" }

    InstanceImageSummary:
      type: object
      description: "实例固定的镜像摘要；不得包含 Registry 凭据。"
      properties:
        id:           { type: string, nullable: true }
        ref:          { type: string, nullable: true }
        digest:       { type: string, nullable: true }
        name:         { type: string, nullable: true }
        tag:          { type: string, nullable: true }
        purpose:      { type: string, nullable: true, enum: [container, gpu, sandbox, system, null] }
        architecture: { type: string, nullable: true }

    InstanceComputeSummary:
      type: object
      properties:
        cpu:               { type: string, nullable: true }
        memory:            { type: string, nullable: true }
        spec_id:           { type: string, nullable: true }
        gpu_type:          { type: string, nullable: true }
        gpu_shares:        { type: integer, minimum: 1, nullable: true }
        gpu_mb_per_share:  { type: integer, minimum: 1, nullable: true }
        availability_zone: { type: string, nullable: true }
        node_name:         { type: string, nullable: true }

    InstanceNetworkSummary:
      type: object
      properties:
        vpc_id:      { type: string, nullable: true }
        vpc_name:    { type: string, nullable: true }
        subnet_id:   { type: string, nullable: true }
        subnet_name: { type: string, nullable: true }
        private_ip:  { type: string, nullable: true }
        security_groups:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:   { type: string }
              name: { type: string, nullable: true }
        endpoints:
          type: array
          items:
            type: object
            required: [address]
            properties:
              name:     { type: string, nullable: true }
              address:  { type: string }
              protocol: { type: string, nullable: true }
              port:     { type: integer, minimum: 1, maximum: 65535, nullable: true }
        load_balancer_refs:
          type: array
          items: { type: string }

    InstanceAccessSummary:
      type: object
      required: [ssh_available, console_available, exec_available]
      properties:
        ssh_available:     { type: boolean }
        console_available: { type: boolean }
        exec_available:    { type: boolean }
        reason:            { type: string, nullable: true }

    InstanceStorageAttachment:
      type: object
      required: [resource_type, resource_id, status]
      properties:
        resource_type: { type: string, enum: [volume, filesystem] }
        resource_id:   { type: string }
        name:          { type: string, nullable: true }
        mount_path:    { type: string, nullable: true }
        read_only:     { type: boolean, default: false }
        status:        { type: string, enum: [pending, attached, mounted, detaching, failed] }
        task_id:       { type: string, nullable: true }

    InstanceRecord:
      type: object
      description: ANI Core 计算实例（VM/Container/GPU/Sandbox/BM/K8s集群/Batch）
      required: [id, tenant_id, name, kind, state, provider, created_at, updated_at]
      properties:
        id:             { type: string }
        tenant_id:      { type: string }
        name:           { type: string }
        description:    { type: string, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }
        kind:           { type: string, enum: [vm, container, gpu_container, sandbox, batch_job, notebook, k8s_cluster, bare_metal, dpu_node] }
        instance_type:  { type: string, enum: [vm, container, gpu_container, sandbox, batch_job, notebook, k8s_cluster, bare_metal, dpu_node], description: "kind 的兼容别名；新客户端可用 instance_type 表达实例类型。" }
        state:          { type: string, enum: [pending, provisioning, starting, running, stopping, stopped, failed, deleting, deleted] }
        state_reason:   { type: string, nullable: true, description: "机器可读的状态原因码，如 InsufficientGPU" }
        state_message:  { type: string, nullable: true, description: "人类可读的状态描述" }
        provider:       { type: string, example: "kubernetes_rest" }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        audit_id:       { type: string, nullable: true }
        resource_refs:  { type: array, items: { type: string } }
        endpoint:       { type: string, nullable: true }
        node_name:      { type: string, nullable: true }
        image:
          $ref: '#/components/schemas/InstanceImageSummary'
        compute:
          $ref: '#/components/schemas/InstanceComputeSummary'
        network:
          $ref: '#/components/schemas/InstanceNetworkSummary'
        access:
          $ref: '#/components/schemas/InstanceAccessSummary'
        storage_attachments:
          type: array
          items: { $ref: '#/components/schemas/InstanceStorageAttachment' }
        termination_protection: { type: boolean, default: false, description: "VM 危险操作保护开关；开启后 stop/delete/rebuild 等操作必须先关闭保护" }
        ssh:
          type: object
          nullable: true
          description: "VM SSH 连接信息；仅返回连接元数据，不返回私钥"
          required: [username, host, port, ready]
          properties:
            username: { type: string, example: "ubuntu" }
            host:     { type: string, nullable: true }
            port:     { type: integer, default: 22 }
            key_ref:  { type: string, nullable: true, description: "SSH key/secret 引用；不包含私钥内容" }
            ready:    { type: boolean, description: "连接信息是否已可用于发起 SSH" }
            reason:   { type: string, nullable: true }
        volumes:
          type: array
          items:
            type: object
            required: [name, kind]
            properties:
              name:       { type: string }
              kind:       { type: string, enum: [root_disk, data_disk, shared_pvc, object_fuse, ephemeral] }
              size_gib:   { type: integer, format: int64 }
              source_ref: { type: string, nullable: true }
              mount_path: { type: string, nullable: true }
              read_only:  { type: boolean, default: false }
        container:
          type: object
          nullable: true
          description: "Container/GPU Container 部署状态摘要"
          properties:
            replicas:       { type: integer, minimum: 0, default: 1 }
            ready_replicas: { type: integer, minimum: 0, default: 0 }
            revision:       { type: string, nullable: true }
            rollout_status: { type: string, nullable: true, enum: [pending, progressing, healthy, degraded, rolled_back] }
            history:
              type: array
              items:
                type: object
                required: [revision, created_at]
                properties:
                  revision:   { type: string }
                  image:      { type: string, nullable: true }
                  created_at: { type: string, format: date-time }
        gpu:
          type: object
          nullable: true
          description: "GPU container 调度和利用率状态"
          properties:
            spec_id:               { type: string, nullable: true }
            gpu_type:              { type: string, nullable: true }
            shares:                { type: integer, minimum: 1, nullable: true }
            mb_per_share:          { type: integer, minimum: 1, nullable: true }
            vendor:                { type: string, nullable: true }
            model:                 { type: string, nullable: true }
            count:                 { type: integer, minimum: 0 }
            queue_name:            { type: string, nullable: true, description: "调度队列名（Volcano Queue）" }
            resource_name:         { type: string, nullable: true, description: "调度资源名，如 nvidia.com/gpu 或 nvidia.com/vgpu" }
            scheduling_state:      { type: string, nullable: true, enum: [pending, queued, scheduled, running, failed, null] }
            scheduling_reason:     { type: string, nullable: true, description: "调度说明或失败原因，如 InsufficientGPU" }
            utilization_percent:   { type: number, format: float, minimum: 0, maximum: 100, nullable: true }
        sandbox:
          $ref: '#/components/schemas/SandboxInstanceStatus'
        workload_identity:
          $ref: '#/components/schemas/WorkloadIdentityBinding'
        snapshots:
          type: array
          description: "VM 快照元数据；provider-native 快照执行后续通过 reconcile 对齐"
          items:
            type: object
            required: [id, name, source_instance_id, state, created_at]
            properties:
              id:                 { type: string }
              name:               { type: string }
              source_instance_id: { type: string }
              state:              { type: string, enum: [creating, ready, failed, deleting, deleted] }
              reason:             { type: string, nullable: true }
              created_at:         { type: string, format: date-time }
              ready_at:           { type: string, format: date-time, nullable: true }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    WorkloadIdentityBinding:
      type: object
      description: "实例生命周期绑定的 scoped API key 摘要；不返回 key 明文。"
      required: [active]
      properties:
        key_id:     { type: string, nullable: true }
        key_prefix: { type: string, nullable: true, description: "仅用于展示和排查，不可用于认证" }
        scopes:
          type: array
          items: { type: string, pattern: "^scope:[a-z0-9_-]+:(\\*|[a-z0-9_-]+)$" }
        active:     { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    InstanceOperation:
      type: object
      description: 实例操作记录（创建/启动/停止/变配/删除等）
      required: [id, instance_id, tenant_id, operation, status, requested_by, created_at]
      properties:
        id:               { type: string }
        instance_id:      { type: string }
        tenant_id:        { type: string }
        operation:
          type: string
          enum: [create, start, stop, restart, resize, rebuild, delete, snapshot, attach_volume, detach_volume, attach_filesystem, detach_filesystem, rollback, scale, update_image, bind_secret, unbind_secret, change_security_groups, set_termination_protection, pause, resume, extend, touch_idle, console_session]
        status:           { type: string, enum: [accepted, in_progress, succeeded, failed, cancelled] }
        idempotency_key:  { type: string, nullable: true, description: "客户端提供的幂等键" }
        requested_by:     { type: string, description: "发起操作的用户 ID" }
        precheck_result:  { type: object, nullable: true }
        failure_reason:   { type: string, nullable: true }
        failure_message:  { type: string, nullable: true }
        retry_eligible:   { type: boolean, default: false }
        steps:
          type: array
          items:
            type: object
            required: [step_name, status]
            properties:
              step_name:    { type: string, example: "admission_check" }
              status:       { type: string, enum: [pending, running, succeeded, failed, skipped] }
              message:      { type: string, nullable: true }
              task_id:      { type: string, nullable: true, description: "关联异步任务 ID，例如 Storage task。" }
              resource_type: { type: string, nullable: true, description: "关联资源类型；不得伪造 task_type。" }
              resource_id:   { type: string, nullable: true }
              started_at:   { type: string, format: date-time, nullable: true }
              completed_at: { type: string, format: date-time, nullable: true }
        before_spec:      { type: object, nullable: true, description: "变更前的实例规格快照（用于 diff）" }
        after_spec:       { type: object, nullable: true, description: "变更后的实例规格快照" }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    InstanceListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InstanceRecord' }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    CreateInstanceRequest:
      type: object
      required: [name, kind, idempotency_key]
      description: |
        创建实例请求。共享字段（name/kind/image/cpu/memory 等）留在顶层；
        按 kind 选用对应 `*_config`（推荐）。扁平 VM/容器/GPU 字段保留为 v1 兼容别名。
        同名字段以 `*_config` 为准；与扁平别名冲突或传入跨类型 config 时返回 400。
        network_config 优先级：`*_config.network` > 顶层 `network_config`；
        两者同时提供时以 `*_config.network` 为准，顶层 `network_config` 作为 fallback。
        同时提供且字段冲突时返回 400。
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128, description: "客户端生成；同一 tenant_id 下 24 小时内去重" }
        name:           { type: string, minLength: 1, maxLength: 128 }
        description:    { type: string, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }
        kind:           { type: string, enum: [vm, container, gpu_container, sandbox] }
        instance_type:  { type: string, enum: [vm, container, gpu_container, sandbox], description: "kind 的兼容别名；两者同时传入时必须一致。" }
        image_id:       { type: string, nullable: true, description: "推荐的 Registry 镜像 ID；创建前固定 digest。" }
        image_ref:      { type: string, nullable: true, description: "兼容外部镜像引用；优先使用 image_id。" }
        image:          { type: string, nullable: true, deprecated: true, description: "兼容字段；优先使用 image_id 或 image_ref。" }
        cpu:            { type: string, example: "2" }
        memory:         { type: string, example: "4Gi" }
        auto_start:     { type: boolean, default: true }
        vm_config:
          $ref: '#/components/schemas/CreateVMInstanceConfig'
        container_config:
          $ref: '#/components/schemas/CreateContainerInstanceConfig'
        gpu_container_config:
          $ref: '#/components/schemas/CreateGPUContainerInstanceConfig'
        sandbox_config:
          $ref: '#/components/schemas/SandboxConfig'
        boot_image:
          type: string
          nullable: true
          deprecated: true
          description: "兼容别名；优先使用 vm_config.boot_image"
        ssh_username:
          type: string
          nullable: true
          default: "ubuntu"
          deprecated: true
          description: "兼容别名；优先使用 vm_config.ssh_username"
        ssh_key_ref:
          type: string
          nullable: true
          deprecated: true
          description: "兼容别名；优先使用 vm_config.ssh_key_ref"
        termination_protection: { type: boolean, default: false }
        network_config:
          $ref: '#/components/schemas/InstanceNetworkConfig'
        gpu:
          type: object
          nullable: true
          deprecated: true
          description: "兼容别名；优先使用 gpu_container_config.gpu"
          properties:
            vendor:          { type: string, example: "nvidia" }
            model:           { type: string, example: "A100" }
            count:           { type: integer, minimum: 1, default: 1 }
            queue_name:      { type: string, nullable: true, description: "指定调度队列名；为空时按 workload_class 选默认队列" }
            allocation_mode: { type: string, enum: [dedicated, vgpu], default: dedicated, description: "GPU 分配模式：dedicated=整卡，vgpu=HAMi vGPU" }
            workload_class:  { type: string, enum: [inference, training, batch], default: inference, description: "工作负载类型，用于选默认队列" }
        replicas:
          type: integer
          minimum: 1
          default: 1
          deprecated: true
          description: "兼容别名；优先使用 container_config.replicas 或 gpu_container_config.replicas"

    CreateVMInstanceConfig:
      type: object
      description: "kind=vm 专用配置；共享 image/cpu/memory 仍在 CreateInstanceRequest 顶层。"
      properties:
        network:
          $ref: '#/components/schemas/InstanceNetworkConfig'
        os_type:             { type: string, enum: [linux, windows], default: linux }
        boot_image:          { type: string, nullable: true, deprecated: true, description: "兼容字段；优先使用 CreateInstanceRequest.image_id。" }
        ssh_username:        { type: string, nullable: true, default: "ubuntu", description: "VM SSH 用户名" }
        ssh_key_ref:         { type: string, nullable: true, description: "VM SSH key/secret 引用；不包含私钥内容" }
        password_secret_ref: { type: string, nullable: true, description: "登录密码 Secret 引用；不返回明文。" }
        user_data:           { type: string, nullable: true, description: "cloud-init user data；不得包含长期明文凭据。" }
        system_disk:
          $ref: '#/components/schemas/InstanceDiskSpec'
        data_disks:
          type: array
          items: { $ref: '#/components/schemas/InstanceDiskSpec' }
        filesystem_mounts:
          type: array
          items: { $ref: '#/components/schemas/InstanceFilesystemMount' }

    CreateContainerInstanceConfig:
      type: object
      description: "kind=container 专用配置；共享 image/cpu/memory 仍在 CreateInstanceRequest 顶层。"
      properties:
        network:
          $ref: '#/components/schemas/InstanceNetworkConfig'
        replicas:
          type: integer
          minimum: 1
          default: 1
          description: "容器副本数"
        ports:
          type: array
          items: { $ref: '#/components/schemas/InstancePortSpec' }
        env:
          type: array
          items: { $ref: '#/components/schemas/InstanceEnvVar' }
        secret_ids:
          type: array
          items: { type: string }
        volume_mounts:
          type: array
          items: { $ref: '#/components/schemas/InstanceVolumeMount' }
        filesystem_mounts:
          type: array
          items: { $ref: '#/components/schemas/InstanceFilesystemMount' }
        workload_identity:
          $ref: '#/components/schemas/InstanceWorkloadIdentityConfig'

    CreateGPUContainerInstanceConfig:
      type: object
      description: "kind=gpu_container 专用配置；共享 image/cpu/memory 仍在 CreateInstanceRequest 顶层。"
      properties:
        network:
          $ref: '#/components/schemas/InstanceNetworkConfig'
        replicas:
          type: integer
          minimum: 1
          default: 1
          description: "GPU 容器副本数"
        ports:
          type: array
          items: { $ref: '#/components/schemas/InstancePortSpec' }
        env:
          type: array
          items: { $ref: '#/components/schemas/InstanceEnvVar' }
        secret_ids:
          type: array
          items: { type: string }
        volume_mounts:
          type: array
          items: { $ref: '#/components/schemas/InstanceVolumeMount' }
        filesystem_mounts:
          type: array
          items: { $ref: '#/components/schemas/InstanceFilesystemMount' }
        workload_identity:
          $ref: '#/components/schemas/InstanceWorkloadIdentityConfig'
        gpu:
          type: object
          nullable: true
          description: |
            GPU 资源选择。推荐传 spec_id 引用 Core GPUSpec；规格模式只解析资源形态和调度参数，
            当前不表达租户配额扣减。旧字段保留用于 v1 兼容，和 spec_id 同时传入时必须一致。
          properties:
            spec_id:         { type: string, nullable: true, description: "Core GPUSpec ID；通过 /gpu-specs 查询可用规格。" }
            vendor:          { type: string, example: "nvidia", deprecated: true, description: "兼容字段；规格模式下由 spec_id 解析。" }
            model:           { type: string, example: "A100", deprecated: true, description: "兼容字段；规格模式下由 spec_id 解析。" }
            count:           { type: integer, minimum: 1, default: 1, deprecated: true, description: "兼容字段；规格模式下由 shares 等规格字段解析。" }
            queue_name:      { type: string, nullable: true, description: "指定调度队列名；为空时按 workload_class 选默认队列" }
            allocation_mode: { type: string, enum: [dedicated, vgpu], default: dedicated, deprecated: true, description: "兼容字段；规格模式下由 shares=1 或切分规格确定。" }
            workload_class:  { type: string, enum: [inference, training, batch], default: inference, description: "工作负载类型，用于选默认队列" }

    SandboxNetworkEgressPolicy:
      type: string
      description: "Sandbox 出口策略；local profile 仅记录意图，不代表真实网络隔离已执行。"
      enum: [deny_all, allowlist, internet]

    SandboxConfig:
      type: object
      description: "Sandbox 实例配置；表达 ANI 产品意图，不暴露 Kubernetes/Kata provider 对象。"
      properties:
        template_id:
          type: string
          nullable: true
          description: "SandboxTemplate ID；模板不可用时创建返回 422。"
        runtime_class:
          type: string
          default: sandbox-kata
          description: "目标 RuntimeClass 名称，P0 默认 Kata Containers QEMU profile。"
        session_timeout:
          type: string
          default: 30m
          description: "会话最大存活时间，Go duration 字符串，如 30m、2h。"
        idle_timeout:
          type: string
          default: 10m
          description: "空闲超时时间，Go duration 字符串。"
        on_timeout:
          type: string
          enum: [pause, kill]
          default: pause
        network_egress_policy:
          $ref: '#/components/schemas/SandboxNetworkEgressPolicy'
        egress_allowlist:
          type: array
          items: { type: string }
        env:
          type: array
          items: { $ref: '#/components/schemas/InstanceEnvVar' }
        initial_ports:
          type: array
          items: { $ref: '#/components/schemas/InstancePortSpec' }

    SandboxInstanceStatus:
      type: object
      nullable: true
      description: "Sandbox 实例运行摘要；dev_profile.real_provider=false 时仅表示 local profile 状态机。"
      required: [runtime_class, session_timeout, network_egress_policy, session_state]
      properties:
        template_id:            { type: string, nullable: true }
        runtime_class:          { type: string }
        session_timeout:        { type: string }
        idle_timeout:           { type: string, nullable: true }
        remain_seconds:         { type: integer, minimum: 0, nullable: true }
        idle_remain_seconds:    { type: integer, minimum: 0, nullable: true }
        on_timeout:             { type: string, nullable: true, enum: [pause, kill, null] }
        network_egress_policy:
          $ref: '#/components/schemas/SandboxNetworkEgressPolicy'
        egress_allowlist:
          type: array
          items: { type: string }
        ports:
          type: array
          items:
            type: object
            required: [port, status]
            properties:
              port:        { type: integer, minimum: 1, maximum: 65535 }
              name:        { type: string, nullable: true }
              protocol:    { type: string, enum: [tcp, http], default: tcp }
              status:      { type: string, enum: [opening, available, closing, failed] }
              preview_url: { type: string, nullable: true }
        env:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:       { type: string }
              secret_ref: { type: string, nullable: true }
        checkpoints:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:     { type: string }
              name:   { type: string }
              status: { type: string, enum: [creating, available, restoring, failed, deleted] }
        files_summary:
          type: object
          properties:
            file_count:       { type: integer, minimum: 0 }
            total_size_bytes: { type: integer, format: int64, minimum: 0 }
        session_state:          { type: string, enum: [pending, running, paused, expired, stopped] }
        agent_ref:              { type: string, nullable: true }
        stop_reason:            { type: string, nullable: true, enum: [TTL_EXPIRED, IDLE_EXPIRED, USER_REQUESTED, RUNTIME_FAILED, null] }
        connectivity:
          type: object
          properties:
            token_available: { type: boolean }
            ports_available: { type: boolean }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    CreateSandboxTokenRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        expires_in:      { type: string, default: 15m, description: "Go duration，最大 1h。" }
        scopes:
          type: array
          items: { type: string, enum: [connect, exec, files, ports] }
          default: [connect]

    SandboxTokenResponse:
      type: object
      required: [token, expires_at, scopes]
      description: "token 只在响应中返回；不得写入日志、普通审计或异步任务。"
      properties:
        token:      { type: string }
        expires_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string, enum: [connect, exec, files, ports] }

    CreateSandboxPortRequest:
      type: object
      required: [idempotency_key, port]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        port:            { type: integer, minimum: 1, maximum: 65535 }
        name:            { type: string, nullable: true }
        protocol:        { type: string, enum: [tcp, http], default: tcp }

    SandboxPort:
      type: object
      required: [port, protocol, status, preview_url]
      properties:
        port:        { type: integer, minimum: 1, maximum: 65535 }
        name:        { type: string, nullable: true }
        protocol:    { type: string, enum: [tcp, http] }
        status:      { type: string, enum: [opening, available, closing, failed] }
        preview_url: { type: string, format: uri, nullable: true }
        expires_at:  { type: string, format: date-time, nullable: true }
        reason:      { type: string, nullable: true }

    SandboxFile:
      type: object
      required: [path, kind, size_bytes, updated_at]
      properties:
        path:       { type: string }
        kind:       { type: string, enum: [file, directory] }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }

    SandboxFileListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SandboxFile' }
        total:       { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }

    WriteSandboxFileRequest:
      type: object
      required: [idempotency_key, path]
      description: "content_base64 与 upload_id 互斥。"
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        path:            { type: string, minLength: 1 }
        content_base64:  { type: string, format: byte }
        upload_id:       { type: string, minLength: 1 }
        overwrite:       { type: boolean, default: false }
      oneOf:
        - required: [content_base64]
        - required: [upload_id]

    CreateSandboxCheckpointRequest:
      type: object
      required: [idempotency_key, name]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        name:            { type: string, minLength: 1, maxLength: 128 }
        keep_memory:     { type: boolean, default: false }

    SandboxCheckpoint:
      type: object
      required: [id, name, status, keep_memory, created_at]
      properties:
        id:          { type: string }
        name:        { type: string }
        status:      { type: string, enum: [creating, available, restoring, failed, deleted] }
        keep_memory: { type: boolean }
        created_at:  { type: string, format: date-time }
        size_bytes:  { type: integer, format: int64, minimum: 0, nullable: true }
        reason:      { type: string, nullable: true }

    SandboxCheckpointListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SandboxCheckpoint' }
        total:       { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }

    SandboxCheckpointActionRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }

    CloneSandboxCheckpointRequest:
      type: object
      required: [idempotency_key, name]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        name:            { type: string, minLength: 1, maxLength: 128 }

    CreateSandboxCodeRunRequest:
      type: object
      required: [idempotency_key, language, code]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        language:        { type: string, enum: [python, javascript] }
        code:            { type: string, minLength: 1 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300, default: 60 }
        stdin:           { type: string, nullable: true }

    SandboxCodeRun:
      type: object
      required: [id, status, language, created_at, truncated]
      description: "code/stdin/stdout/stderr 不进入普通审计日志；输出必须执行服务端大小限制。"
      properties:
        id:           { type: string }
        status:       { type: string, enum: [accepted, running, succeeded, failed, timed_out] }
        language:     { type: string, enum: [python, javascript] }
        stdout:       { type: string, nullable: true }
        stderr:       { type: string, nullable: true }
        exit_code:    { type: integer, nullable: true }
        truncated:    { type: boolean }
        created_at:   { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ObservabilityQueryResponse:
      type: object
      description: "PromQL 代理查询结果；不暴露底层 Prometheus 地址。"
      required: [query, result_type, results, dev_profile]
      properties:
        query:       { type: string }
        result_type: { type: string, enum: [vector, matrix, scalar, string] }
        results:
          type: array
          items:
            type: object
            required: [metric, value]
            properties:
              metric:
                type: object
                additionalProperties: { type: string }
              value: { type: number, format: double }
              timestamp: { type: string, format: date-time, nullable: true }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    ObservabilityRangeQueryResponse:
      type: object
      description: "PromQL 代理区间查询结果（matrix）；返回时间区间内多个采样点，用于绘制时序曲线。"
      required: [query, result_type, results, dev_profile]
      properties:
        query:       { type: string }
        result_type: { type: string, enum: [matrix, vector, scalar, string] }
        results:
          type: array
          description: "每条 series 含一组时间序列采样点。"
          items:
            type: object
            required: [metric, values]
            properties:
              metric:
                type: object
                additionalProperties: { type: string }
              values:
                type: array
                description: "时间序列采样点列表，每个点为 [timestamp, value]。"
                items:
                  type: object
                  required: [timestamp, value]
                  properties:
                    timestamp: { type: string, format: date-time }
                    value: { type: number, format: double }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    ObservabilityAlertRule:
      type: object
      required: [id, tenant_id, name, promql, severity, state, created_at, updated_at]
      properties:
        id:          { type: string }
        tenant_id:   { type: string }
        name:        { type: string }
        promql:      { type: string }
        duration:    { type: string, default: 5m }
        severity:    { type: string, enum: [info, warning, critical] }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        enabled:     { type: boolean, default: true }
        state:       { type: string, enum: [active, disabled, deleted] }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    ObservabilityAlertRuleListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ObservabilityAlertRule' }
        total:       { type: integer }
        next_cursor: { type: string, nullable: true }

    CreateObservabilityAlertRuleRequest:
      type: object
      required: [idempotency_key, name, promql, severity]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        name:           { type: string, minLength: 1, maxLength: 128 }
        promql:         { type: string, minLength: 1 }
        duration:       { type: string, default: 5m }
        severity:       { type: string, enum: [info, warning, critical] }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        enabled:        { type: boolean, default: true }

    UpdateObservabilityAlertRuleRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        name:           { type: string, minLength: 1, maxLength: 128 }
        promql:         { type: string, minLength: 1 }
        duration:       { type: string }
        severity:       { type: string, enum: [info, warning, critical] }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        enabled:        { type: boolean }

    MeteringUsageRecord:
      type: object
      required: [resource_type, total_quantity, unit]
      properties:
        resource_type:  { type: string, enum: [instance_cpu_seconds, instance_memory_gib_seconds, instance_gpu_seconds, token_input, token_output, token_total] }
        total_quantity: { type: number, format: double }
        unit:           { type: string }
        period:         { type: string, nullable: true }
        tenant_id:      { type: string, nullable: true }

    MeteringUsageResponse:
      type: object
      required: [items, total, dev_profile]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeteringUsageRecord' }
        total: { type: integer }
        dev_profile:
          $ref: '#/components/schemas/CoreDevProfileInfo'

    ReportTokenUsageRequest:
      type: object
      required: [idempotency_key, source, model, input_tokens, output_tokens]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        source:          { type: string, description: "上报来源，如 model-service、inference-gateway" }
        model:           { type: string }
        input_tokens:    { type: integer, format: int64, minimum: 0 }
        output_tokens:   { type: integer, format: int64, minimum: 0 }
        request_id:      { type: string, nullable: true }
        instance_id:     { type: string, nullable: true }
        occurred_at:     { type: string, format: date-time, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }

    TokenUsageReport:
      type: object
      required: [id, tenant_id, source, model, input_tokens, output_tokens, total_tokens, state, created_at]
      properties:
        id:            { type: string }
        tenant_id:     { type: string }
