  # ── GPU 设备清单（Core API Alpha）────────────────────────────────────────────
  /gpu-inventory:
    get:
      operationId: listGPUInventory
      summary: 查询 GPU 设备清单
      description: 返回平台所有 GPU 卡的清单视图，含型号、状态、租户分配情况。
      tags: [GPUInventory]
      x-ani-rbac-scope: "scope:gpu-inventory:read"
      parameters:
        - { name: gpu_type,  in: query, schema: { type: string } }
        - { name: gpu_mode,  in: query, schema: { type: string, enum: [wholecard, vgpu] }, description: "按 GPU 隔离模式过滤" }
        - { name: status,    in: query, schema: { type: string, enum: [available, in_use, fault, maintenance] } }
        - { name: node_name, in: query, schema: { type: string } }
        - { name: limit,  in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: GPU 设备清单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUInventoryListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /gpu-inventory/occupancy:
    get:
      operationId: getGPUOccupancy
      summary: 查询 GPU 占用分布统计
      tags: [GPUInventory]
      x-ani-rbac-scope: "scope:gpu-inventory:read"
      responses:
        "200":
          description: GPU 占用分布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUOccupancyStats' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /gpu-inventory/{device_id}:
    patch:
      operationId: updateGPUDeviceStatus
      summary: 翻转 GPU 设备状态
      description: |
        将设备状态翻转为 maintenance（维护中）或 idle（空闲）。
        BOSS 在 GPU 池管理中用于设备维护操作。
      tags: [GPUInventory]
      x-ani-rbac-scope: "scope:gpu-inventory:write"
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "幂等键，防止重复操作" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GPUDeviceStatusUpdateRequest' }
      responses:
        "200":
          description: 设备状态已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUInventoryRecord' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/DeviceNotFound' }

  # ── GPU 规格（Core API v1，只读选择契约）──────────────────────────────────────
  /gpu-specs:
    get:
      operationId: listGPUSpecs
      summary: 查询可选 GPU 规格
      description: |
        返回实例创建可引用的 Core 集群级 GPU 规格。规格只描述 GPU 类型、切分份数和显存，
        不表示当前租户配额，也不触发配额扣减、占用或释放。
      tags: [GPUInventory]
      x-ani-rbac-scope: "scope:gpu-inventory:read"
      parameters:
        - { name: gpu_type,  in: query, schema: { type: string } }
        - { name: available, in: query, schema: { type: boolean, default: true } }
        - { name: limit,      in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor,     in: query, schema: { type: string } }
      responses:
        "200":
          description: GPU 规格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUSpecListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createGPUSpec
      summary: 创建 GPU 规格
      description: |
        创建集群级 GPU 规格（K8s CRD）。spec_id 必须符合 K8s 资源名规范且唯一。
        gpu_type 必须存在于节点标签中，否则返回 422 GPUTypeNotInNodes。
      tags: [GPUSpec]
      x-ani-rbac-scope: "scope:gpu-spec:write"
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "幂等键，防止重复创建" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GPUSpecCreateRequest' }
      responses:
        "201":
          description: 规格创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUSpec' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/GPUSpecConflict' }
        "422": { $ref: '#/components/responses/GPUTypeNotInNodes' }

  /gpu-specs/{spec_id}:
    get:
      operationId: getGPUSpec
      summary: 查询单个 GPU 规格
      description: |
        实例服务使用该接口解析 spec_id。available=false 的规格仍可查询以支持历史实例展示，
        但不得用于新实例创建；创建准入由 POST /instances 返回 422 GPUSpecUnavailable。
      tags: [GPUInventory]
      x-ani-rbac-scope: "scope:gpu-inventory:read"
      parameters:
        - { name: spec_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: GPU 规格详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUSpecSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteGPUSpec
      summary: 删除 GPU 规格
      description: |
        删除集群级 GPU 规格。有运行中实例引用时返回 409 GPUSpecInUse。
      tags: [GPUSpec]
      x-ani-rbac-scope: "scope:gpu-spec:write"
      parameters:
        - { name: spec_id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "幂等键，防止重复删除" }
      responses:
        "204":
          description: 删除成功
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/GPUSpecNotFound' }
        "409": { $ref: '#/components/responses/GPUSpecInUse' }

  /gpu-specs/availability:
    get:
      operationId: listGPUSpecAvailability
      summary: 查询规格可用性
      description: |
        返回所有规格的可用性状态（四态：available/full/device_full/unavailable）。
        Console 在实例创建页面展示规格可用性，BOSS 在 GPU 池管理展示规格分配状态。
      tags: [GPUSpec]
      x-ani-rbac-scope: "scope:gpu-spec:read"
      responses:
        "200":
          description: 规格可用性列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPUSpecAvailabilityListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # ── GPU 调度队列（Core API Alpha）─────────────────────────────────────────────
  /gpu-scheduling/queues:
    get:
      operationId: listGPUSchedulingQueues
      summary: 查询 GPU 调度队列列表
      description: 返回当前租户可见的 GPU 调度队列，含平台默认队列和租户自定义队列。
