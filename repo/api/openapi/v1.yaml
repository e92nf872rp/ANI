      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneSandboxCheckpointRequest' }
      responses:
        "201":
          description: 克隆实例已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInstanceResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }

  /instances/{instance_id}/sandbox/code-runs:
    post:
      operationId: createSandboxCodeRun
      summary: 在 Sandbox 中执行一次代码
      description: |
        创建异步代码执行任务，任务结果为 SandboxCodeRun。stdout/stderr 必须受大小限制并在截断时
        标记 truncated；code、stdin 和输出内容不得写入普通日志或普通审计。跨租户实例按 404 处理；
        非 sandbox kind、状态或 provider 能力不满足时返回 422。
      tags: [Instances]
      x-ani-rbac-scope: "scope:instances:exec"
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSandboxCodeRunRequest' }
      responses:
        "202":
          description: 代码执行任务已接受
          headers:
            Location:
              description: 任务查询 URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }

