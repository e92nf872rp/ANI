        "404": { $ref: '#/components/responses/NotFound' }

  /vector-stores/{vector_store_id}/documents:
    post:
      operationId: insertVectorStoreDocuments
      summary: 批量写入向量文档
      description: 将文本内容写入向量存储，嵌入由 Core 负责；POST 必须携带 idempotency_key。
      tags: [VectorStore]
      x-ani-rbac-scope: "scope:vector-stores:write"
      parameters:
        - { name: vector_store_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VectorStoreDocumentInsertRequest' }
      responses:
        "202":
          description: 文档写入任务已提交
          headers:
            Location:
              schema: { type: string }
              description: 任务轮询 URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VectorStoreDocumentInsertResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      operationId: deleteVectorStoreDocuments
      summary: 按 filter 删除向量文档
      description: 按 Milvus boolean expression 过滤删除指定向量存储中的文档向量；DELETE 天然幂等，不要求 idempotency_key。
      tags: [VectorStore]
      x-ani-rbac-scope: "scope:vector-stores:delete"
      parameters:
        - { name: vector_store_id, in: path, required: true, schema: { type: string } }
        - { name: filter, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 }, description: Milvus boolean expression，如 `doc_id == "abc"` }
      responses:
        "200":
          description: 删除完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VectorStoreDocumentDeleteResponse' }
        "400": { $ref: '#/components/responses/InvalidFilter' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/VectorStoreNotFound' }
        "422": { $ref: '#/components/responses/PreconditionFailed' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

