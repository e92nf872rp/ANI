      properties:
        id:            { type: string }
        filesystem_id: { type: string }
        subnet_id:     { type: string }
        vpc_id:        { type: string, nullable: true }
        ip_address:    { type: string }
        status:        { type: string, enum: [creating, available, deleting, error] }
        created_at:    { type: string, format: date-time }
