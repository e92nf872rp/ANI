      x-ani-rbac-scope: "scope:observability:write"
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateObservabilityAlertRuleRequest' }
      responses:
        "200":
          description: 告警规则已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservabilityAlertRule' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteObservabilityAlertRule
      summary: 删除告警规则
      tags: [Observability]
