openapi: 3.1.0

info:
  title: KuberCloud ANI Services API
  version: 1.0.0
  description: |
    ANI Services 层 REST API 契约。由 ANI Services 团队维护。
    models、inference-services、knowledge-bases 等业务资源只在本文件维护；
    ANI Core API 不承载这些业务路径。

servers:
  - url: https://{host}/api/v1/svc
    description: ANI Services API base path
    variables:
      host: { default: ani.internal }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    ApiKeyAuth:  { type: apiKey, in: header, name: X-API-Key }

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: 前置条件不满足（code=PRECONDITION_FAILED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: 前置条件不满足，code 可为 QUOTA_RESOURCE_NOT_REGISTERED（配额维度未注册或已禁用）或 PLAN_NOT_ACTIVE（绑定套餐时套餐状态非 active）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InferenceBadRequest:
      description: 推理服务请求参数或字段组合非法（code=INVALID_ARGUMENT）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InferenceConflict:
      description: 推理服务名称、幂等键或活动操作冲突
      x-ani-error-codes: [NAME_CONFLICT, IDEMPOTENCY_CONFLICT, OPERATION_IN_PROGRESS]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InferenceUnprocessableEntity:
      description: 推理服务前置条件不满足；code 为 MODEL_NOT_READY、MODEL_INCOMPATIBLE、ACCELERATOR_SPEC_UNAVAILABLE、INSUFFICIENT_CAPACITY、UNSUPPORTED_TOPOLOGY、INVALID_STATE_TRANSITION 或 IMAGE_UNAVAILABLE
      x-ani-error-codes: [MODEL_NOT_READY, MODEL_INCOMPATIBLE, ACCELERATOR_SPEC_UNAVAILABLE, INSUFFICIENT_CAPACITY, UNSUPPORTED_TOPOLOGY, INVALID_STATE_TRANSITION, IMAGE_UNAVAILABLE]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FeatureNotAvailable:
      description: 当前版本尚未提供该能力（code=FEATURE_NOT_AVAILABLE）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 推理服务依赖暂时不可用（code=DEPENDENCY_UNAVAILABLE）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RuntimeError:
      description: 推理 runtime 返回异常（code=RUNTIME_ERROR）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RuntimeTimeout:
      description: 推理 runtime 调用超时（code=RUNTIME_TIMEOUT）
    BadGateway:
      description: 下游不可用（code=GRPC_CLIENT_UNAVAILABLE；tenant-service 或 Core 配额 API）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: 下游超时（code=GATEWAY_TIMEOUT）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:       { type: string }
        message:    { type: string }
        request_id: { type: string }
        details:    { type: object, additionalProperties: true }

    CursorPage:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }

    AsyncTask:
      type: object
      required: [id, idempotency_key, task_type, status, created_at]
      properties:
        id:               { type: string, format: uuid }
        idempotency_key:  { type: string }
        task_type:        { type: string }
        resource_type:    { type: string, nullable: true }
        resource_id:      { type: string, format: uuid, nullable: true }
        status:           { type: string, enum: [pending, running, completed, failed, cancelled, dead_letter] }
        attempt_count:    { type: integer, minimum: 0 }
        max_attempts:     { type: integer, minimum: 1 }
        progress_pct:     { type: integer, minimum: 0, maximum: 100 }
        result:           { type: object, nullable: true }
        error_message:    { type: string, nullable: true }
        created_at:       { type: string, format: date-time }
        completed_at:     { type: string, format: date-time, nullable: true }

    Model:
      type: object
      required: [id, name, source, status, created_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        display_name: { type: string }
        description:  { type: string, nullable: true }
        source:       { type: string, enum: [upload, huggingface, modelscope, builtin] }
        capabilities: { type: array, items: { type: string } }
        status:       { type: string, enum: [pending, downloading, ready, error, deleted] }
        total_size_bytes: { type: integer }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ModelVersion' }

    ModelVersion:
      type: object
      required: [id, model_id, version, format, created_at]
      properties:
        id:           { type: string, format: uuid }
        model_id:     { type: string, format: uuid }
        version:      { type: string }
        format:       { type: string, enum: [safetensors, gguf, pytorch] }
        is_encrypted: { type: boolean }
        size_bytes:   { type: integer }
        checksum_sha256: { type: string, nullable: true }
        storage_path: { type: string }
        created_at:   { type: string, format: date-time }

    CreateModelUploadURLRequest:
      type: object
      required: [idempotency_key, version, file_name, size_bytes]
      properties:
        idempotency_key: { type: string, format: uuid }
        version: { type: string, minLength: 1, maxLength: 128 }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        size_bytes: { type: integer, minimum: 1 }

    ModelUploadURLResponse:
      type: object
      required: [upload_url, storage_path, expires_at]
      properties:
        upload_url: { type: string, format: uri }
        storage_path: { type: string }
        expires_at: { type: string, format: date-time }

    InferenceService:
      type: object
      required: [id, name, model, status, created_at]
      properties:
        id:                    { type: string, format: uuid }
        name:                  { type: string }
        model:                 { type: string, description: 创建时冻结的模型名称与版本展示快照 }
        model_version_id:      { type: string, format: uuid, description: 实际部署的不可变模型版本 }
        image_id:              { type: string, description: 创建时从镜像仓库选定的 Registry 镜像 ID；手填 image_ref 时可为缺省 }
        image_ref:             { type: string, nullable: true, description: 创建时解析并冻结的 digest 引用；只读 }
        served_model_name:     { type: string, description: 集群内 OpenAI-compatible 请求使用的 model 值，不代表公网路由 }
        replicas:              { type: integer, minimum: 1, default: 1 }
        ready_replicas:        { type: integer, minimum: 0, default: 0 }
        resources:             { $ref: '#/components/schemas/InferenceServiceResources' }
        placement_mode:        { type: string, enum: [auto, single_node, multi_node], default: auto }
        engine:                { $ref: '#/components/schemas/InferenceServiceEngine', description: 创建时冻结的前端环境变量与完整启动命令；省略表示无租户 env/command。不进入 PATCH }
        gpu_type:              { type: string, nullable: true, deprecated: true, description: v1 兼容投影；新客户端使用 resources.accelerator.spec_id }
        gpu_count_per_pod:     { type: integer, default: 1, deprecated: true, description: v1 兼容投影；不再是资源规格权威字段 }
        max_concurrency:       { type: integer, default: 8, deprecated: true, description: v1 兼容投影；P0 不执行 }
        status:                { type: string, enum: [pending, deploying, running, stopping, stopped, failed] }
        status_reason:         { type: string, nullable: true, description: 稳定的机器可读状态原因码 }
        status_message:        { type: string, nullable: true, description: 脱敏的人类可读状态说明 }
        generation:            { type: integer, minimum: 1 }
        observed_generation:   { type: integer, minimum: 0 }
        current_operation_id:  { type: string, format: uuid, nullable: true }
        invocation_url:        { type: string, format: uri, nullable: true, description: P0 未建设调用网关，固定返回 null }
        endpoint_url:          { type: string, format: uri, nullable: true, deprecated: true, description: v1 兼容字段；P0 固定返回 null，不得返回 ClusterIP 地址 }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time, nullable: true }

    InferenceServiceAccelerator:
      type: object
      description: |
        推理服务每个副本申请的加速器资源。
        spec_id 是 GPU 型号，count_per_replica 是申请卡数，memory 是申请显存（MiB）。
        不填 memory 为整卡，填写 memory 为 vGPU。
      required: [spec_id, count_per_replica]
      properties:
        spec_id:
          type: string
          minLength: 1
          description: GPU 型号，例如 gpu-nvidia-geforce-rtx-4090。只表示型号。历史 -full/-Nx ID 实现剥掉后缀后仍按型号处理。
        count_per_replica:
          type: integer
          minimum: 1
          description: 每个独立副本或 leader-worker group 的申请卡数。整卡和 vGPU 都必填，最小为 1。
        memory:
          type: integer
          minimum: 1
          description: 申请显存，单位 MiB。这是 GPU 显存，不是 resources.memory 的内存预算。省略为整卡；填写为 vGPU。

    InferenceServiceResources:
      type: object
      required: [cpu, memory]
      properties:
        cpu: { type: string, minLength: 1, description: 每个单节点 Pod 或跨节点 group 的 CPU 预算 }
        memory: { type: string, minLength: 1, description: 每个单节点 Pod 或跨节点 group 的内存预算 }
        accelerator:
          $ref: '#/components/schemas/InferenceServiceAccelerator'

    InferenceServiceEngineEnvVar:
      type: object
      required: [name, value]
      additionalProperties: false
      description: |
        前端传入的单个环境变量。创建时冻结。不是 shell 赋值。
        命中平台保留名时实现返回 400 INVALID_ARGUMENT。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: 环境变量名
        value:
          type: string
          minLength: 1
          maxLength: 4096
          description: 环境变量值

    InferenceServiceEngine:
      type: object
      additionalProperties: false
      description: |
        前端在创建请求中传入的环境变量与完整启动命令，创建时冻结，只读回显。
        `command` 是完整 argv，原样作为容器启动命令，不与平台默认 command 拼接、不追加。
        平台仍独占 GPU/Ray 运行时环境变量；命中保留 env 名时实现返回 400 INVALID_ARGUMENT。
        不是 shell 字符串。不进入 PATCH。
      x-ani-reserved-engine-env-names:
        - CUDA_VISIBLE_DEVICES
        - NVIDIA_VISIBLE_DEVICES
        - NVIDIA_DRIVER_CAPABILITIES
        - PYTHONPATH
        - PATH
        - LD_PRELOAD
        - LD_LIBRARY_PATH
        - RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES
      properties:
        env:
          type: array
          maxItems: 32
          description: 前端传入的环境变量；省略或空数组表示不追加租户环境变量
          items:
            $ref: '#/components/schemas/InferenceServiceEngineEnvVar'
        command:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            前端传入的完整启动命令（argv），例如
            ["python3","-m","vllm.entrypoints.openai.api_server","--model","/models/qwen","--host","0.0.0.0","--port","8000"]。
            原样作为容器启动命令，不拼接、不追加平台默认 command。省略表示沿用平台默认启动命令。
          items:
            type: string
            minLength: 1
            maxLength: 4096

    CreateInferenceServiceRequest:
      type: object
      required: [idempotency_key, name, model]
      description: |
        镜像来源二选一，也可同时传：image_id 从镜像仓库选择，image_ref 由用户直接输入。
        同时传入时优先 image_id。创建前固定 digest；两者都缺时由实现返回 400 INVALID_ARGUMENT。
      properties:
        idempotency_key: { type: string, format: uuid }
        name: { type: string }
        model: { type: string, description: v1 兼容必填字段；新客户端传稳定模型版本 UUID }
        model_version_id: { type: string, format: uuid, description: 与 model 指向同一不可变版本 }
        image_id: { type: string, minLength: 1, description: 镜像仓库 Registry 镜像 ID；与 image_ref 至少填一个，同时传入时优先 image_id。创建前固定 digest。 }
        image_ref: { type: string, minLength: 1, description: 用户直接输入的镜像引用；与 image_id 至少填一个，同时传入时优先 image_id。创建前固定 digest。 }
        served_model_name: { type: string, minLength: 1, description: 默认使用服务 name，创建后不可变 }
        replicas: { type: integer, description: 省略时服务按 1 个副本处理 }
        resources: { $ref: '#/components/schemas/InferenceServiceResources' }
        placement_mode: { type: string, enum: [auto, single_node, multi_node], description: 省略时服务按 auto 处理 }
        engine: { $ref: '#/components/schemas/InferenceServiceEngine', description: 可选；前端传入 env 与完整启动命令 command，创建时冻结。省略表示沿用平台默认启动命令和环境 }
        gpu_type: { type: string, deprecated: true, description: v1 兼容输入；新客户端不得发送 }
        gpu_count_per_pod: { type: integer, deprecated: true, description: v1 兼容输入；单独出现时不得推断为 GPU }
        max_concurrency: { type: integer, deprecated: true, description: v1 兼容输入；P0 不执行 }

    UpdateInferenceServiceRequest:
      type: object
      required: [idempotency_key, replicas]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid }
        replicas: { type: integer, minimum: 1 }

    InferenceServiceLifecycleRequest:
      type: object
      required: [idempotency_key, action]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid }
        action: { type: string, enum: [start, stop, restart] }

    CreateModelRequest:
      type: object
      required: [idempotency_key, name, source]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        name:    { type: string }
        source:  { type: string, enum: [upload, huggingface, modelscope] }
        source_url: { type: string }

    InferenceEndpoint:
      type: object
      deprecated: true
      description: 遗留且未绑定 path 的 schema；不是第二种推理产品资源，新实现必须使用 InferenceService
      required: [id, name, model_version_id, status, created_at]
      properties:
        id:               { type: string, format: uuid }
        name:             { type: string }
        model_version_id: { type: string, format: uuid }
        replicas:         { type: integer, default: 1 }
        gpu_profile:      { type: string }
        status:           { type: string, enum: [pending, deploying, running, stopping, stopped, failed] }
        endpoint_url:     { type: string }
        created_at:       { type: string, format: date-time }

    CreateInferenceEndpointRequest:
      type: object
      deprecated: true
      description: 遗留且未绑定 path 的 schema；新客户端不得引用，后续主版本删除
      required: [idempotency_key, name, model_version_id]
      properties:
        idempotency_key:  { type: string, format: uuid }
        name:             { type: string }
        model_version_id: { type: string, format: uuid }
        replicas:         { type: integer, minimum: 1, default: 1 }
        gpu_profile:      { type: string }

    KnowledgeBase:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:              { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        name:            { type: string }
        description:     { type: string }
        embedding_model: { type: string }
        chunk_size:       { type: integer, default: 512 }
        top_k:            { type: integer, default: 5 }
        score_threshold: { type: number, format: float, default: 0.3, description: "相似度阈值，非零覆盖默认值" }
        status:           { type: string, enum: [active, rebuilding, deleted] }
        doc_count:        { type: integer }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time, nullable: true }

    KBDocument:
      type: object
      required: [id, kb_id, file_name, parse_status, created_at]
      properties:
        id:                { type: string, format: uuid }
        tenant_id:         { type: string, format: uuid }
        kb_id:             { type: string, format: uuid }
        file_name:         { type: string }
        file_type:         { type: string, nullable: true, description: "pdf | docx | xlsx | pptx | md | txt" }
        file_size_bytes:   { type: integer, format: int64, minimum: 0 }
        parse_status:      { type: string, enum: [pending, parsing, indexing, ready, failed], description: "解析状态，对齐 kb_service.proto KBDocument.parse_status" }
        chunk_count:       { type: integer, minimum: 0 }
        error_message:     { type: string, nullable: true }
        custom_metadata:   { type: object, additionalProperties: true, nullable: true, description: "客户端自定义元数据（JSONB，≤ 64KB）" }
        created_at:        { type: string, format: date-time }
        parsed_at:         { type: string, format: date-time, nullable: true }

    KBQueryRequest:
      type: object
      required: [question, idempotency_key]
      properties:
        question:                { type: string, minLength: 1, maxLength: 2000 }
        session_id:              { type: string, format: uuid, nullable: true, description: "可选；为空则新建会话" }
        idempotency_key:         { type: string, maxLength: 128, description: "防止重试导致重复计费" }
        top_k:                   { type: integer, default: 5, minimum: 1, maximum: 20 }
        score_threshold:         { type: number, format: float, default: 0.3, minimum: 0.0, maximum: 1.0, description: "相似度阈值，非零覆盖 KB 默认值" }
        inference_service_name:  { type: string, nullable: true, description: "指定 vLLM 推理服务名；为空则用 default" }

    KBQueryResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:  { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              doc_id:    { type: string, format: uuid }
              file_name: { type: string }
              page:      { type: integer }
              content:   { type: string }
              score:     { type: number }
        session_id:    { type: string, format: uuid }
        input_tokens:  { type: integer }
        output_tokens: { type: integer }

    GetDocumentUploadURLRequest:
      type: object
      required: [idempotency_key, file_name, file_type, file_size_bytes, checksum_sha256]
      properties:
        idempotency_key:    { type: string, maxLength: 128, description: "客户端生成，幂等预留 doc_id；重放返回同一 doc" }
        file_name:          { type: string, minLength: 1, maxLength: 255 }
        file_type:          { type: string, enum: [pdf, docx, xlsx, pptx, md, txt] }
        file_size_bytes:    { type: integer, format: int64, minimum: 1, maximum: 104857600, description: "上限 100MB" }
        checksum_sha256:    { type: string, description: "客户端计算的 SHA-256；上传后服务端校验" }
        custom_metadata:    { type: object, additionalProperties: true, nullable: true, description: "客户端自定义元数据（JSONB，≤ 64KB）" }

    GetDocumentUploadURLResponse:
      type: object
      required: [doc_id, upload_url, storage_path]
      properties:
        doc_id:        { type: string, format: uuid, description: "预预留的文档 ID" }
        upload_url:    { type: string, format: uri, description: "MinIO presigned PUT URL（15 分钟有效）" }
        storage_path:  { type: string, description: "MinIO 存储路径；需原样回传给 notifyDocumentUploaded" }

    NotifyDocumentUploadedRequest:
      type: object
      required: [idempotency_key, doc_id, storage_path]
      properties:
        idempotency_key:    { type: string, maxLength: 128, description: "与 getDocumentUploadURL 使用同一键，幂等派发解析任务" }
        doc_id:            { type: string, format: uuid }
        storage_path:      { type: string, description: "由 getDocumentUploadURL 返回的对象存储路径" }

    GpuContainer:
      type: object
      required: [id, name, image, gpu_type, gpu_count, status, created_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        display_name: { type: string, nullable: true }
        image:        { type: string }
        gpu_type:     { type: string }
        gpu_count:    { type: integer, minimum: 1 }
        cpu_cores:    { type: number, nullable: true }
        memory_gb:    { type: number, nullable: true }
        storage_gb:   { type: number, nullable: true }
        status:       { type: string, enum: [pending, running, stopped, failed, deleted] }
        endpoint_url: { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }

    CreateGpuContainerRequest:
      type: object
      required: [idempotency_key, name, image, gpu_type, gpu_count]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        name:         { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        display_name: { type: string, maxLength: 128 }
        image:        { type: string }
        gpu_type:     { type: string }
        gpu_count:    { type: integer, minimum: 1, default: 1 }
        cpu_cores:    { type: number }
        memory_gb:    { type: number }
        storage_gb:   { type: number }
        env:
          type: object
          additionalProperties: { type: string }

    PatchGpuContainerRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid }
        display_name: { type: string, maxLength: 128 }
        replicas:     { type: integer, minimum: 1 }
        env:
          type: object
          additionalProperties: { type: string }

    GpuContainerMetrics:
      type: object
      properties:
        gpu_utilization_pct: { type: number }
        gpu_memory_used_mb:  { type: number }
        gpu_memory_total_mb: { type: number }
        cpu_utilization_pct: { type: number }
        memory_used_mb:      { type: number }
        timestamp:           { type: string, format: date-time }

    GpuContainerVersion:
      type: object
      required: [id, container_id, image, created_at]
      properties:
        id:           { type: string, format: uuid }
        container_id: { type: string, format: uuid }
        image:        { type: string }
        is_current:   { type: boolean }
        created_at:   { type: string, format: date-time }

    AvailableGpu:
      type: object
      required: [gpu_type, available_count, total_count]
      properties:
        gpu_type:        { type: string }
        available_count: { type: integer }
        total_count:     { type: integer }
        node_name:       { type: string, nullable: true }

    Sandbox:
      type: object
      required: [id, name, image, status, created_at, expires_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        image:        { type: string }
        status:       { type: string, enum: [pending, running, paused, expired, deleted] }
        endpoint_url: { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        expires_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }

    CreateSandboxRequest:
      type: object
      required: [idempotency_key, name, image]
      properties:
        idempotency_key: { type: string, format: uuid }
        name:        { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        image:       { type: string }
        ttl_hours:   { type: integer, minimum: 1, maximum: 720, default: 24 }
        cpu_cores:   { type: number }
        memory_gb:   { type: number }
        env:
          type: object
          additionalProperties: { type: string }

    PatchSandboxRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid }
        env:
          type: object
          additionalProperties: { type: string }

    ExtendSandboxRequest:
      type: object
      required: [idempotency_key, extend_hours]
      properties:
        idempotency_key: { type: string, format: uuid }
        extend_hours: { type: integer, minimum: 1, maximum: 720 }

    SecurityEvent:
      type: object
      required: [id, sandbox_id, event_type, severity, occurred_at]
      properties:
        id:          { type: string, format: uuid }
        sandbox_id:  { type: string, format: uuid }
        event_type:  { type: string }
        severity:    { type: string, enum: [info, warning, critical] }
        description: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }

    SecurityOverview:
      type: object
      required: [sandbox_id, total_events, critical_count, warning_count]
      properties:
        sandbox_id:     { type: string, format: uuid }
        total_events:   { type: integer }
        critical_count: { type: integer }
        warning_count:  { type: integer }
        last_event_at:  { type: string, format: date-time, nullable: true }

    TenantMember:
      type: object
      required: [id, user_id, email, role, joined_at]
      properties:
        id:        { type: string, format: uuid }
        user_id:   { type: string, format: uuid }
        email:     { type: string, format: email }
        name:      { type: string, nullable: true }
        role:      { type: string }
        joined_at: { type: string, format: date-time }

    InviteMemberRequest:
      type: object
      required: [idempotency_key, email, role]
      properties:
        idempotency_key: { type: string, format: uuid }
        email: { type: string, format: email }
        role:  { type: string }

    TenantRole:
      type: object
      required: [id, name, permissions]
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: string, nullable: true }
        permissions: { type: array, items: { type: string } }

    SsoConfig:
      type: object
      properties:
        enabled:      { type: boolean }
        provider:     { type: string, enum: [oidc, saml], nullable: true }
        issuer_url:   { type: string, format: uri, nullable: true }
        client_id:    { type: string, nullable: true }
        redirect_url: { type: string, format: uri, nullable: true }
        updated_at:   { type: string, format: date-time, nullable: true }

    UpdateSsoConfigRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid }
        enabled:       { type: boolean }
        provider:      { type: string, enum: [oidc, saml] }
        issuer_url:    { type: string, format: uri }
        client_id:     { type: string }
        client_secret: { type: string }
        redirect_url:  { type: string, format: uri }

    Webhook:
      type: object
      required: [id, url, events, active, created_at]
      properties:
        id:         { type: string, format: uuid }
        url:        { type: string, format: uri }
        events:     { type: array, items: { type: string } }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }

    CreateWebhookRequest:
      type: object
      required: [idempotency_key, url, events]
      properties:
        idempotency_key: { type: string, format: uuid }
        url:    { type: string, format: uri }
        events: { type: array, items: { type: string }, minItems: 1 }
        secret: { type: string }

    # ─ Phase 2 扩展 Schema ──────────────────────────────────────────────────
    InferenceServiceLogEntry:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:  { type: string, format: date-time }
        level:      { type: string, enum: [debug, info, warn, error] }
        message:    { type: string }
        container:  { type: string, nullable: true }
        stream:     { type: string, enum: [stdout, stderr], nullable: true }

    InferenceServiceLogListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/InferenceServiceLogEntry' } }
        next_cursor: { type: string, nullable: true }

    InferenceTestRequest:
      type: object
      required: [idempotency_key, input]
      properties:
        idempotency_key: { type: string, format: uuid }
        input:           { type: object, additionalProperties: true }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300, default: 30 }

    InferenceTestResponse:
      type: object
      required: [output, latency_ms, status]
      properties:
        output:     { type: object, additionalProperties: true }
        latency_ms: { type: integer }
        model_id:   { type: string, nullable: true }
        status:     { type: string, enum: [success, timeout, error] }

    InferenceAccessPolicyScope:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [tenant_default, inference_service, api_key, inference_service_api_key] }
        inference_service_ids: { type: array, items: { type: string, format: uuid } }
        api_key_ids: { type: array, items: { type: string, format: uuid } }

    InferenceAccessPolicyAccess:
      type: object
      required: [allow_all_tenant_keys]
      properties:
        allow_all_tenant_keys: { type: boolean }
        allow_api_key_ids: { type: array, items: { type: string, format: uuid } }
        deny_api_key_ids: { type: array, items: { type: string, format: uuid } }

    InferenceAccessPolicyRateLimits:
      type: object
      properties:
        qps: { type: integer, minimum: 1, nullable: true }
        rpm: { type: integer, minimum: 1, nullable: true }

    InferenceAccessPolicyConcurrency:
      type: object
      properties:
        max_in_flight: { type: integer, minimum: 1, nullable: true }
        lease_ttl_seconds: { type: integer, minimum: 1, maximum: 3600, default: 60 }

    InferenceAccessPolicy:
      type: object
      required: [id, tenant_id, name, status, priority, scope, access, rate_limits, concurrency, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [enabled, disabled] }
        description: { type: string, maxLength: 512, nullable: true }
        priority: { type: integer, minimum: 1, maximum: 10000 }
        scope: { $ref: '#/components/schemas/InferenceAccessPolicyScope' }
        access: { $ref: '#/components/schemas/InferenceAccessPolicyAccess' }
        rate_limits: { $ref: '#/components/schemas/InferenceAccessPolicyRateLimits' }
        concurrency: { $ref: '#/components/schemas/InferenceAccessPolicyConcurrency' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    CreateInferenceAccessPolicyRequest:
      type: object
      required: [idempotency_key, name, scope, access]
      properties:
        idempotency_key: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512, nullable: true }
        status: { type: string, enum: [enabled, disabled], default: enabled }
        priority: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
        scope: { $ref: '#/components/schemas/InferenceAccessPolicyScope' }
        access: { $ref: '#/components/schemas/InferenceAccessPolicyAccess' }
        rate_limits: { $ref: '#/components/schemas/InferenceAccessPolicyRateLimits' }
        concurrency: { $ref: '#/components/schemas/InferenceAccessPolicyConcurrency' }

    PatchInferenceAccessPolicyRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512, nullable: true }
        status: { type: string, enum: [enabled, disabled] }
        priority: { type: integer, minimum: 1, maximum: 10000 }
        scope: { $ref: '#/components/schemas/InferenceAccessPolicyScope' }
        access: { $ref: '#/components/schemas/InferenceAccessPolicyAccess' }
        rate_limits: { $ref: '#/components/schemas/InferenceAccessPolicyRateLimits' }
        concurrency: { $ref: '#/components/schemas/InferenceAccessPolicyConcurrency' }

    InferenceAccessPolicyListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InferenceAccessPolicy' } }
        next_cursor: { type: string, nullable: true }

    InferenceAccessPolicyBinding:
      type: object
      required: [policy_id, inference_service_ids]
      properties:
        policy_id: { type: string, format: uuid }
        inference_service_ids: { type: array, items: { type: string, format: uuid } }

    InferenceAccessPolicyEvent:
      type: object
      required: [id, tenant_id, inference_service_id, decision, reason_code, http_status, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid, nullable: true }
        inference_service_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid, nullable: true }
        key_prefix: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        openai_path: { type: string }
        external_model: { type: string, nullable: true }
        decision: { type: string, enum: [allow, deny, rate_limited, concurrency_limited, policy_unavailable] }
        reason_code: { type: string }
        http_status: { type: integer }
        retry_after_seconds: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    InferenceAccessPolicyEventListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InferenceAccessPolicyEvent' } }
        next_cursor: { type: string, nullable: true }

    InferenceServicePolicies:
      type: object
      required: [service_id, policies]
      properties:
        service_id: { type: string, format: uuid }
        policies: { type: array, items: { $ref: '#/components/schemas/InferenceAccessPolicy' } }

    UpdateInferenceServicePoliciesRequest:
      type: object
      required: [idempotency_key, policy_ids]
      properties:
        idempotency_key: { type: string, format: uuid }
        policy_ids: { type: array, items: { type: string, format: uuid } }

    KBCitation:
      type: object
      required: [id, kb_id, doc_id, file_name, content, created_at]
      properties:
        id:         { type: string, format: uuid }
        kb_id:      { type: string, format: uuid }
        doc_id:     { type: string, format: uuid }
        file_name:  { type: string }
        page:       { type: integer, nullable: true }
        content:    { type: string }
        score:      { type: number, nullable: true }
        created_at: { type: string, format: date-time }

    KBCitationListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/KBCitation' } }
        next_cursor: { type: string, nullable: true }

    KBSession:
      type: object
      required: [id, kb_id, created_at]
      properties:
        id:             { type: string, format: uuid }
        kb_id:          { type: string, format: uuid }
        message_count:  { type: integer }
        last_query:     { type: string, nullable: true }
        created_at:     { type: string, format: date-time }
        last_active_at: { type: string, format: date-time, nullable: true }

    KBSessionListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/KBSession' } }
        next_cursor: { type: string, nullable: true }

    UpdateKBPermissionsRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:  { type: string, format: uuid }
        public_read:      { type: boolean }
        allowed_user_ids: { type: array, items: { type: string } }

    KBConfig:
      type: object
      description: |
        知识库配置（入库 + 问答）。对齐 UX §4.3 概览配置：入库配置区
        （embedding_model / chunk_size / ocr_enabled）与问答配置区
        （top_k / score_threshold / retrieval_strategy）。
      properties:
        embedding_model:    { type: string, description: "嵌入模型名，修改触发全库重建（UX §4.3）" }
        chunk_size:         { type: integer, minimum: 1, maximum: 8192, description: "分块大小（tokens）" }
        ocr_enabled:        { type: boolean, default: false, description: "是否启用 OCR（入库配置）" }
        top_k:              { type: integer, minimum: 1, maximum: 20, description: "问答 TopK" }
        score_threshold:    { type: number, format: float, minimum: 0.0, maximum: 1.0, description: "相似度阈值" }
        retrieval_strategy: { type: string, enum: [vector, hybrid], default: vector, description: "检索策略：向量 / 混合" }

    UpdateKBConfigRequest:
      type: object
      required: [idempotency_key]
      description: |
        更新知识库配置。修改 embedding_model 或 chunk_size 将触发全库重建
        （UX §4.3 保存配置 → Popconfirm「修改配置将触发全库重建」→ POST /rebuild）。
      properties:
        idempotency_key:    { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        embedding_model:    { type: string, description: "嵌入模型名；修改触发全库重建" }
        chunk_size:         { type: integer, minimum: 1, maximum: 8192 }
        ocr_enabled:        { type: boolean }
        top_k:              { type: integer, minimum: 1, maximum: 20 }
        score_threshold:    { type: number, format: float, minimum: 0.0, maximum: 1.0 }
        retrieval_strategy: { type: string, enum: [vector, hybrid] }

    ModelList:
      type: object
      description: |
        知识库可用模型列表（嵌入 + 推理）。对齐 SPEC §5 US-002：
        GET /knowledge-bases/{kb_id}/models 返回当前租户可用的嵌入与推理模型。
      required: [embedding_models, inference_models]
      properties:
        embedding_models:
          type: array
          description: 可用嵌入模型
          items: { $ref: '#/components/schemas/Model' }
        inference_models:
          type: array
          description: 可用推理模型
          items: { $ref: '#/components/schemas/Model' }

    ReparseDocumentRequest:
      type: object
      required: [idempotency_key]
      description: 重新解析知识库文档请求。对齐 SPEC §5 US-002。
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }

    RebuildKnowledgeBaseRequest:
      type: object
      required: [idempotency_key]
      description: 全库重建请求。对齐 SPEC §5 US-002。
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }

    UpdateTenantRoleRequest:
      type: object
      required: [idempotency_key, permissions]
      properties:
        idempotency_key: { type: string, format: uuid }
        name:            { type: string }
        description:     { type: string, nullable: true }
        permissions:     { type: array, items: { type: string }, minItems: 1 }

    WebhookDelivery:
      type: object
      required: [id, webhook_id, event_type, status, attempt_count, created_at]
      properties:
        id:            { type: string, format: uuid }
        webhook_id:    { type: string, format: uuid }
        event_type:    { type: string }
        payload:       { type: object, additionalProperties: true, nullable: true }
        status:        { type: string, enum: [pending, delivered, failed, retrying] }
        http_status:   { type: integer, nullable: true }
        attempt_count: { type: integer }
        created_at:    { type: string, format: date-time }
        delivered_at:  { type: string, format: date-time, nullable: true }

    WebhookDeliveryListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
        next_cursor: { type: string, nullable: true }

    Integration:
      type: object
      required: [id, type, name, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        type:        { type: string, enum: [dingtalk, wechat_work, lark, slack, email, generic_webhook] }
        name:        { type: string }
        status:      { type: string, enum: [active, disabled] }
        webhook_url: { type: string, format: uri, nullable: true }
        created_at:  { type: string, format: date-time }

    IntegrationListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/Integration' } }
        next_cursor: { type: string, nullable: true }

    CreateIntegrationRequest:
      type: object
      required: [idempotency_key, type, name]
      properties:
        idempotency_key: { type: string, format: uuid }
        type:        { type: string, enum: [dingtalk, wechat_work, lark, slack, email, generic_webhook] }
        name:        { type: string }
        webhook_url: { type: string, format: uri }
        config:      { type: object, additionalProperties: true }

    IntegrationBot:
      type: object
      required: [id, integration_id, name, app_id, status, created_at]
      properties:
        id:             { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        name:           { type: string }
        app_id:         { type: string }
        status:         { type: string, enum: [active, disabled] }
        created_at:     { type: string, format: date-time }

    CreateIntegrationBotRequest:
      type: object
      required: [idempotency_key, integration_id, name, app_id, app_secret]
      properties:
        idempotency_key: { type: string, format: uuid }
        integration_id:  { type: string, format: uuid }
        name:            { type: string }
        app_id:          { type: string }
        app_secret:      { type: string }

    # ===== Tenant Plans (配额套餐管理) =====

    TenantPlan:
      type: object
      required: [id, code, name, description, status, tenant_count, created_at, updated_at]
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string, description: "套餐代码" }
        name:         { type: string, description: "套餐名称" }
        description:  { type: string, nullable: true, description: "套餐说明；网关 JSON 始终包含该字段（空则为 null）" }
        status:       { type: string, enum: [draft, active, disabled] }
        tenant_count: { type: integer, format: int64, description: "绑定租户数量（status≠disabled）" }
        created_at:   { type: string, description: "展示时间 YYYY-MM-DD HH:mm:ss（Asia/Shanghai）；非 RFC3339" }
        updated_at:   { type: string, description: "展示时间 YYYY-MM-DD HH:mm:ss（Asia/Shanghai）；非 RFC3339" }

    TenantPlanListItem:
      type: object
      required: [id, code, name, description, status, tenant_count, created_at, updated_at]
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string }
        name:         { type: string }
        description:  { type: string, nullable: true, description: "套餐说明；网关 JSON 始终包含该字段（空则为 null）" }
        status:       { type: string, enum: [draft, active, disabled] }
        tenant_count: { type: integer, format: int64 }
        created_at:   { type: string, description: "展示时间 YYYY-MM-DD HH:mm:ss（Asia/Shanghai）；非 RFC3339" }
        updated_at:   { type: string, description: "展示时间 YYYY-MM-DD HH:mm:ss（Asia/Shanghai）；非 RFC3339" }

    TenantPlanListResponse:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/TenantPlanListItem' } }
        total:       { type: integer, format: int64, description: "满足筛选条件的总条数（用于前端分页）" }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据（网关将空串映射为 null）" }

    CreateTenantPlanRequest:
      type: object
      required: [idempotency_key, code, name]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落；皆空时服务端仍接受，幂等中间件跳过）" }
        code:         { type: string, minLength: 3, maxLength: 40, pattern: '^[a-z0-9-]{3,40}$', description: "套餐代码；小写字母/数字/连字符，长度 3–40；未删除套餐内唯一" }
        name:         { type: string, minLength: 1, maxLength: 64, description: "按 Unicode 码点计长度 1–64" }
        description:  { type: string, maxLength: 512, description: "按 Unicode 码点计长度 ≤512；空串落库为 NULL" }
        quota_limits:
          type: array
          description: "可选；缺省或空数组表示不写限额行。total 为 null 时服务端用 default_quota 物化写入（落库为具体数值，不保留 NULL）"
          items: { $ref: '#/components/schemas/PlanQuotaLimitInput' }

    PlanQuotaLimitInput:
      type: object
      required: [resource_type]
      properties:
        resource_type: { type: string, description: "配额维度标识" }
        total:         { type: integer, format: int64, nullable: true, minimum: 0, description: "限额值；null = 服务端用 default_quota 物化落库（不保留 NULL）" }

    PlanQuotaLimitView:
      type: object
      required: [resource_type, display_name, unit, total]
      properties:
        resource_type: { type: string }
        display_name:  { type: string, description: "展示名（来自 resource_quota_meta）" }
        unit:          { type: string, description: "单位（来自 resource_quota_meta）" }
        total:         { type: integer, format: int64, minimum: 0, description: "展示限额值；写入已物化或查询路径用 default_quota 兜底，不返回 null" }

    PlanQuotaLimitsResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlanQuotaLimitView' } }

    QuotaMetaItem:
      type: object
      required: [resource_type, display_name, unit, default_quota, is_discrete]
      description: 可用配额维度元数据（透传 Core GET /admin/quota-meta；仅 enabled 维度）
      properties:
        resource_type:  { type: string }
        display_name:   { type: string }
        unit:           { type: string }
        default_quota:  { type: integer, format: int64 }
        is_discrete:    { type: boolean, description: "true=整数计数；false=允许小数" }

    QuotaMetaListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuotaMetaItem' } }

    UpdateQuotaLimitsRequest:
      type: object
      required: [idempotency_key, items]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落；皆空时中间件跳过）" }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PlanQuotaLimitInput' }

    UpdateTenantPlanRequest:
      type: object
      required: [idempotency_key]
      description: >
        更新套餐基本信息。name / description 均为可选：
        未传或 null 表示不更新；name 不允许传空串（服务端校验返回 VALIDATION_FAILED），
        description 传空串表示清空。
        长度按 Unicode 码点校验（与服务端 utf8.RuneCountInString 一致）。
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落；皆空时中间件跳过）" }
        name: { type: string, nullable: true, maxLength: 64, minLength: 1, description: "未传/null=不更新；不允许空串；长度 1-64（Unicode 码点）" }
        description: { type: string, nullable: true, maxLength: 512, description: "未传/null=不更新；空串=清空；长度 ≤512（Unicode 码点）" }

    TenantPlanStateChangeRequest:
      type: object
      required: [idempotency_key]
      description: >
        套餐发布/禁用请求体。幂等键可放 body.idempotency_key，
        或请求头 Idempotency-Key（body 缺省时网关回落）。
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落）" }

    BindPlanRequest:
      type: object
      required: [idempotency_key, plan_id]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落；皆空时中间件跳过）" }
        plan_id: { type: string, format: uuid }

    BoundTenant:
      type: object
      required: [id, name, display_name, status]
      description: >
        租户摘要。绑定列表与可绑定列表均只返回 status≠disabled 的租户；
        枚举仍含 disabled 以便与租户状态机一致。
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        display_name: { type: string }
        status:       { type: string, enum: [active, frozen, disabled] }

    BoundTenantsResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BoundTenant' } }

    PlanAuditLog:
      type: object
      required: [id, action, result, details, created_at]
      description: 套餐操作历史摘要；网关 JSON 始终包含 details（无则为 null）
      properties:
        id:         { type: string, format: uuid }
        action:     { type: string }
        result:     { type: string, enum: [success, failure] }
        details:    { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, description: "展示时间 YYYY-MM-DD HH:mm:ss（Asia/Shanghai）；非 RFC3339" }

    PlanAuditLogListResponse:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/PlanAuditLog' } }
        total:       { type: integer, format: int64, description: "满足筛选条件的总条数（用于前端分页）" }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据（网关将空串映射为 null）" }

    IdempotentResult:
      type: object
      required: [id, message]
      properties:
        id:      { type: string, format: uuid }
        message: { type: string }

    # ===== Platform Admins (平台运营账号管理) =====

    PlatformAdminListItem:
      type: object
      required: [id, username, display_name, role, status, source]
      properties:
        id:           { type: string, format: uuid }
        username:     { type: string }
        display_name: { type: string }
        role:         { type: string, enum: [platform-admin, platform-ops, platform-readonly] }
        status:       { type: string, enum: [active, disabled] }
        source:       { type: string, enum: [local, third_party] }
        last_login_at: { type: string, format: date-time, nullable: true }

    PlatformAdminDetail:
      type: object
      required: [id, email, username, display_name, role, status, source, created_at]
      properties:
        id:            { type: string, format: uuid }
        email:         { type: string, format: email }
        username:      { type: string }
        display_name:  { type: string }
        role:          { type: string, enum: [platform-admin, platform-ops, platform-readonly] }
        status:        { type: string, enum: [active, disabled] }
        source:        { type: string, enum: [local, third_party] }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at:    { type: string, format: date-time }

    PlatformAdminListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/PlatformAdminListItem' } }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据" }

    PlatformAdminCreateRequest:
      type: object
      required: [idempotency_key, email, username, display_name, role, password]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        email:           { type: string, format: email, description: "RFC 5322" }
        username:        { type: string, minLength: 1, maxLength: 64, description: "不含冒号" }
        display_name:    { type: string, minLength: 1, maxLength: 128 }
        role:            { type: string, enum: [platform-admin, platform-ops, platform-readonly] }
        password:        { type: string, minLength: 8, maxLength: 64, description: "四类中至少三类" }

    PlatformAdminRoleUpdateRequest:
      type: object
      required: [idempotency_key, role]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        role:            { type: string, enum: [platform-admin, platform-ops, platform-readonly] }

    PlatformRole:
      type: object
      required: [name, label, description, permissions]
      properties:
        name:        { type: string, enum: [platform-admin, platform-ops, platform-readonly] }
        label:       { type: string }
        description: { type: string }
        permissions:
          type: object
          required: [tenant_ops, resource_pool, platform_user, audit_export]
          properties:
            tenant_ops:    { type: string, enum: [read, write, none] }
            resource_pool: { type: string, enum: [read, write, none] }
            platform_user: { type: string, enum: [read, write, none] }
            audit_export:  { type: string, enum: [read, write, none] }

    PlatformRoleListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }

    PlatformAdminAuditLog:
      type: object
      required: [id, action, resource, result, created_at]
      properties:
        id:         { type: string, format: uuid }
        action:     { type: string, description: "如 platform_admin.create / change_role / reset_password / disable / enable / delete" }
        resource:   { type: string }
        result:     { type: string, enum: [success, failed] }
        details:    { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    PlatformAdminAuditLogListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/PlatformAdminAuditLog' } }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据" }

    # ===== Tenant Admins (租户管理员管理) =====

    TenantRef:
      type: object
      required: [id, name, display_name]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        display_name: { type: string }

    AdminWithTenant:
      type: object
      required: [id, email, username, role, status, is_inviting, source, tenant]
      description: >
        跨租户管理员列表项。仅返回 role ∈ (tenant-owner, tenant-admin) 或正在被邀请的用户；
        is_inviting 仅作标记，不影响 role/status（邀请中用户仍展示原有角色，可为 user）。
        列表不返回 created_at/updated_at。
      properties:
        id:           { type: string, format: uuid }
        email:        { type: string, format: email }
        username:     { type: string }
        display_name: { type: string, nullable: true }
        role:         { type: string, enum: [tenant-owner, tenant-admin, user, auditor], description: "租户内角色；列表仅含 owner/admin/邀请中" }
        status:       { type: string, enum: [active, disabled] }
        is_inviting:  { type: boolean, description: "true = 该租户下存在 status='inviting' 的邀请；仅作标记，不影响 role/status" }
        source:       { type: string, enum: [local, third_party] }
        last_login_at: { type: string, format: date-time, nullable: true }
        tenant:       { $ref: '#/components/schemas/TenantRef' }

    AdminDetail:
      type: object
      required: [id, email, username, role, status, is_inviting, source, tenant]
      description: >
        管理员详情（不含 password_hash、无顶层 tenant_id 冗余）；
        相比 AdminWithTenant 额外返回 created_at/updated_at。
      properties:
        id:           { type: string, format: uuid }
        email:        { type: string, format: email }
        username:     { type: string }
        display_name: { type: string, nullable: true }
        role:         { type: string, enum: [tenant-owner, tenant-admin, user, auditor] }
        status:       { type: string, enum: [active, disabled] }
        is_inviting:  { type: boolean }
        source:       { type: string, enum: [local, third_party] }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at:   { type: string, format: date-time, nullable: true, description: "详情响应返回；跨租户列表不返回" }
        updated_at:   { type: string, format: date-time, nullable: true, description: "详情响应返回；跨租户列表不返回" }
        tenant:       { $ref: '#/components/schemas/TenantRef' }

    AdminListResponse:
      type: object
      required: [items]
      description: 跨租户管理员列表（游标分页）
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/AdminWithTenant' } }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据" }

    InvitationResult:
      type: object
      required: [id, token, expire_at, message]
      description: 邀请/重发结果；token 仅本次返回一次，库中仅存 SHA-256 哈希
      properties:
        id:        { type: string, format: uuid, description: "邀请记录 ID" }
        token:     { type: string, description: "原始邀请 token，仅本次返回一次" }
        expire_at: { type: string, format: date-time, description: "过期时间（now()+72h）" }
        message:   { type: string }

    UserPermissions:
      type: object
      required: [user_id, role, permissions]
      description: 指定管理员的 4 维权限模型；仅返回租户成员（tenant_id 非空），平台账户不可查
      properties:
        user_id:     { type: string, format: uuid }
        tenant_id:   { type: string, format: uuid, nullable: true, description: "租户成员非空；平台账户为 null（不可经本端点查询）" }
        role:        { type: string, enum: [tenant-owner, tenant-admin, user, auditor] }
        permissions:
          type: object
          required: [compute, inference, member, transfer]
          properties:
            compute:   { type: string, enum: [read, write, none] }
            inference:  { type: string, enum: [read, write, none] }
            member:     { type: string, enum: [read, write, none] }
            transfer:   { type: string, enum: [read, write, none] }

    ChangeableRolesResponse:
      type: object
      required: [current_role, changeable_roles]
      description: 可变更角色选项（当前为 tenant-owner 时 changeable_roles 为空）
      properties:
        current_role:     { type: string, enum: [tenant-owner, tenant-admin, user, auditor] }
        changeable_roles:
          type: array
          items:
            type: object
            required: [role, label]
            properties:
              role:  { type: string, enum: [user, auditor, tenant-admin] }
              label: { type: string, description: "展示名（普通成员 / 审计员 / 租户管理员）" }

    TenantAdminAuditLog:
      type: object
      required: [id, action, resource, result, created_at]
      properties:
        id:         { type: string, format: uuid }
        action:     { type: string, description: "如 tenant_admin.invite / resend_invitation / change_role / transfer_ownership / reset_password / disable / enable / delete" }
        resource:   { type: string }
        result:     { type: string, enum: [success, failure] }
        user_id:    { type: string, format: uuid, nullable: true }
        details:    { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    TenantAdminAuditLogListResponse:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/TenantAdminAuditLog' } }
        next_cursor: { type: string, nullable: true, description: "下一页游标；null 表示已无更多数据" }

    InviteAdminRequest:
      type: object
      required: [idempotency_key, email, username]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        email:           { type: string, format: email, description: "RFC 5322" }
        username:        { type: string, minLength: 1, maxLength: 64, description: "不含冒号" }

    ResendInvitationRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }

    UpdateRoleRequest:
      type: object
      required: [idempotency_key, role]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        role:            { type: string, enum: [user, auditor, tenant-admin], description: "不可设 tenant-owner" }

    TransferOwnershipRequest:
      type: object
      required: [idempotency_key, target_user_id]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        target_user_id:  { type: string, format: uuid, description: "当前租户内 active 且角色为 tenant-admin 的成员" }

    ResetPasswordRequest:
      type: object
      required: [idempotency_key, new_password]
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
        new_password:    { type: string, minLength: 8, maxLength: 64, description: "四类中至少三类，须与旧密码不同（HTTPS，明文不落日志）" }

    IdempotentOnlyRequest:
      type: object
      required: [idempotency_key]
      description: 仅含幂等键的请求体（用于租户管理员 disable/enable 等）
      properties:
        idempotency_key: { type: string, format: uuid, description: "客户端生成UUID；也可改传请求头 Idempotency-Key（body 缺省时网关回落）" }

paths:
  /models:
    get:
      operationId: listModels
      summary: 获取模型列表
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: read
        boundary: tenant
        principal_kinds: [user]
      parameters:
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 }, description: "按模型名称或显示名称搜索" }
        - { name: source, in: query, schema: { type: string, enum: [upload, huggingface, modelscope, builtin] } }
        - { name: capability, in: query, schema: { type: string, enum: [text-generation, embedding, speech-to-text] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, downloading, ready, error, deleted] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Model' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createModel
      summary: 创建模型元数据记录
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: create
        boundary: tenant
        principal_kinds: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [idempotency_key, name, display_name]
              properties:
                idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
                name:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9.-]{0,62}$'
                display_name: { type: string, minLength: 1, maxLength: 128 }
                description:  { type: string, maxLength: 1024 }
                capabilities:
                  type: array
                  items: { type: string, enum: [text-generation, embedding, speech-to-text] }
      responses:
        "201":
          description: 模型记录已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409": { $ref: '#/components/responses/Conflict' }

  /models/import:
    post:
      operationId: importModel
      summary: 从 HuggingFace 或 ModelScope 异步导入模型
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: create
        boundary: tenant
        principal_kinds: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [source, repo_id, idempotency_key]
              properties:
                source: { type: string, enum: [huggingface, modelscope] }
                repo_id: { type: string, minLength: 3, maxLength: 256 }
                revision: { type: string, default: "main" }
                idempotency_key: { type: string, maxLength: 128 }
                webhook_url: { type: string, format: uri }
      responses:
        "202":
          description: 导入任务已提交
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /models/{model_id}:
    get:
      operationId: getModel
      summary: 获取模型详情
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: read
        boundary: tenant
        principal_kinds: [user]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 模型详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteModel
      summary: 删除模型
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: delete
        boundary: tenant
        principal_kinds: [user]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: 模型仍被未删除的推理服务引用（code=MODEL_IN_USE）
          x-ani-error-codes: [MODEL_IN_USE]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /models/{model_id}/versions:
    get:
      operationId: listModelVersions
      summary: 获取模型版本列表
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: read
        boundary: tenant
        principal_kinds: [user]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: 模型版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ModelVersion' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createModelVersion
      summary: 上传模型版本
      tags: [Models]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      x-ani-authz:
        version: v1
        resource: model
        action: create
        boundary: tenant
        principal_kinds: [user]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [idempotency_key, version, format, storage_path, checksum_sha256, size_bytes]
              properties:
                idempotency_key: { type: string, format: uuid }
                version:         { type: string }
                format:          { type: string, enum: [safetensors, gguf, pytorch] }
                storage_path:    { type: string }
                checksum_sha256: { type: string }
                size_bytes:      { type: integer }
                is_encrypted:    { type: boolean, default: false }
      responses:
        "201":
          description: 模型版本已创建
