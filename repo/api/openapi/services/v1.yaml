      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
      responses:
        "200":
          description: 套餐已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /tenant-plans/{planId}/disable:
    post:
      operationId: disableTenantPlan
      summary: 禁用套餐（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, format: uuid, description: "客户端生成UUID，防重复提交" }
      responses:
        "200":
          description: 套餐已禁用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /tenant-plans/{planId}/tenants:
    get:
      operationId: listTenantPlanBoundTenants
      summary: 查询套餐绑定的租户列表（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 绑定租户列表
          content:
            application/json:
