        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /tenant-plans/{planId}/audit-logs:
    get:
      operationId: listTenantPlanAuditLogs
      summary: 查询套餐操作历史（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "每页数量" }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
        - { name: action, in: query, schema: { type: string }, description: "过滤操作类型" }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
      responses:
        "200":
          description: 操作历史列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAuditLogListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /tenants/{tenantId}/plan:
    post:
      operationId: bindTenantPlan
      summary: 绑定套餐（按套餐限额更新配额）（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindPlanRequest' }
      responses:
        "200":
          description: 套餐已绑定，配额已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  # ===== Tenant Admins (租户管理员管理) =====

  /tenant-admins:
    get:
      operationId: listAllTenantAdmins
      summary: 跨租户管理员列表（仅返回 owner/admin/邀请中）（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantAdmins]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "每页数量" }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid }, description: "可选；按指定租户过滤" }
        - { name: role, in: query, schema: { type: string, enum: [tenant-owner, tenant-admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: is_inviting, in: query, schema: { type: boolean }, description: "true = 仅邀请中" }
        - { name: search, in: query, schema: { type: string }, description: "模糊匹配 email/username" }
      responses:
        "200":
          description: 跨租户管理员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /tenants/{tenantId}/admins/invite:
    post:
      operationId: inviteTenantAdmin
      summary: 邀请租户管理员（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAdminRequest' }
      responses:
        "200":
          description: 邀请已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND / TENANT_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_ADMIN_ALREADY_ADMIN / TENANT_INVITATION_PENDING / IDEMPOTENCY_CONFLICT" }

  /tenants/{tenantId}/admins/{userId}/invitation/resend:
    post:
      operationId: resendTenantAdminInvitation
      summary: 重发租户管理员邀请（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendInvitationRequest' }
      responses:
        "200":
          description: 邀请已重发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_INVITATION_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_INVITATION_SETTLED / IDEMPOTENCY_CONFLICT" }

  /tenants/{tenantId}/admins/{userId}:
    get:
      operationId: getTenantAdminDetail
      summary: 查询管理员详情（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 管理员详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
    delete:
      operationId: deleteTenantAdmin
      summary: 软删除管理员（不幂等，不携带幂等键）（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 管理员已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_OWNER_ROLE_LOCKED" }
