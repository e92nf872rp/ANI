      operationId: getKnowledgeBaseConfig
      summary: 读取知识库配置
      description: |
        返回 KB 入库配置与问答配置。对齐 UX §4.3 概览配置区与 SPEC §5 US-002。
      tags: [KnowledgeBases]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 知识库配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBConfig' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateKnowledgeBaseConfig
      summary: 更新知识库配置
      description: |
        更新 KB 配置。修改 embedding_model 或 chunk_size 将触发全库重建
        （UX §4.3 保存配置 → Popconfirm「修改配置将触发全库重建」）。
        返回更新后的 KnowledgeBase（含新 status）。对齐 SPEC §5 US-002。
      tags: [KnowledgeBases]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKBConfigRequest' }
      responses:
        "200":
          description: 更新后的知识库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBase' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /knowledge-bases/{kb_id}/rebuild:
    post:
      operationId: rebuildKnowledgeBase
      summary: 全库重建
      description: |
        触发全库重建，KB status 转为 rebuilding，重建期间拒绝写操作（409 kb.rebuilding）。
        对齐 SPEC §5 US-002 与 UX §6.2 rebuilding 状态。
