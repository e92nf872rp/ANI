        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_INVITATION_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_INVITATION_SETTLED / IDEMPOTENCY_CONFLICT" }

  /tenants/{tenantId}/admins/{userId}:
    get:
      operationId: getTenantAdminDetail
      summary: 查询管理员详情（需 platform-admin / platform-ops / platform-readonly）
