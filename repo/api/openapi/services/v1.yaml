        "409": { $ref: '#/components/responses/Conflict' }

  # ===== Tenant Plans (配额套餐管理) =====

  /quota-meta:
    get:
      operationId: listQuotaMeta
      summary: 查询可用配额维度元数据（透传 Core；需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      responses:
        "200":
          description: 可用配额维度列表（仅 enabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaMetaListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans:
    get:
      operationId: listTenantPlans
      summary: 查询套餐列表（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "每页数量" }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, disabled] } }
        - { name: search, in: query, schema: { type: string }, description: "模糊匹配 name" }
      responses:
        "200":
          description: 套餐列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPlanListResponse' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（如 status 非法 / cursor 非法）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    post:
      operationId: createTenantPlan
      summary: 创建套餐（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantPlanRequest' }
      responses:
        "200":
          description: 套餐已创建（message 如 "tenant plan created"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict', description: "PLAN_CODE_CONFLICT 或 IDEMPOTENCY_KEY_REUSED" }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}:
    get:
      operationId: getTenantPlan
      summary: 查询套餐详情（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 套餐详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPlan' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    put:
      operationId: updateTenantPlan
      summary: 更新套餐基本信息（name / description）（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantPlanRequest' }
      responses:
        "200":
          description: 套餐基本信息已更新（message 如 "tenant plan updated"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_KEY_REUSED" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    delete:
      operationId: deleteTenantPlan
      summary: 删除套餐（软删除）（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 套餐已删除（message 如 "tenant plan deleted"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_PLAN_IN_USE（仍有非 disabled 绑定租户）" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/quota-limits:
    get:
      operationId: getTenantPlanQuotaLimits
      summary: 查询套餐限额（需 platform-admin / platform-ops / platform-readonly）
      description: >
        返回 plan_quota_limits 与 Core 启用维度的交集视图；
        库中 total 为 NULL 时用 default_quota 兜底展示，并 best-effort 回写（回写失败不影响查询）。
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 套餐限额列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanQuotaLimitsResponse' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    put:
      operationId: updateTenantPlanQuotaLimits
      summary: 修改套餐限额（同步存量租户）（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuotaLimitsRequest' }
      responses:
        "200":
          description: 限额已修改（message 如 "quota limits updated"；存量租户同步失败不回滚套餐限额，写审计并异步重试）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_KEY_REUSED" }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/activate:
    post:
      operationId: activateTenantPlan
      summary: 发布套餐（需 platform-admin / platform-ops）
      description: draft/disabled → active；幂等键必传（body 或 Idempotency-Key 头）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantPlanStateChangeRequest' }
      responses:
        "200":
          description: 套餐已发布（message 如 "tenant plan activated"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "PLAN_STATE_INVALID 或 IDEMPOTENCY_KEY_REUSED" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/disable:
    post:
      operationId: disableTenantPlan
      summary: 禁用套餐（需 platform-admin / platform-ops）
      description: active → disabled；幂等键必传（body 或 Idempotency-Key 头）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantPlanStateChangeRequest' }
      responses:
        "200":
          description: 套餐已禁用（message 如 "tenant plan disabled"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "PLAN_STATE_INVALID 或 IDEMPOTENCY_KEY_REUSED" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/tenants:
    get:
      operationId: listTenantPlanBoundTenants
      summary: 查询套餐绑定的租户列表（需 platform-admin / platform-ops / platform-readonly）
      description: 返回已绑定该套餐且 status≠disabled 的租户摘要（不分页，按 name 排序）。
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 绑定租户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoundTenantsResponse' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/bindable-tenants:
    get:
      operationId: listBindableTenants
      summary: 查询可绑定该套餐的租户列表（需 platform-admin / platform-ops / platform-readonly）
      description: >
        返回 status≠disabled 且尚未绑定该套餐（plan_id IS DISTINCT FROM planId，含未绑定其它套餐）的租户摘要，按 name 排序。
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 可绑定租户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoundTenantsResponse' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenant-plans/{planId}/audit-logs:
    get:
      operationId: listTenantPlanAuditLogs
      summary: 查询套餐操作历史（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantPlans]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "每页数量" }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
      responses:
        "200":
          description: 操作历史列表（无 action/result 服务端过滤）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAuditLogListResponse' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED（planId 非 UUID）" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_PLAN_NOT_FOUND" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

  /tenants/{tenantId}/plan:
    post:
      operationId: bindTenantPlan
      summary: 绑定套餐（按套餐限额更新配额）（需 platform-admin / platform-ops）
      tags: [TenantPlans]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindPlanRequest' }
      responses:
        "200":
          description: 套餐已绑定，配额已更新（id=tenant_id；message 如 "quota bound to plan"）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_NOT_FOUND / TENANT_PLAN_NOT_FOUND / QUOTA_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_STATE_INVALID / QUOTA_ALREADY_EXISTS / IDEMPOTENCY_KEY_REUSED" }
        "422": { $ref: '#/components/responses/UnprocessableEntity', description: "PLAN_NOT_ACTIVE" }
        "502": { $ref: '#/components/responses/BadGateway' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }

