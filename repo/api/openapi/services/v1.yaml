  - { name: Sandboxes, description: "Sandbox（已废弃）" }
  - { name: Tenant, description: "租户管理（成员/角色/SSO/Webhook）" }
  - { name: TenantPlans, description: "配额套餐管理" }
  - { name: TenantAdmins, description: "租户管理员管理（邀请/角色/移交/禁用启用删除/审计）" }
