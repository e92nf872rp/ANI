          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        "200":
          description: 角色已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "TENANT_OWNER_ROLE_LOCKED / IDEMPOTENCY_CONFLICT" }
        "422": { $ref: '#/components/responses/UnprocessableEntity', description: "ROLE_CHANGE_INVALID" }

  /tenants/{tenantId}/transfer-ownership:
    post:
      operationId: transferTenantOwnership
      summary: 移交租户所有者（对 tenant-admin 行发起，原 owner 降级为 admin）（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        "200":
          description: 所有权已移交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_NOT_FOUND / TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_CONFLICT" }
        "422": { $ref: '#/components/responses/UnprocessableEntity', description: "TRANSFER_TARGET_INVALID" }

  /tenants/{tenantId}/admins/{userId}/reset-password:
    post:
      operationId: resetTenantAdminPassword
      summary: 重置管理员密码（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        "200":
          description: 密码已重置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "400": { $ref: '#/components/responses/BadRequest', description: "VALIDATION_FAILED" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_CONFLICT" }
        "422": { $ref: '#/components/responses/UnprocessableEntity', description: "PASSWORD_SAME_AS_OLD" }

  /tenants/{tenantId}/admins/{userId}/disable:
    post:
      operationId: disableTenantAdmin
      summary: 禁用管理员（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdempotentOnlyRequest' }
      responses:
        "200":
          description: 管理员已禁用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_CONFLICT" }
        "422": { $ref: '#/components/responses/UnprocessableEntity', description: "LAST_TENANT_OWNER" }

  /tenants/{tenantId}/admins/{userId}/enable:
    post:
      operationId: enableTenantAdmin
      summary: 启用管理员（需 platform-admin / platform-ops）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdempotentOnlyRequest' }
      responses:
        "200":
          description: 管理员已启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotentResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }
        "409": { $ref: '#/components/responses/Conflict', description: "IDEMPOTENCY_CONFLICT" }

  /tenants/{tenantId}/admins/{userId}/audit-logs:
    get:
      operationId: listTenantAdminAuditLogs
      summary: 查询管理员操作历史（需 platform-admin / platform-ops / platform-readonly）
      tags: [TenantAdmins]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "每页数量" }
        - { name: cursor, in: query, schema: { type: string }, description: "上一页返回的 next_cursor" }
        - { name: action, in: query, schema: { type: string }, description: "过滤操作类型" }
        - { name: result, in: query, schema: { type: string, enum: [success, failed] } }
      responses:
        "200":
          description: 操作历史列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAdminAuditLogListResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound', description: "TENANT_ADMIN_NOT_FOUND" }

