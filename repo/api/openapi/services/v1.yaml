      x-ani-async-resource-type: inference_service
      parameters:
        - { name: service_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInferenceServiceRequest' }
      responses:
        "202":
