    post:
      operationId: reparseKnowledgeBaseDocument
      summary: 重新解析知识库文档
      description: |
        对失败或需重试的文档触发重新解析，parse_status 回到 pending。
        对齐 SPEC §5 US-002 与 UX §6.3 reparse-confirm（Popconfirm「重新解析将覆盖现有分块」）。
        KB 处于 rebuilding 期间返回 409 kb.rebuilding。
      tags: [KnowledgeBases]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doc_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReparseDocumentRequest' }
      responses:
        "202":
          description: 重新解析任务已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { description: 解析服务暂不可用（inference.unavailable）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

