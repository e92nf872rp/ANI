schema_version: ani.operation-policy/v1

error_contract:
  "401":
    response: Unauthorized
    default_code: CREDENTIAL_INVALID
    reason_codes: [CREDENTIAL_INVALID]
  "403":
    response: Forbidden
    default_code: PERMISSION_DENIED
    reason_codes: [PERMISSION_DENIED]
  "409":
    response: Conflict
    default_code: IDEMPOTENCY_CONFLICT
    reason_codes: [IDEMPOTENCY_CONFLICT, IDEMPOTENCY_KEY_EXPIRED, ROLE_IN_USE, VERSION_CONFLICT]
  "429":
    response: RateLimitExceeded
    default_code: AUTH_RATE_LIMITED
    reason_codes: [AUTH_RATE_LIMITED]
  "503":
    response: ServiceUnavailable
    default_code: IAM_UNAVAILABLE
    reason_codes: [AUTHZ_OPERATION_UNREGISTERED, AUTHZ_POLICY_MISMATCH, IAM_UNAVAILABLE, TENANT_IAM_NOT_READY]
  "504":
    response: GatewayTimeout
    default_code: IAM_TIMEOUT
    reason_codes: [IAM_TIMEOUT]

trusted_context:
  strip_client_prefix: x-ani-
  inject_headers:
    - x-ani-authn-method
    - x-ani-boundary
    - x-ani-decision-id
    - x-ani-grant-id
    - x-ani-principal-id
    - x-ani-principal-type
    - x-ani-session-id
    - x-ani-tenant-id

obligation_handlers:
  - name: core.resource_tenant
    owner: core-control
