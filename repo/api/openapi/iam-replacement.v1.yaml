groups:
  - name: core-platform-users
    contract: core-v1
    owner: iam
    disposition: target_replacement
    replacement_gate: DP2-13 caller E2E and DP2-17 zero-reference
    zero_reference: Old operationId, path, Gateway handler, SDK method and Console/BOSS call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-13, DP2-17, DP2-19]
    operations:
      listPlatformUsers: { method: GET, path: /admin/platform-users, replacements: [listPlatformIAMMembers] }
      createPlatformUser: { method: POST, path: /admin/platform-users, replacements: [createPlatformIAMInvitation] }
      getPlatformUser: { method: GET, path: "/admin/platform-users/{userId}", replacements: [getPlatformIAMMember] }
      deletePlatformUser: { method: DELETE, path: "/admin/platform-users/{userId}", replacements: [removePlatformIAMMember] }
      disablePlatformUser: { method: POST, path: "/admin/platform-users/{userId}/disable", replacements: [updatePlatformIAMMember] }
      enablePlatformUser: { method: POST, path: "/admin/platform-users/{userId}/enable", replacements: [updatePlatformIAMMember] }
      resetPlatformUserPassword: { method: POST, path: "/admin/platform-users/{userId}/reset-password", replacements: [requestPasswordAction] }
      updatePlatformUserRole: { method: PUT, path: "/admin/platform-users/{userId}/role", replacements: [bindPlatformIAMRole, unbindPlatformIAMRole] }

  - name: core-tenant-users
    contract: core-v1
    owner: iam
    disposition: target_replacement
    replacement_gate: DP2-13 caller E2E and DP2-17 zero-reference
    zero_reference: Old operationId, path, Gateway handler, SDK method and Console/BOSS call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-09, DP2-13, DP2-17, DP2-19]
    operations:
      listAvailableTenants:
        method: GET
        path: /admin/tenant-admins/available-tenants
        replacements: []
        disposition: final_delete
      listTenantUsers: { method: GET, path: /admin/tenant-users, replacements: [listTenantIAMMembers] }
      listAssignableTenantRoles: { method: GET, path: "/admin/tenants/{tenant_id}/roles", replacements: [listTenantIAMRoles] }
      lookupTenantUser: { method: GET, path: "/admin/tenants/{tenant_id}/user-lookup", replacements: [listTenantIAMMembers] }
      batchGetTenantUsers: { method: GET, path: "/admin/tenants/{tenant_id}/users/batch", replacements: [listTenantIAMMembers] }
      getTenantUser: { method: GET, path: "/admin/tenants/{tenant_id}/users/{user_id}", replacements: [getTenantIAMMember] }
      deleteTenantUser: { method: DELETE, path: "/admin/tenants/{tenant_id}/users/{user_id}", replacements: [removeTenantIAMMember] }
      resetTenantUserPassword: { method: POST, path: "/admin/tenants/{tenant_id}/users/{user_id}/reset-password", replacements: [requestPasswordAction] }
      getTenantUserRole: { method: GET, path: "/admin/tenants/{tenant_id}/users/{user_id}/role", replacements: [getTenantIAMMember] }
      updateTenantUserRole: { method: PUT, path: "/admin/tenants/{tenant_id}/users/{user_id}/role", replacements: [bindTenantIAMRole, unbindTenantIAMRole] }
      updateTenantUserStatus: { method: POST, path: "/admin/tenants/{tenant_id}/users/{user_id}/status", replacements: [updateTenantIAMMember] }

  - name: core-auth
    contract: core-v1
    owner: iam
    disposition: breaking_drift
    replacement_gate: DP2-05 vertical slice, DP2-08 session completion, DP2-10 API Key completion, and DP2-13 caller E2E
    zero_reference: Old operationId/schema, X-API-Key input, JSON refresh, Gateway handler and SDK/frontend call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-05, DP2-06, DP2-07, DP2-08, DP2-10, DP2-13, DP2-17, DP2-19]
    operations:
      listAPIKeys: { method: GET, path: /auth/api-keys, replacements: [listIAMAPIKeys] }
      createAPIKey: { method: POST, path: /auth/api-keys, replacements: [createIAMAPIKey] }
      revokeAPIKey: { method: DELETE, path: "/auth/api-keys/{key_id}", replacements: [revokeIAMAPIKey] }
      logout: { method: POST, path: /auth/logout, replacements: [logoutSession] }
      beginOIDCLogin: { method: POST, path: /auth/oidc/begin, replacements: [beginOIDCLogin], disposition: preserve_semantics }
      passwordLogin: { method: POST, path: /auth/password/login, replacements: [passwordLogin], disposition: preserve_semantics }
      platformPasswordLogin: { method: POST, path: /auth/platform/password/login, replacements: [passwordLogin] }
      refreshToken: { method: POST, path: /auth/refresh, replacements: [refreshSession] }
      completeOIDCLogin: { method: POST, path: /auth/token, replacements: [completeOIDCCallback] }

  - name: services-platform-admins
    contract: services-v1
    owner: iam
    disposition: target_replacement
    replacement_gate: DP2-13 BOSS E2E and DP2-17 zero-reference
    zero_reference: The /api/v1/svc route, old operationId, Gateway handler, SDK method and BOSS call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-13, DP2-15, DP2-17, DP2-19]
    operations:
      listPlatformAdmins: { method: GET, path: /platform-admins, replacements: [listPlatformIAMMembers] }
      createPlatformAdmin: { method: POST, path: /platform-admins, replacements: [createPlatformIAMInvitation] }
      listPlatformAdminRoles: { method: GET, path: /platform-admins/roles, replacements: [listPlatformIAMRoles] }
      getPlatformAdmin: { method: GET, path: "/platform-admins/{userId}", replacements: [getPlatformIAMMember] }
      deletePlatformAdmin: { method: DELETE, path: "/platform-admins/{userId}", replacements: [removePlatformIAMMember] }
      listPlatformAdminAuditLogs: { method: GET, path: "/platform-admins/{userId}/audit-logs", replacements: [listPlatformIAMSecurityAuditEvents] }
      disablePlatformAdmin: { method: POST, path: "/platform-admins/{userId}/disable", replacements: [updatePlatformIAMMember] }
      enablePlatformAdmin: { method: POST, path: "/platform-admins/{userId}/enable", replacements: [updatePlatformIAMMember] }
      resetPlatformAdminPassword: { method: POST, path: "/platform-admins/{userId}/reset-password", replacements: [requestPasswordAction] }
      updatePlatformAdminRole: { method: PUT, path: "/platform-admins/{userId}/role", replacements: [bindPlatformIAMRole, unbindPlatformIAMRole] }

  - name: services-tenant-self-management
    contract: services-v1
    owner: iam
    disposition: target_replacement
    replacement_gate: DP2-09/15 target management and DP2-13 Console E2E, then DP2-17 zero-reference
    zero_reference: The /api/v1/svc route, old operationId, Gateway handler, SDK method and Console call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-07, DP2-09, DP2-13, DP2-15, DP2-17, DP2-19]
    operations:
      listTenantMembers: { method: GET, path: /tenant/members, replacements: [listTenantIAMMembers] }
      inviteTenantMember: { method: POST, path: /tenant/members, replacements: [createTenantIAMInvitation] }
      getTenantMember: { method: GET, path: "/tenant/members/{member_id}", replacements: [getTenantIAMMember] }
      removeTenantMember: { method: DELETE, path: "/tenant/members/{member_id}", replacements: [removeTenantIAMMember] }
      listTenantRoles: { method: GET, path: /tenant/roles, replacements: [listTenantIAMRoles] }
      updateTenantRole: { method: PUT, path: "/tenant/roles/{role_id}", replacements: [updateTenantIAMRole] }
      getSsoConfig:
        method: GET
        path: /tenant/sso
        replacements: []
        disposition: final_delete
      updateSsoConfig:
        method: PUT
        path: /tenant/sso
        replacements: []
        disposition: final_delete

  - name: services-tenant-admins
    contract: services-v1
    owner: iam
    disposition: target_replacement
    replacement_gate: DP2-13 BOSS E2E and DP2-17 zero-reference
    zero_reference: The /api/v1/svc route, old operationId, Gateway handler, SDK method and BOSS call sites are absent outside historical records.
    affects: [DP2-02, DP2-03, DP2-09, DP2-13, DP2-15, DP2-17, DP2-19]
    operations:
      listAllTenantAdmins: { method: GET, path: /tenant-admins, replacements: [listTenantIAMMembers] }
      listAvailableTenantsForAdmin:
        method: GET
        path: /tenant-admins/tenants
        replacements: []
        disposition: final_delete
      inviteTenantAdmin: { method: POST, path: "/tenants/{tenantId}/admins/invite", replacements: [createTenantIAMInvitation] }
      getTenantAdminDetail: { method: GET, path: "/tenants/{tenantId}/admins/{userId}", replacements: [getTenantIAMMember] }
      deleteTenantAdmin: { method: DELETE, path: "/tenants/{tenantId}/admins/{userId}", replacements: [removeTenantIAMMember] }
      listTenantAdminAuditLogs: { method: GET, path: "/tenants/{tenantId}/admins/{userId}/audit-logs", replacements: [listIAMSecurityAuditEvents] }
      disableTenantAdmin: { method: POST, path: "/tenants/{tenantId}/admins/{userId}/disable", replacements: [updateTenantIAMMember] }
      enableTenantAdmin: { method: POST, path: "/tenants/{tenantId}/admins/{userId}/enable", replacements: [updateTenantIAMMember] }
      resendTenantAdminInvitation: { method: POST, path: "/tenants/{tenantId}/admins/{userId}/invitation/resend", replacements: [resendTenantIAMInvitation] }
      resetTenantAdminPassword: { method: POST, path: "/tenants/{tenantId}/admins/{userId}/reset-password", replacements: [requestPasswordAction] }
      getTenantAdminRole: { method: GET, path: "/tenants/{tenantId}/admins/{userId}/role", replacements: [getTenantIAMMember] }
      updateTenantAdminRole: { method: PUT, path: "/tenants/{tenantId}/admins/{userId}/role", replacements: [bindTenantIAMRole, unbindTenantIAMRole] }
      listTenantAssignableRoles: { method: GET, path: "/tenants/{tenantId}/roles", replacements: [listTenantIAMRoles] }
