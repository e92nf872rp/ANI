global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: ani-components
    static_configs:
      - targets: ["ani-gateway:9200"]
        labels:
          ani_service_name: ani-gateway
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: ani-gateway-l2
      - targets: ["auth-service:9201"]
        labels:
          ani_service_name: auth-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: auth-service-l2
      - targets: ["model-service:9203"]
        labels:
          ani_service_name: model-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: model-service-l2
      - targets: ["task-service:9204"]
        labels:
          ani_service_name: task-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: task-service-l2
      - targets: ["inference-service:9204"]
        labels:
          ani_service_name: inference-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: inference-service-l2
      - targets: ["tenant-service:9205"]
        labels:
          ani_service_name: tenant-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: tenant-service-l2
      - targets: ["metering-service:9210"]
        labels:
          ani_service_name: metering-service
          k8s_service_version: p0-0cedae8
          kubernetes_namespace: ani-obs-l2
          pod: metering-service-l2
